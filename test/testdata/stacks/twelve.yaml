# A large stack: twelve services from one file. Ten serve a page on a port
# they only expose, one runs once and ends (as a migration does), and one
# works in the background and has no port at all. Domains go to several of
# them, two to the same one.
x-page: &page
  image: busybox:1.36
  command:
    - sh
    - -c
    - |
      mkdir -p /www
      echo "$$NAME" > /www/index.html
      exec httpd -f -p 8080 -h /www
  expose:
    - "8080"

services:
  gateway:
    <<: *page
    environment: {NAME: gateway}
    depends_on:
      migrate:
        condition: service_completed_successfully
  api:
    <<: *page
    environment: {NAME: api}
  admin:
    <<: *page
    environment: {NAME: admin}
  docs:
    <<: *page
    environment: {NAME: docs}
  auth:
    <<: *page
    environment: {NAME: auth}
  billing:
    <<: *page
    environment: {NAME: billing}
  search:
    <<: *page
    environment: {NAME: search}
  media:
    <<: *page
    environment: {NAME: media}
  mailer:
    <<: *page
    environment: {NAME: mailer}
  status:
    <<: *page
    environment: {NAME: status}
  worker:
    image: busybox:1.36
    command: ["sh", "-c", "while true; do echo working; sleep 30; done"]
  migrate:
    image: busybox:1.36
    command: ["sh", "-c", "echo migrated"]
    restart: "no"
