# name: Web-Check
# about: All-in-one OSINT tool for analysing any website.
# docs: https://github.com/lissy93/web-check#readme
# website: https://web-check.xyz/
# categories: monitoring, cms
# source: coolify
services:
  web-check:
    image: lissy93/web-check:latest
    environment:
      - SERVICE_URL_WEBCHECK_3000
    healthcheck:
      test:
        - CMD-SHELL
        - 'wget -qO- http://127.0.0.1:3000/'
      interval: 5s
      timeout: 20s
      retries: 10
