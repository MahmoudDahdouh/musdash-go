# name: Wanderer
# about: Wanderer is a self-hosted mapping and geolocation platform powered by Meilisearch, PocketBase, and a web frontend.
# docs: https://wanderer.to/run/installation/docker
# website: https://wanderer.to/
# categories: home
# source: dokploy
services:
  search:
    image: getmeili/meilisearch:v1.11.3
    environment:
      MEILI_URL: http://search:7700
      MEILI_MASTER_KEY: ${SERVICE_PASSWORD_MEILI_MASTER_KEY}
      MEILI_NO_ANALYTICS: "true"
      SERVICE_FQDN_SEARCH_7700:
    volumes:
      - search-data:/meili_data/data.ms
    restart: unless-stopped
    healthcheck:
      test: curl --fail http://localhost:7700/health || exit 1
      interval: 15s
      retries: 10
      start_period: 20s
      timeout: 10s
  db:
    image: flomp/wanderer-db:latest
    depends_on:
      search:
        condition: service_healthy
    environment:
      MEILI_URL: http://search:7700
      MEILI_MASTER_KEY: ${SERVICE_PASSWORD_MEILI_MASTER_KEY}
      POCKETBASE_ENCRYPTION_KEY: ${SERVICE_PASSWORD_POCKETBASE_KEY}
      ORIGIN: ${SERVICE_URL_WEB}
      SERVICE_FQDN_DB_8090:
    volumes:
      - db-data:/pb_data
    restart: unless-stopped
    healthcheck:
      test: wget --spider -q http://localhost:8090/health || exit 1
      interval: 15s
      retries: 10
      start_period: 20s
      timeout: 10s
  web:
    image: flomp/wanderer-web:latest
    depends_on:
      search:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      MEILI_URL: http://search:7700
      MEILI_MASTER_KEY: ${SERVICE_PASSWORD_MEILI_MASTER_KEY}
      ORIGIN: ${SERVICE_URL_WEB}
      BODY_SIZE_LIMIT: Infinity
      PUBLIC_POCKETBASE_URL: http://db:8090
      PUBLIC_DISABLE_SIGNUP: "false"
      UPLOAD_FOLDER: /app/uploads
      UPLOAD_USER: ${SERVICE_USER_UPLOAD_USER}
      UPLOAD_PASSWORD: ${SERVICE_PASSWORD_UPLOAD_PASSWORD}
      PUBLIC_VALHALLA_URL: https://valhalla1.openstreetmap.de
      PUBLIC_NOMINATIM_URL: https://nominatim.openstreetmap.org
      SERVICE_FQDN_WEB_3000:
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: curl --fail http://localhost:3000/ || exit 1
      interval: 15s
      retries: 10
      start_period: 20s
      timeout: 10s
volumes:
  search-data:
  db-data:
  uploads:
