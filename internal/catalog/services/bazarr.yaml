# name: Bazarr
# about: Bazarr is a companion application to Sonarr and Radarr that manages and downloads subtitles based on your requirements.
# docs: https://wiki.bazarr.media/
# website: https://www.bazarr.media/
# categories: media
# source: dokploy
services:
  bazarr:
    image: lscr.io/linuxserver/bazarr:1.5.1
    restart: unless-stopped
    expose:
      - 6767
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - SERVICE_FQDN_BAZARR_6767
    volumes:
      - config:/config
      - bazarr-movies:/movies
      - bazarr-tv:/tv
volumes:
  config:
  bazarr-movies:
  bazarr-tv:
