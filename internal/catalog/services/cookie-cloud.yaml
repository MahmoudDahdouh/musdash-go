# name: CookieCloud
# about: CookieCloud lets you sync and manage browser cookies across devices securely using a self-hosted backend.
# docs: https://github.com/easychen/cookiecloud#readme
# website: https://github.com/easychen/cookiecloud
# categories: devtools
# source: dokploy
services:
  cookiecloud:
    image: easychen/cookiecloud:latest
    restart: unless-stopped
    expose:
      - 8088
    volumes:
      - cookiecloud-data:/data/api/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8088"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      - SERVICE_FQDN_COOKIECLOUD_8088
volumes:
  cookiecloud-data:
