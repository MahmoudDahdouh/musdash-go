# name: Wingfit
# about: A minimal fitness app for planning workouts, tracking personal records and importing smartwatch data.
# docs: https://github.com/itskovacs/wingfit#getting_started
# website: https://wingfit.fr
# categories: home
# source: musdash
services:
  wingfit:
    image: ghcr.io/itskovacs/wingfit:5
    environment:
      - SERVICE_FQDN_WINGFIT_8000
      - SECRET_KEY=${SERVICE_HEX_64_WINGFIT}
      - REGISTER_ENABLE=${REGISTER_ENABLE:-true}
    volumes:
      - wingfit-storage:/app/storage
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/info')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
volumes:
  wingfit-storage:
