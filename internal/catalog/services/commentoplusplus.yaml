# name: Commento++
# about: Commento++ is a free, open-source application designed to provide a fast, lightweight comments box that you can embed in your static website.
# docs: https://commento.io/
# categories: communication, cms
# source: dokploy
services:
  commentoplusplus:
    image: caroga/commentoplusplus:v1.8.7
    expose:
      - "8080"
    environment:
      - COMMENTO_ORIGIN=${SERVICE_URL_COMMENTOPLUSPLUS}
      - COMMENTO_POSTGRES=postgres://postgres:${SERVICE_PASSWORD_POSTGRES_PASSWORD}@postgres:5432/postgres?sslmode=disable
      - COMMENTO_ENABLE_WILDCARDS=true
      - SERVICE_FQDN_COMMENTOPLUSPLUS_8080
    depends_on:
      - postgres
  postgres:
    image: postgres:11
    environment:
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
volumes:
  postgres-data:
