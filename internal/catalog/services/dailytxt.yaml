# name: DailyTxT
# about: An encrypted diary and journal web app that stores entries as JSON files, with no database.
# docs: https://github.com/PhiTux/DailyTxT#installation
# website: https://github.com/PhiTux/DailyTxT
# categories: productivity, docs
# source: musdash
services:
  dailytxt:
    image: phitux/dailytxt:2.6.4
    environment:
      - SERVICE_FQDN_DAILYTXT_80
      - SECRET_TOKEN=${SERVICE_BASE64_DAILYTXT}
      - INDENT=4
      - ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-true}
      - ADMIN_PASSWORD=${SERVICE_PASSWORD_ADMIN}
      - LOGOUT_AFTER_DAYS=${LOGOUT_AFTER_DAYS:-40}
    volumes:
      - dailytxt-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
volumes:
  dailytxt-data:
