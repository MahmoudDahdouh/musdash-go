# name: Open WebUI
# about: User-friendly AI Interface (Supports Ollama, OpenAI API, ...).
# docs: https://docs.openwebui.com/getting-started/quick-start
# website: https://openwebui.com/
# categories: ai, git, automation
# source: coolify
services:
  open-webui:
    image: "ghcr.io/open-webui/open-webui:main"
    volumes:
      - "open-webui:/app/backend/data"
    environment:
      - SERVICE_URL_OPENWEBUI_8080
    healthcheck:
      test:
        - CMD
        - curl
        - "-f"
        - "http://127.0.0.1:8080"
      interval: 5s
      timeout: 30s
      retries: 10
volumes:
  open-webui: null
