# name: Gatus
# about: Gatus is an automated service health dashboard for monitoring HTTP, DNS, TCP, ICMP, and other endpoints.
# docs: https://github.com/TwiN/gatus#docker
# website: https://gatus.io/
# categories: monitoring
# source: dokploy
services:
  gatus:
    image: ghcr.io/twin/gatus:v5.36.0
    restart: unless-stopped
    expose:
      - 8080
    volumes:
      - gatus-data:/data
    environment:
      - SERVICE_FQDN_GATUS_8080
    configs:
      - source: gatus-config-yaml
        target: /config/config.yaml
volumes:
  gatus-data:
configs:
  gatus-config-yaml:
    content: |
      storage:
        type: sqlite
        path: /data/data.db

      ui:
        title: Gatus
        header: Gatus

      endpoints:
        - name: Example website
          group: external
          url: "https://example.org/"
          interval: 5m
          conditions:
            - "[STATUS] == 200"
            - "[CERTIFICATE_EXPIRATION] > 48h"
