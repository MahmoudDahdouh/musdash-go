# name: Open Design
# about: Open Design is a local-first, open-source design tool with native desktop apps, a large library of design systems, and an extensible plugin ecosystem…
# docs: https://open-design.ai
# categories: media
# source: dokploy
services:
  open-design:
    image: ghcr.io/nexu-io/od:0.16.1
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=192
      OD_BIND_HOST: 0.0.0.0
      OD_PORT: 7456
      OD_API_TOKEN: ${SERVICE_PASSWORD_API_TOKEN}
      OD_ALLOWED_ORIGINS: ${SERVICE_URL_OPEN_DESIGN},${SERVICE_URL_OPEN_DESIGN}
      OD_DISABLE_API_AUTH: "1"
      SERVICE_FQDN_OPEN_DESIGN_7456:
    volumes:
      - open_design_data:/app/.od
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7456/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
volumes:
  open_design_data:
