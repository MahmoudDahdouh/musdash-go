# name: Chromium
# about: Chromium is an open-source browser project that is designed to provide a safer, faster, and more stable way for all users to experience the web in a…
# docs: https://docs.linuxserver.io/images/docker-chromium
# categories: devtools
# source: dokploy
services:
  chromium:
    image: lscr.io/linuxserver/chromium:5f5dd27e-ls102
    expose:
      - "3000"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - SERVICE_FQDN_CHROMIUM_3000
    volumes:
      - config:/config
volumes:
  config:
