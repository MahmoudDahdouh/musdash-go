# name: PostgreSQL with PgDog
# about: PostgreSQL database with PgDog connection pooler, load balancer, and horizontal scaling proxy.
# docs: https://docs.pgdog.dev
# website: https://pgdog.dev
# categories: database, networking
# source: dokploy
# connect: true
services:
  postgres-pgdog:
    image: ${PGDOG_IMAGE:-ghcr.io/pgdogdev/pgdog:v0.1.26}
    restart: unless-stopped
    environment:
      - RUST_LOG=${RUST_LOG:-info}
    depends_on:
      postgres:
        condition: service_healthy
    configs:
      - source: postgres-pgdog-pgdog-toml
        target: /pgdog/pgdog.toml
      - source: postgres-pgdog-users-toml
        target: /pgdog/users.toml
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18-alpine}
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${SERVICE_USER_POSTGRES_USER}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SERVICE_USER_POSTGRES_USER} -d ${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres-data:
configs:
  postgres-pgdog-pgdog-toml:
    content: |
      [general]
      host = "0.0.0.0"
      port = 6432

      [[databases]]
      name = "postgres"
      host = "postgres"
      port = 5432
  postgres-pgdog-users-toml:
    content: |
      [[users]]
      name = "${SERVICE_USER_POSTGRES_USER}"
      database = "postgres"
      password = "${SERVICE_PASSWORD_POSTGRES_PASSWORD}"
