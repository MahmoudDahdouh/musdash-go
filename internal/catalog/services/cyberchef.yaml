# name: CyberChef
# about: The Cyber Swiss Army Knife - a web app for encryption, encoding, compression and data analysis.
# docs: https://github.com/gchq/CyberChef
# categories: security, devtools
# source: coolify
services:
  cyberchef:
    image: ghcr.io/gchq/cyberchef:latest
    platform: linux/amd64
    environment:
      - SERVICE_URL_CYBERCHEF_8080
    volumes:
      - cyberchef-data:/app/data
    healthcheck:
      test:
        - CMD
        - curl
        - '-f'
        - 'http://127.0.0.1:8080'
      interval: 30s
      timeout: 10s
      retries: 3
volumes:
  cyberchef-data:
