# name: GitLab CE
# about: GitLab Community Edition is a free and open source platform for managing Git repositories, CI/CD pipelines, and project management.
# docs: https://docs.gitlab.com/ee/
# website: https://gitlab.com/
# categories: git, productivity
# source: dokploy
services:
  gitlab:
    image: gitlab/gitlab-ce:19.1.2-ce.0
    restart: unless-stopped
    shm_size: "256m"
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url '${SERVICE_URL_GITLAB}'
        nginx['listen_port'] = 80
        nginx['listen_https'] = false
        gitlab_rails['initial_root_password'] = '${SERVICE_PASSWORD_GITLAB_ROOT_PASSWORD}'
        gitlab_rails['gitlab_email_enabled'] = false
        puma['worker_processes'] = 0
        sidekiq['concurrency'] = 10
        prometheus_monitoring['enable'] = false
      SERVICE_FQDN_GITLAB_80:
    volumes:
      - gitlab_config:/etc/gitlab
      - gitlab_logs:/var/log/gitlab
      - gitlab_data:/var/opt/gitlab
volumes:
  gitlab_config:
  gitlab_logs:
  gitlab_data:
