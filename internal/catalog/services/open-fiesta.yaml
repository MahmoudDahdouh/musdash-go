# name: Open Fiesta
# about: Open Fiesta is an open-source AI chat and inference UI, supporting multiple backends such as OpenRouter, Gemini, and Ollama.
# docs: https://github.com/jaainil/open-fiesta#docker-support
# website: https://github.com/jaainil/open-fiesta
# categories: ai
# source: dokploy
services:
  ai_fiesta:
    image: ghcr.io/jaainil/open-fiesta-ghcr:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      UNSTABLE_INFERENCE_API_KEY: ${UNSTABLE_INFERENCE_API_KEY:-}
      OLLAMA_URL: ${OLLAMA_URL:-}
      SERVICE_FQDN_AI_FIESTA_3000:
