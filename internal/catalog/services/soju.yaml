# name: Soju
# about: A user-friendly IRC bouncer with a modern web interface.
# docs: https://soju.im/
# categories: communication
# source: coolify
services:
  soju:
    image: codeberg.org/emersion/soju:latest
    volumes:
      - soju-db:/db
      - soju-uploads:/uploads
      - soju-run:/run/soju
    networks:
      default:
        aliases:
          - gamja-backend
    configs:
      - source: soju-soju-config
        target: /soju-config
  gamja:
    image: codeberg.org/emersion/gamja:latest
    environment:
      - SERVICE_FQDN_GAMJA_80
    depends_on:
      - soju
volumes:
  soju-db:
  soju-uploads:
  soju-run:
configs:
  soju-soju-config:
    content: |
      db sqlite3 /db/main.db
      message-store db
      file-upload fs /uploads/
      listen irc+insecure://0.0.0.0:6667
      listen ws+insecure://0.0.0.0:80
      listen unix+admin:///run/soju/admin
