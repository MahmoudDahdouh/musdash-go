# name: Nexus (ARM)
# about: Open source Universal Repository Manager (ARM version, community edition), default credentials: admin/admin123.
# docs: https://help.sonatype.com/en/sonatype-nexus-repository.html
# categories: devtools
# source: coolify
services:
  nexus:
    image: sonatypecommunity/nexus3:latest
    environment:
      - SERVICE_URL_NEXUS_8081
      - NEXUS_SECURITY_RANDOMPASSWORD=false
      - INSTALL4J_ADD_VM_PARAMS=-Xms2703m -Xmx2703m -XX:MaxDirectMemorySize=2703m -Djava.util.prefs.userRoot=/nexus-data/javaprefs
    volumes:
      - nexus_data:/nexus-data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/service/rest/v1/status"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 60s
volumes:
  nexus_data:
