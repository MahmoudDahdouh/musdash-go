# name: Garage S3 with Web UI
# about: Garage is an open-source distributed object storage service tailored for self-hosting.
# docs: https://garagehq.deuxfleurs.fr/documentation/quick-start/
# website: https://garagehq.deuxfleurs.fr
# categories: storage
# source: dokploy
services:
  garage:
    image: dxflrs/garage:v2.0.0
    volumes:
      - garage-storage:/var/lib/garage
      - garage-storage:/var/lib/garage
    restart: unless-stopped
    expose:
      - 3900
      - 3901
      - 3902
      - 3903
    environment:
      - SERVICE_FQDN_GARAGE_3900
    configs:
      - source: garage-garage-toml
        target: /etc/garage.toml
  garage-webui:
    image: khairul169/garage-webui:1.1.0
    restart: unless-stopped
    expose:
      - 3909
    environment:
      - AUTH_USER_PASS=${AUTH_USER_PASS:-}
      - API_BASE_URL=${API_BASE_URL:-http://garage:3903}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-http://garage:3900}
      - SERVICE_FQDN_GARAGE_WEBUI_3909
    configs:
      - source: garage-webui-garage-toml
        target: /etc/garage.toml
volumes:
  garage-storage:
configs:
  garage-garage-toml:
    content: |
      metadata_dir = "/var/lib/garage/meta"
      data_dir = "/var/lib/garage/data"
      db_engine = "sqlite"
      metadata_auto_snapshot_interval = "6h"

      replication_factor = 1
      compression_level = 2

      rpc_bind_addr = "[::]:3901"
      rpc_public_addr = "localhost:3901" # Required
      rpc_secret = "${SERVICE_HEX_64_FILE1}"

      [s3_api]
      s3_region = "garage"
      api_bind_addr = "[::]:3900"
      root_domain = ".s3.domain.com"

      [s3_web] # Optional, if you want to expose bucket as web
      bind_addr = "[::]:3902"
      root_domain = ".web.domain.com"
      index = "index.html"

      [admin] # Required
      api_bind_addr = "[::]:3903"
      admin_token = "${SERVICE_BASE64_ADMIN_TOKEN}"
      metrics_require_token = true
      metrics_token = "${SERVICE_BASE64_METRICS_TOKEN}"
  garage-webui-garage-toml:
    content: |
      metadata_dir = "/var/lib/garage/meta"
      data_dir = "/var/lib/garage/data"
      db_engine = "sqlite"
      metadata_auto_snapshot_interval = "6h"

      replication_factor = 1
      compression_level = 2

      rpc_bind_addr = "[::]:3901"
      rpc_public_addr = "localhost:3901" # Required
      rpc_secret = "${SERVICE_HEX_64_FILE1}"

      [s3_api]
      s3_region = "garage"
      api_bind_addr = "[::]:3900"
      root_domain = ".s3.domain.com"

      [s3_web] # Optional, if you want to expose bucket as web
      bind_addr = "[::]:3902"
      root_domain = ".web.domain.com"
      index = "index.html"

      [admin] # Required
      api_bind_addr = "[::]:3903"
      admin_token = "${SERVICE_BASE64_ADMIN_TOKEN}"
      metrics_require_token = true
      metrics_token = "${SERVICE_BASE64_METRICS_TOKEN}"
