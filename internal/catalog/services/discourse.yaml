# name: Discourse
# about: Discourse is a modern forum software for your community. Use it as a mailing list, discussion forum, or long-form chat room.
# docs: https://meta.discourse.org/
# website: https://www.discourse.org/
# categories: communication
# source: dokploy
services:
  discourse-db:
    image: pgvector/pgvector:pg16
    volumes:
      - discourse-postgresql-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: discourse
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES_PASSWORD}
      POSTGRES_DB: discourse
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discourse -d discourse"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  discourse-redis:
    image: redis:7-alpine
    volumes:
      - discourse-redis-data:/data
    command: redis-server --requirepass ${SERVICE_PASSWORD_REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${SERVICE_PASSWORD_REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  discourse-app:
    image: discourse/discourse:2026.1.4
    volumes:
      - discourse-data:/shared
    depends_on:
      discourse-db:
        condition: service_healthy
      discourse-redis:
        condition: service_healthy
    environment:
      DISCOURSE_HOSTNAME: ${SERVICE_FQDN_DISCOURSE_APP}
      DISCOURSE_DB_HOST: discourse-db
      DISCOURSE_DB_PORT: 5432
      DISCOURSE_DB_USERNAME: discourse
      DISCOURSE_DB_PASSWORD: ${SERVICE_PASSWORD_POSTGRES_PASSWORD}
      DISCOURSE_DB_NAME: discourse
      DISCOURSE_REDIS_HOST: discourse-redis
      DISCOURSE_REDIS_PORT: 6379
      DISCOURSE_REDIS_PASSWORD: ${SERVICE_PASSWORD_REDIS_PASSWORD}
      DISCOURSE_DEVELOPER_EMAILS: ${ADMIN_EMAIL:?Set an email address}
      SERVICE_FQDN_DISCOURSE_APP_80:
    expose:
      - 80
    restart: unless-stopped
volumes:
  discourse-postgresql-data:
  discourse-redis-data:
  discourse-data:
