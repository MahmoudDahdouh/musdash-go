# name: Huly
# about: Huly â€” All-in-One Project Management Platform (alternative to Linear, Jira, Slack, Notion, Motion).
# docs: https://docs.huly.io/
# website: https://huly.io/
# categories: productivity, communication
# source: dokploy
services:
  nginx:
    image: "nginx:1.21.3"
    expose:
      - 80
    restart: unless-stopped
    environment:
      - SERVICE_FQDN_NGINX_80
    configs:
      - source: nginx-volumes-nginx-huly-nginx
        target: /etc/nginx/conf.d/default.conf
  mongodb:
    image: "mongo:7-jammy"
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - db:/data/db
    restart: unless-stopped
  minio:
    image: "minio/minio:RELEASE.2024-11-07T00-52-20Z"
    command: server /data --address ":9000" --console-address ":9001"
    volumes:
      - files:/data
    restart: unless-stopped
  elastic:
    image: "elasticsearch:7.14.2"
    command: |
      /bin/sh -c "./bin/elasticsearch-plugin list | grep -q ingest-attachment || yes | ./bin/elasticsearch-plugin install --silent ingest-attachment;
      /usr/local/bin/docker-entrypoint.sh eswrapper"
    volumes:
      - elastic:/usr/share/elasticsearch/data
    environment:
      - ELASTICSEARCH_PORT_NUMBER=9200
      - BITNAMI_DEBUG=true
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms1024m -Xmx1024m
      - http.cors.enabled=true
      - http.cors.allow-origin=http://localhost:8082
    healthcheck:
      interval: 20s
      retries: 10
      test: curl -s http://localhost:9200/_cluster/health | grep -vq '"status":"red"'
    restart: unless-stopped
  rekoni:
    image: hardcoreeng/rekoni-service:${HULY_VERSION:-v0.6.468}
    environment:
      - SECRET=${SERVICE_BASE64_64_HULY_SECRET}
    deploy:
      resources:
        limits:
          memory: 500M
    restart: unless-stopped
  transactor:
    image: hardcoreeng/transactor:${HULY_VERSION:-v0.6.468}
    environment:
      - SERVER_PORT=3333
      - SERVER_SECRET=${SERVICE_BASE64_64_HULY_SECRET}
      - SERVER_CURSOR_MAXTIMEMS=30000
      - DB_URL=mongodb://mongodb:27017
      - MONGO_URL=mongodb://mongodb:27017
      - STORAGE_CONFIG=minio|minio?accessKey=minioadmin&secretKey=minioadmin
      - FRONT_URL=http://localhost:8087
      - ACCOUNTS_URL=http://account:3000
      - FULLTEXT_URL=http://fulltext:4700
      - STATS_URL=http://stats:4900
      - LAST_NAME_FIRST=${LAST_NAME_FIRST:-true}
    restart: unless-stopped
  collaborator:
    image: hardcoreeng/collaborator:${HULY_VERSION:-v0.6.468}
    environment:
      - COLLABORATOR_PORT=3078
      - SECRET=${SERVICE_BASE64_64_HULY_SECRET}
      - ACCOUNTS_URL=http://account:3000
      - DB_URL=mongodb://mongodb:27017
      - STATS_URL=http://stats:4900
      - STORAGE_CONFIG=minio|minio?accessKey=minioadmin&secretKey=minioadmin
    restart: unless-stopped
  account:
    image: hardcoreeng/account:${HULY_VERSION:-v0.6.468}
    environment:
      - SERVER_PORT=3000
      - SERVER_SECRET=${SERVICE_BASE64_64_HULY_SECRET}
      - DB_URL=mongodb://mongodb:27017
      - MONGO_URL=mongodb://mongodb:27017
      - TRANSACTOR_URL=ws://transactor:3333;ws${SECURE:-}://${SERVICE_FQDN_NGINX}/_transactor
      - STORAGE_CONFIG=minio|minio?accessKey=minioadmin&secretKey=minioadmin
      - FRONT_URL=http://front:8080
      - STATS_URL=http://stats:4900
      - MODEL_ENABLED=*
      - ACCOUNTS_URL=http://localhost:3000
      - ACCOUNT_PORT=3000
    restart: unless-stopped
  workspace:
    image: hardcoreeng/workspace:${HULY_VERSION:-v0.6.468}
    environment:
      - SERVER_SECRET=${SERVICE_BASE64_64_HULY_SECRET}
      - DB_URL=mongodb://mongodb:27017
      - MONGO_URL=mongodb://mongodb:27017
      - TRANSACTOR_URL=ws://transactor:3333;ws${SECURE:-}://${SERVICE_FQDN_NGINX}/_transactor
      - STORAGE_CONFIG=minio|minio?accessKey=minioadmin&secretKey=minioadmin
      - MODEL_ENABLED=*
      - ACCOUNTS_URL=http://account:3000
      - STATS_URL=http://stats:4900
    restart: unless-stopped
  front:
    image: hardcoreeng/front:${HULY_VERSION:-v0.6.468}
    environment:
      - SERVER_PORT=8080
      - SERVER_SECRET=${SERVICE_BASE64_64_HULY_SECRET}
      - LOVE_ENDPOINT=http${SECURE:-}://${SERVICE_FQDN_NGINX}/_love
      - ACCOUNTS_URL=http${SECURE:-}://${SERVICE_FQDN_NGINX}/_accounts
      - REKONI_URL=http${SECURE:-}://${SERVICE_FQDN_NGINX}/_rekoni
      - CALENDAR_URL=http${SECURE:-}://${SERVICE_FQDN_NGINX}/_calendar
      - GMAIL_URL=http${SECURE:-}://${SERVICE_FQDN_NGINX}/_gmail
      - TELEGRAM_URL=http${SECURE:-}://${SERVICE_FQDN_NGINX}/_telegram
      - STATS_URL=http${SECURE:-}://${SERVICE_FQDN_NGINX}/_stats
      - UPLOAD_URL=/files
      - ELASTIC_URL=http://elastic:9200
      - COLLABORATOR_URL=ws${SECURE:-}://${SERVICE_FQDN_NGINX}/_collaborator
      - STORAGE_CONFIG=minio|minio?accessKey=minioadmin&secretKey=minioadmin
      - DB_URL=mongodb://mongodb:27017
      - MONGO_URL=mongodb://mongodb:27017
      - TITLE=${TITLE:-Huly}
      - DEFAULT_LANGUAGE=${DEFAULT_LANGUAGE:-en}
      - LAST_NAME_FIRST=${LAST_NAME_FIRST:-true}
      - DESKTOP_UPDATES_CHANNEL=selfhost
    restart: unless-stopped
  fulltext:
    image: hardcoreeng/fulltext:${HULY_VERSION:-v0.6.468}
    environment:
      - SERVER_SECRET=${SERVICE_BASE64_64_HULY_SECRET}
      - DB_URL=mongodb://mongodb:27017
      - FULLTEXT_DB_URL=http://elastic:9200
      - ELASTIC_INDEX_NAME=huly_storage_index
      - STORAGE_CONFIG=minio|minio?accessKey=minioadmin&secretKey=minioadmin
      - REKONI_URL=http://rekoni:4004
      - ACCOUNTS_URL=http://account:3000
      - STATS_URL=http://stats:4900
    restart: unless-stopped
  stats:
    image: hardcoreeng/stats:${HULY_VERSION:-v0.6.468}
    environment:
      - PORT=4900
      - SERVER_SECRET=${SERVICE_BASE64_64_HULY_SECRET}
    restart: unless-stopped
volumes:
  db:
  elastic:
  files:
configs:
  nginx-volumes-nginx-huly-nginx:
    content: "server {\n    listen 80;\n    server_name _;\n    location / {\n        proxy_set_header Host $$host;\n        proxy_set_header X-Real-IP $$remote_addr;\n        proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;\n        proxy_set_header X-Forwarded-Proto $$scheme;\n        proxy_pass http://front:8080;\n    }\n\n    location /_accounts {\n        proxy_set_header Host $$host;\n        proxy_set_header X-Real-IP $$remote_addr;\n        proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;\n        proxy_set_header X-Forwarded-Proto $$scheme;\n\n        rewrite ^/_accounts(/.*)$$ $$1 break;\n        proxy_pass http://account:3000/;\n    }\n\n    location /_collaborator {\n        proxy_set_header Host $$host;\n        proxy_set_header X-Real-IP $$remote_addr;\n        proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;\n        proxy_set_header X-Forwarded-Proto $$scheme;\n\n        proxy_http_version 1.1;\n        proxy_set_header Upgrade $$http_upgrade;\n        proxy_set_header Connection \"upgrade\";\n        rewrite ^/_collaborator(/.*)$$ $$1 break;\n        proxy_pass http://collaborator:3078/;\n    }\n\n    location /_transactor {\n        proxy_set_header Host $$host;\n        proxy_set_header X-Real-IP $$remote_addr;\n        proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;\n        proxy_set_header X-Forwarded-Proto $$scheme;\n        \n        proxy_http_version 1.1;\n        proxy_set_header Upgrade $$http_upgrade;\n        proxy_set_header Connection \"upgrade\";\n        rewrite ^/_transactor(/.*)$$ $$1 break;\n        proxy_pass http://transactor:3333/;\n    }\n\n    location ~ ^/eyJ {\n        proxy_set_header Host $$host;\n        proxy_set_header X-Real-IP $$remote_addr;\n        proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;\n        proxy_set_header X-Forwarded-Proto $$scheme;\n        \n        proxy_http_version 1.1;\n        proxy_set_header Upgrade $$http_upgrade;\n        proxy_set_header Connection \"upgrade\";\n        proxy_pass http://transactor:3333;\n    }\n\n    location /_rekoni {\n        proxy_set_header Host $$host;\n        proxy_set_header X-Real-IP $$remote_addr;\n        proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;\n        proxy_set_header X-Forwarded-Proto $$scheme;\n\n        rewrite ^/_rekoni(/.*)$$ $$1 break;\n        proxy_pass http://rekoni:4004/;\n    }\n\n    location /_stats {\n        proxy_set_header Host $$host;\n        proxy_set_header X-Real-IP $$remote_addr;\n        proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;\n        proxy_set_header X-Forwarded-Proto $$scheme;\n\n        rewrite ^/_stats(/.*)$$ $$1 break;\n        proxy_pass http://stats:4900/;\n    }\n} \n"
