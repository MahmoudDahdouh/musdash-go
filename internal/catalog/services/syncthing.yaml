# name: Syncthing
# about: Syncthing synchronizes files between two or more computers in real time.
# docs: https://github.com/syncthing/syncthing/blob/main/README-Docker.md
# website: https://syncthing.net/
# categories: storage, analytics
# source: coolify
services:
  syncthing:
    image: lscr.io/linuxserver/syncthing:latest
    environment:
      - SERVICE_URL_SYNCTHING_8384
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - syncthing_config:/config
      - syncthing_data1:/data1
      - syncthing_data2:/data2
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8384/"]
      interval: 5s
      timeout: 20s
      retries: 10
    ports:
      - "32000:22000"
      - "32000:22000/udp"
      - "31027:21027/udp"
volumes:
  syncthing_config:
  syncthing_data1:
  syncthing_data2:
