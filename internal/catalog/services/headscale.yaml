# name: Headscale
# about: A control server for Tailscale clients, so that a private network of devices is run from your own server.
# docs: https://headscale.net/stable/setup/install/container/
# website: https://headscale.net/
# categories: networking, security
# source: musdash
services:
  headscale:
    image: ghcr.io/juanfont/headscale:0.29
    command: serve
    environment:
      - SERVICE_FQDN_HEADSCALE_8080
    tmpfs:
      - /var/run/headscale
    volumes:
      - headscale-data:/var/lib/headscale
    configs:
      - source: headscale-config
        target: /etc/headscale/config.yaml
    healthcheck:
      test: ["CMD", "headscale", "health"]
      interval: 10s
      timeout: 5s
      retries: 30
volumes:
  headscale-data:
configs:
  headscale-config:
    content: |
      server_url: ${SERVICE_URL_HEADSCALE}
      listen_addr: 0.0.0.0:8080
      metrics_listen_addr: 127.0.0.1:9090
      grpc_listen_addr: 127.0.0.1:50443
      grpc_allow_insecure: false
      trusted_proxies: []
      noise:
        private_key_path: /var/lib/headscale/noise_private.key
      prefixes:
        v4: 100.64.0.0/10
        v6: fd7a:115c:a1e0::/48
        allocation: sequential
      derp:
        server:
          enabled: false
        urls:
          - https://controlplane.tailscale.com/derpmap/default
        paths: []
        auto_update_enabled: true
        update_frequency: 3h
      disable_check_updates: false
      database:
        type: sqlite
        sqlite:
          path: /var/lib/headscale/db.sqlite
          write_ahead_log: true
      log:
        level: info
        format: text
      policy:
        mode: file
        path: ""
      dns:
        magic_dns: true
        base_domain: ${DNS_BASE_DOMAIN:-tailnet.internal}
        override_local_dns: true
        nameservers:
          global:
            - 1.1.1.1
            - 1.0.0.1
      unix_socket: /var/run/headscale/headscale.sock
      unix_socket_permission: "0770"
      logtail:
        enabled: false
      taildrop:
        enabled: true
