# name: CloudBeaver
# about: CloudBeaver is a lightweight web application designed for comprehensive data management.
# docs: https://dbeaver.com/docs/cloudbeaver/CloudBeaver-Deployment/
# website: https://dbeaver.com/
# categories: devtools, analytics, database
# source: coolify
services:
  cloudbeaver:
    image: dbeaver/cloudbeaver:24
    volumes:
      - cloudbeaver-data:/opt/cloudbeaver/workspace
    environment:
      - SERVICE_URL_CLOUDBEAVER_8978
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8978/"]
      interval: 5s
      timeout: 20s
      retries: 10
volumes:
  cloudbeaver-data:
