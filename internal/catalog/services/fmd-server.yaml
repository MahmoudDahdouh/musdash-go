# name: FMD Server
# about: A server to communicate with the FMD Android app, to locate and control your devices.
# docs: https://fmd-foss.org/docs/fmd-server/overview
# website: https://fmd-foss.org
# categories: security, home
# source: dokploy
services:
  fmd-server:
    image: registry.gitlab.com/fmd-foss/fmd-server:0.16.0
    expose:
      - 8080
    environment:
      - FMD_REGISTRATIONTOKEN=${SERVICE_PASSWORD_REGISTRATION_TOKEN}
      - FMD_USERIDLENGTH=${FMD_USERIDLENGTH:-5}
      - FMD_MAXSAVEDLOC=${FMD_MAXSAVEDLOC:-1000}
      - FMD_MAXSAVEDPIC=${FMD_MAXSAVEDPIC:-10}
      - SERVICE_FQDN_FMD_SERVER_8080
    volumes:
      - fmd-server-data:/var/lib/fmd-server/db/
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "timeout 10s bash -c ':> /dev/tcp/127.0.0.1/8080'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
      start_interval: 3s
volumes:
  fmd-server-data:
