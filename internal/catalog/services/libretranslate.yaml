# name: LibreTranslate
# about: Free and open-source machine translation API, entirely self-hosted.
# docs: https://libretranslate.com/docs/
# categories: ai, devtools
# source: coolify
services:
  libretranslate:
    image: "libretranslate/libretranslate:latest"
    environment:
      - SERVICE_URL_LIBRETRANSLATE_5000
      - LT_SSL=${LT_SSL:-true}
      - LT_UPDATE_MODELS=${LT_UPDATE_MODELS:-true}
      - LT_LOAD_ONLY=${LT_LOAD_ONLY:-en,es,fr,de,ja}
    volumes:
      - libretranslate-api-keys:/app/db
      - libretranslate-models:/home/libretranslate/.local
    healthcheck:
      test: ["CMD-SHELL", "./venv/bin/python scripts/healthcheck.py"]
volumes:
  libretranslate-api-keys:
  libretranslate-models:
