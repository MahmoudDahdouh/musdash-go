# name: NocoBase
# about: NocoBase is the most extensible AI-powered no-code/low-code platform.
# docs: https://docs.nocobase.com/get-started/installation/docker
# website: https://www.nocobase.com/
# categories: devtools, backend, database
# source: coolify
services:
  nocobase:
    image: nocobase/nocobase:1.9.33
    environment:
      - SERVICE_URL_NOCOBASE_13000
      - APP_KEY=${SERVICE_PASSWORD_64_APPKEY}
      - DB_DIALECT=postgres
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${POSTGRES_DB:-nocobase-db}
      - DB_USER=$SERVICE_USER_POSTGRES
      - DB_PASSWORD=$SERVICE_PASSWORD_POSTGRES
    volumes:
      - nocobase-storage:/app/nocobase/storage
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=${SERVICE_USER_POSTGRES}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DB=${POSTGRES_DB:-nocobase-db}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 20s
      retries: 10
volumes:
  nocobase-storage:
  postgres-data:
