# name: Jellyfin
# about: Jellyfin is a media server for hosting and streaming your media collection.
# docs: https://jellyfin.org
# categories: media
# source: coolify
services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:10.11.8
    environment:
      - SERVICE_URL_JELLYFIN_8096
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
      - JELLYFIN_PublishedServerUrl=$SERVICE_URL_JELLYFIN
    volumes:
      - jellyfin-config:/config
      - jellyfin-tvshows:/data/tvshows
      - jellyfin-movies:/data/movies
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8096"]
      interval: 2s
      timeout: 10s
      retries: 15
volumes:
  jellyfin-config:
  jellyfin-movies:
  jellyfin-tvshows:
