# name: Confluence
# about: Confluence is a powerful team collaboration and knowledge-sharing tool.
# docs: https://confluence.atlassian.com/doc/confluence-documentation-135922.html
# website: https://confluence.atlassian.com
# categories: productivity, docs
# source: dokploy
services:
  confluence:
    image: atlassian/confluence-server:8.6-ubuntu-jdk17
    expose:
      - "8090"
    volumes:
      - confluence-data:/var/atlassian/application-data/confluence
    environment:
      - JVM_MINIMUM_MEMORY=${JVM_MIN_MEM:-}
      - JVM_MAXIMUM_MEMORY=${JVM_MAX_MEM:-}
      - CATALINA_CONNECTOR_PROXYNAME=${DOMAIN:-}
      - CATALINA_CONNECTOR_SCHEME=http
      - CATALINA_CONNECTOR_SECURE=true
      - SERVICE_FQDN_CONFLUENCE_8090
volumes:
  confluence-data:
