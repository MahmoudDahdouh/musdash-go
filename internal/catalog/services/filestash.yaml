# name: Filestash
# about: Filestash is the enterprise-grade file manager connecting your storage with your identity provider and authorisations.
# docs: https://www.filestash.app/docs/
# website: https://www.filestash.app/
# categories: storage
# source: dokploy
services:
  app:
    image: machines/filestash:latest
    restart: always
    environment:
      - APPLICATION_URL=${SERVICE_FQDN_APP}
      - CANARY=${CANARY:-true}
      - OFFICE_URL=${OFFICE_URL:-http://wopi_server:9980}
      - OFFICE_FILESTASH_URL=${OFFICE_FILESTASH_URL:-http://app:8334}
      - OFFICE_REWRITE_URL=${OFFICE_REWRITE_URL:-http://127.0.0.1:9980}
      - SERVICE_FQDN_APP_8334
    expose:
      - 8334
    volumes:
      - filestash:/app/data/state/
  wopi_server:
    image: collabora/code:24.04.10.2.1
    restart: always
    environment:
      - extra_params=--o:ssl.enable=false
      - aliasgroup1=https://.*:443
    command:
      - /bin/bash
      - -c
      - |
        curl -o /usr/share/coolwsd/browser/dist/branding-desktop.css https://gist.githubusercontent.com/mickael-kerjean/bc1f57cd312cf04731d30185cc4e7ba2/raw/d706dcdf23c21441e5af289d871b33defc2770ea/destop.css
        /bin/su -s /bin/bash -c '/start-collabora-online.sh' cool
    user: root
    expose:
      - 9980
volumes:
  filestash:
