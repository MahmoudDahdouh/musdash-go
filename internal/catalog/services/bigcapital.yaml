# name: BigCapital
# about: BigCapital is a great open source alternative to QuickBooks. A comprehensive accounting and financial management system for businesses.
# docs: https://github.com/bigcapitalhq/bigcapital
# website: https://bigcapital.app/
# categories: finance, business
# source: dokploy
services:
  webapp:
    image: bigcapitalhq/webapp:latest
    restart: unless-stopped
    depends_on:
      - server
    expose:
      - '80'
    environment:
      - SERVICE_FQDN_WEBAPP_80
  server:
    image: bigcapitalhq/server:latest
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_started
      redis:
        condition: service_started
    expose:
      - '3000'
    environment:
      - MAIL_HOST=${MAIL_HOST:-}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_SECURE=${MAIL_SECURE:-false}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-BigCapital}
      - MAIL_FROM_ADDRESS=noreply@${SERVICE_FQDN_WEBAPP}
      - DB_HOST=mysql
      - DB_USER=${DB_USER:-bigcapital}
      - DB_PASSWORD=${SERVICE_PASSWORD_DB_PASSWORD}
      - DB_CHARSET=${DB_CHARSET:-utf8mb4}
      - SYSTEM_DB_NAME=${SYSTEM_DB_NAME:-bigcapital}
      - TENANT_DB_NAME_PERFIX=${TENANT_DB_NAME_PERFIX:-bigcapital_tenant_}
      - JWT_SECRET=${SERVICE_HEX_64_JWT_SECRET}
      - MONGODB_DATABASE_URL=mongodb://mongo/bigcapital
      - BASE_URL=${SERVICE_URL_WEBAPP}
      - AGENDASH_AUTH_USER=${AGENDASH_AUTH_USER:-admin}
      - AGENDASH_AUTH_PASSWORD=${SERVICE_PASSWORD_AGENDASH_AUTH_PASSWORD}
      - SIGNUP_DISABLED=${SIGNUP_DISABLED:-false}
      - SIGNUP_ALLOWED_DOMAINS=${SIGNUP_ALLOWED_DOMAINS:-}
      - SIGNUP_ALLOWED_EMAILS=${SIGNUP_ALLOWED_EMAILS:-}
      - SIGNUP_EMAIL_CONFIRMATION=${SIGNUP_EMAIL_CONFIRMATION:-false}
      - GOTENBERG_URL=${GOTENBERG_URL:-http://gotenberg:9000}
      - GOTENBERG_DOCS_URL=${GOTENBERG_DOCS_URL:-http://gotenberg:9000}
      - EXCHANGE_RATE_SERVICE=${EXCHANGE_RATE_SERVICE:-openexchangerates}
      - OPEN_EXCHANGE_RATE_APP_ID=${OPEN_EXCHANGE_RATE_APP_ID:-}
      - BANKING_CONNECT=${BANKING_CONNECT:-false}
      - PLAID_ENV=${PLAID_ENV:-sandbox}
      - PLAID_CLIENT_ID=${PLAID_CLIENT_ID:-}
      - PLAID_SECRET=${PLAID_SECRET:-}
      - PLAID_LINK_WEBHOOK=${PLAID_LINK_WEBHOOK:-}
      - LEMONSQUEEZY_API_KEY=${LEMONSQUEEZY_API_KEY:-}
      - LEMONSQUEEZY_STORE_ID=${LEMONSQUEEZY_STORE_ID:-}
      - LEMONSQUEEZY_WEBHOOK_SECRET=${LEMONSQUEEZY_WEBHOOK_SECRET:-}
      - HOSTED_ON_BIGCAPITAL_CLOUD=${HOSTED_ON_BIGCAPITAL_CLOUD:-false}
      - NEW_RELIC_DISTRIBUTED_TRACING_ENABLED=${NEW_RELIC_DISTRIBUTED_TRACING_ENABLED:-false}
      - NEW_RELIC_LOG=${NEW_RELIC_LOG:-false}
      - NEW_RELIC_AI_MONITORING_ENABLED=${NEW_RELIC_AI_MONITORING_ENABLED:-false}
      - NEW_RELIC_CUSTOM_INSIGHTS_EVENTS_MAX_SAMPLES_STORED=${NEW_RELIC_CUSTOM_INSIGHTS_EVENTS_MAX_SAMPLES_STORED:-10000}
      - NEW_RELIC_SPAN_EVENTS_MAX_SAMPLES_STORED=${NEW_RELIC_SPAN_EVENTS_MAX_SAMPLES_STORED:-10000}
      - NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY:-}
      - NEW_RELIC_APP_NAME=${NEW_RELIC_APP_NAME:-BigCapital}
      - S3_REGION=${S3_REGION:-}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_BUCKET=${S3_BUCKET:-}
  mysql:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=${SYSTEM_DB_NAME:-bigcapital}
      - MYSQL_USER=${DB_USER:-bigcapital}
      - MYSQL_PASSWORD=${SERVICE_PASSWORD_DB_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${SERVICE_PASSWORD_DB_ROOT_PASSWORD}
    volumes:
      - mysql:/var/lib/mysql
    expose:
      - '3306'
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  mongo:
    image: mongo:7
    restart: unless-stopped
    expose:
      - '27017'
    volumes:
      - mongo:/data/db
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - '6379'
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  gotenberg:
    image: gotenberg/gotenberg:7
    restart: unless-stopped
    expose:
      - '9000'
volumes:
  mysql:
  mongo:
  redis:
