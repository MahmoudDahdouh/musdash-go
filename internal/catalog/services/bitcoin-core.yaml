# name: Bitcoin Core
# about: A self-hosted Bitcoin Core full node.
# docs: https://github.com/ruimarinho/docker-bitcoin-core#readme
# website: https://bitcoincore.org/
# categories: backend, finance
# source: coolify
# connect: true
services:
  bitcoin-core:
    image: ruimarinho/bitcoin-core:latest
    environment:
      - BITCOIN_RPCUSER=${BITCOIN_RPCUSER:-bitcoinuser}
      - BITCOIN_RPCPASSWORD=${SERVICE_PASSWORD_PASSWORD64}
      - BITCOIN_PRINTTOCONSOLE=${BITCOIN_PRINTTOCONSOLE:-1}
      - BITCOIN_TXINDEX=${BITCOIN_TXINDEX:-1}
      - BITCOIN_SERVER=${BITCOIN_SERVER:-1}
    volumes:
      - blockchain-data:/home/bitcoin/.bitcoin
    command: ["-datadir=/home/bitcoin/.bitcoin", "-rpcbind=127.0.0.1", "-rpcallowip=127.0.0.1", "-rpcuser=${BITCOIN_RPCUSER:-bitcoinuser}", "-rpcpassword=${SERVICE_PASSWORD_PASSWORD64}", "-printtoconsole=${BITCOIN_PRINTTOCONSOLE:-1}", "-txindex=${BITCOIN_TXINDEX:-1}", "-server=${BITCOIN_SERVER:-1}"]
volumes:
  blockchain-data:
