# name: PodFetch
# about: PodFetch is a sleek, self-hosted podcast manager that automatically downloads new episodes, offers a web UI for listening and managing podcasts, and…
# docs: https://samtv12345.github.io/PodFetch/
# categories: media
# source: dokploy
services:
  podfetch:
    image: samuel19982/podfetch:v5.2.2
    restart: unless-stopped
    environment:
      - DATABASE_URL=sqlite:///app/db/podcast.db
      - POLLING_INTERVAL=300
      - BASIC_AUTH=true
      - USERNAME=${USERNAME:-admin}
      - PASSWORD=${SERVICE_PASSWORD_ADMIN_PASSWORD}
      - GPODDER_INTEGRATION_ENABLED=true
      - SERVICE_FQDN_PODFETCH_8000
    volumes:
      - podfetch-podcasts:/app/podcasts
      - podfetch-db:/app/db
volumes:
  podfetch-podcasts:
  podfetch-db:
