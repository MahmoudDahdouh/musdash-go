# name: Tailscale Exit nodes
# about: Tailscale ExitNode is a feature that lets you route your internet traffic through a specific device in your Tailscale network.
# docs: https://tailscale.com/kb/1408/quick-guide-exit-nodes
# website: https://tailscale.com/
# categories: networking
# source: dokploy
# connect: true
services:
  tailscale-exitnode:
    image: tailscale/tailscale:latest
    hostname: ${TAILSCALE_HOSTNAME:-}
    environment:
      - TS_AUTHKEY=${TAILSCALE_AUTHKEY:-}
      - TS_EXTRA_ARGS=--advertise-exit-node
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=true
    volumes:
      - tailscale_exitnode_data:/var/lib/tailscale
    restart: always
volumes:
  tailscale_exitnode_data:
