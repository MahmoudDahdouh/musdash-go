# name: degoog
# about: A self-hosted search page that merges results from several search engines and can be extended with plugins.
# docs: https://github.com/degoog-org/degoog#run
# website: https://degoog-org.github.io/docs
# categories: search
# source: musdash
services:
  degoog:
    image: ghcr.io/degoog-org/degoog:latest
    environment:
      - SERVICE_FQDN_DEGOOG_4444
      - DEGOOG_SETTINGS_PASSWORDS=${SERVICE_PASSWORD_SETTINGS}
      - TZ=${TZ:-UTC}
    volumes:
      - degoog-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4444/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
volumes:
  degoog-data:
