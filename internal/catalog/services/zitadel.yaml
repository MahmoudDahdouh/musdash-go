# name: Zitadel
# about: Open-source identity and access management platform with multi-tenancy, OpenID Connect, SAML, and OAuth 2.0 support.
# docs: https://zitadel.com/docs/self-hosting/deploy/compose
# website: https://zitadel.com/
# categories: auth, security
# source: dokploy
services:
  zitadel:
    restart: 'always'
    image: 'ghcr.io/zitadel/zitadel:v4.16.0'
    command: 'start-from-init --masterkey "${SERVICE_PASSWORD_ZITADEL_MASTERKEY}" --tlsMode disabled'
    environment:
      ZITADEL_DATABASE_POSTGRES_HOST: db
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: "${SERVICE_PASSWORD_POSTGRES_PASSWORD}"
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: postgres
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: "${SERVICE_PASSWORD_POSTGRES_PASSWORD}"
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      ZITADEL_EXTERNALDOMAIN: "${SERVICE_FQDN_ZITADEL}"
      ZITADEL_EXTERNALPORT: "${ZITADEL_EXTERNALPORT:-80}"
      ZITADEL_EXTERNALSECURE: "${ZITADEL_EXTERNALSECURE:-false}"
      ZITADEL_TLS_ENABLED: false
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: "${SERVICE_USER_ADMIN_USERNAME}"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: "${ADMIN_PASSWORD:?Set a password to sign in with}"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL_ADDRESS: "${ADMIN_EMAIL:?Set an email address}"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_FIRSTNAME: "${ZITADEL_FIRSTINSTANCE_ORG_HUMAN_FIRSTNAME:-Admin}"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_LASTNAME: "${ZITADEL_FIRSTINSTANCE_ORG_HUMAN_LASTNAME:-User}"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: false
      SERVICE_FQDN_ZITADEL_8080:
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: '10s'
      timeout: '30s'
      retries: 12
      start_period: '30s'
    depends_on:
      db:
        condition: 'service_healthy'
    expose:
      - 8080
  db:
    restart: 'always'
    image: postgres:17-alpine
    environment:
      PGUSER: postgres
      POSTGRES_PASSWORD: "${SERVICE_PASSWORD_POSTGRES_PASSWORD}"
      POSTGRES_DB: zitadel
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-d", "zitadel", "-U", "postgres"]
      interval: '10s'
      timeout: '30s'
      retries: 5
      start_period: '20s'
volumes:
  postgres_data:
