# name: Markup
# about: Markup is a fast, keyboard-first markdown workspace with live preview, graph view, whiteboards, mind maps, and PostgreSQL-powered cloud sync.
# docs: https://docs.markup.freddiephilpot.dev/
# website: https://home.markup.freddiephilpot.dev/
# categories: docs
# source: dokploy
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - markup-postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: markup
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES_PASSWORD}
      POSTGRES_DB: markup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U markup -d markup"]
      interval: 10s
      timeout: 5s
      retries: 5
  markup:
    image: ghcr.io/pphilfre/markup:main
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://markup:${SERVICE_PASSWORD_POSTGRES_PASSWORD}@db:5432/markup
      NEXT_PUBLIC_DB_PROVIDER: postgres
      NEXT_PUBLIC_SITE_URL: ${SERVICE_URL_MARKUP}
      WORKOS_CLIENT_ID: ${WORKOS_CLIENT_ID:-client_id_change_me}
      WORKOS_API_KEY: ${WORKOS_API_KEY:-sk_change_me}
      WORKOS_COOKIE_PASSWORD: ${SERVICE_PASSWORD_COOKIE_PASSWORD}
      NEXT_PUBLIC_WORKOS_REDIRECT_URI: ${SERVICE_URL_MARKUP}/callback
      NODE_ENV: production
      SERVICE_FQDN_MARKUP_3000:
volumes:
  markup-postgres-data:
