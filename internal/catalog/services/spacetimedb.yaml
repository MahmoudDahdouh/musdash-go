# name: SpacetimeDB
# about: SpacetimeDB is a relational database with a built-in server runtime.
# docs: https://spacetimedb.com/docs/deploying/spacetimedb-standalone/
# website: https://spacetimedb.com/
# categories: database, backend
# source: dokploy
services:
  spacetimedb:
    image: clockworklabs/spacetime:v2.6.1
    restart: unless-stopped
    command: start
    expose:
      - 3000
    volumes:
      - spacetimedb-data:/home/spacetime
    environment:
      - SERVICE_FQDN_SPACETIMEDB_3000
volumes:
  spacetimedb-data:
