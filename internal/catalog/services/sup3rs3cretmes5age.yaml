# name: sup3r S3cret Mes5age
# about: A service for sharing a secret or file once, kept in a Vault dev server and deleted after it is read.
# docs: https://github.com/algolia/sup3rS3cretMes5age#quick-start
# website: https://github.com/algolia/sup3rS3cretMes5age
# categories: security
# source: musdash
services:
  supersecret:
    image: algolia/supersecretmessage:latest
    environment:
      - SERVICE_FQDN_SUPERSECRET_8082
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=${SERVICE_PASSWORD_VAULT}
      - SUPERSECRETMESSAGE_HTTP_BINDING_ADDRESS=:8082
      - SUPERSECRETMESSAGE_HTTPS_REDIRECT_ENABLED=false
    depends_on:
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8082/health"]
      interval: 15s
      timeout: 10s
      retries: 20
  vault:
    image: hashicorp/vault:latest
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=${SERVICE_PASSWORD_VAULT}
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 10s
      timeout: 10s
      retries: 20
