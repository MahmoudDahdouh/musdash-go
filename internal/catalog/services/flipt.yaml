# name: Flipt
# about: Flipt is a fully managed feature flag solution that enables you to keep your feature flags and remote config next to your code in Git.
# docs: https://docs.flipt.io/v2/installation
# website: https://www.flipt.io/
# categories: backend, devtools, git
# source: coolify
services:
  flipt:
    image: 'docker.flipt.io/flipt/flipt:latest'
    volumes:
      - 'flipt-data:/var/opt/flipt'
    environment:
      - SERVICE_URL_FLIPT_8080
    healthcheck:
      test:
        - CMD
        - wget
        - '--spider'
        - '--quiet'
        - 'http://127.0.0.1:8080'
      interval: 2s
      timeout: 10s
      retries: 15
volumes:
  flipt-data:
