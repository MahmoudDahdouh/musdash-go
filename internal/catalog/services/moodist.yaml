# name: Moodist
# about: A static web page that mixes ambient sounds such as rain, wind and cafe noise for focus and relaxation, with nothing to configure.
# docs: https://github.com/remvze/moodist#self-hosting
# website: https://github.com/remvze/moodist
# categories: productivity, media
# source: musdash
services:
  moodist:
    image: ghcr.io/remvze/moodist:latest
    environment:
      - SERVICE_FQDN_MOODIST_8080
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
