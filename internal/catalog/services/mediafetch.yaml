# name: MediaFetch
# about: A tiny, self-hosted web wrapper for yt-dlp to download video and audio. Optional basic auth.
# docs: https://docs.lukedunsmore.com/docs/self-hosted/mediafetch/
# website: https://www.lukedunsmore.com/mediafetch
# categories: devtools, media
# source: dokploy
services:
  mediafetch:
    image: lukedunsmoto/mediafetch:1.3.5
    restart: unless-stopped
    expose:
      - "3002"
    volumes:
      - mediafetch_data:/data/downloads
    environment:
      - PORT=3002
      - BASIC_AUTH_USER=${BASIC_AUTH_USER:-admin}
      - BASIC_AUTH_PASS=${BASIC_AUTH_PASS:?Set a password to sign in with}
      - PUBLIC_BASE_URL=${SERVICE_URL_MEDIAFETCH}
      - OUTPUT_DIR=${OUTPUT_DIR:-/data/downloads}
      - MAX_CONCURRENT_JOBS=${MAX_CONCURRENT_JOBS:-2}
      - JOB_TIMEOUT_MS=${JOB_TIMEOUT_MS:-600000}
      - VERSION_CHECK_TTL_MS=${VERSION_CHECK_TTL_MS:-21600000}
      - SERVICE_FQDN_MEDIAFETCH_3002
volumes:
  mediafetch_data:
