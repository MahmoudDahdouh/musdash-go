# name: Rustrak (Full Stack)
# about: Self-hosted error tracking compatible with Sentry SDKs. Full stack: Rust server, web dashboard and PostgreSQL.
# docs: https://rustrak.github.io/rustrak/getting-started/installation
# website: https://rustrak.github.io/rustrak/
# categories: monitoring, devtools
# source: dokploy
services:
  rustrak-server:
    image: rustrak/rustrak-server:postgres
    restart: unless-stopped
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - RUST_LOG=info
      - SSL_PROXY=true
      - DATABASE_URL=postgres://rustrak:${SERVICE_PASSWORD_POSTGRES_PASSWORD}@postgres:5432/rustrak
      - SESSION_SECRET_KEY=${SERVICE_PASSWORD_64_SESSION_SECRET_KEY}
      - CREATE_SUPERUSER=${ADMIN_EMAIL:?Set an email address}:${SERVICE_PASSWORD_ADMIN_PASSWORD}
      - SERVICE_FQDN_RUSTRAK_SERVER_8080
    expose:
      - 8080
    depends_on:
      postgres:
        condition: service_healthy
  rustrak-ui:
    image: rustrak/rustrak-ui:latest
    restart: unless-stopped
    environment:
      - RUSTRAK_API_URL=${SERVICE_URL_RUSTRAK_SERVER}
      - HOSTNAME=0.0.0.0
      - SERVICE_FQDN_RUSTRAK_UI_3000
    expose:
      - 3000
    depends_on:
      - rustrak-server
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=rustrak
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES_PASSWORD}
      - POSTGRES_DB=rustrak
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rustrak -d rustrak"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - 5432
volumes:
  postgres_data:
