# name: Sonarr
# about: Sonarr⁠ (formerly NZBdrone) is a PVR for usenet and bittorrent users.
# docs: https://hub.docker.com/r/linuxserver/sonarr
# categories: media
# source: coolify
services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    environment:
      - SERVICE_URL_SONARR_8989
      - _APP_URL=$SERVICE_URL_SONARR
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-America/Toronto}
    volumes:
      - sonarr-config:/config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8989/ping"]
      interval: 2s
      timeout: 10s
      retries: 15
volumes:
  sonarr-config:
