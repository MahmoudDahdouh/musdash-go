# name: Joomla with MariaDB
# about: Joomla! is the mobile-ready and user-friendly way to build your website.
# docs: https://hub.docker.com/_/joomla
# website: https://www.joomla.org/
# categories: cms
# source: coolify
services:
  joomla:
    image: joomla:latest
    volumes:
      - joomla_data:/var/www/html
    environment:
      - SERVICE_URL_JOOMLA
      - JOOMLA_DB_HOST=mariadb
      - JOOMLA_DB_USER=${SERVICE_USER_JOOMLA}
      - JOOMLA_DB_PASSWORD=${SERVICE_PASSWORD_JOOMLA}
      - JOOMLA_DB_NAME=${MYSQL_DATABASE:-joomla-db}
      - SERVICE_FQDN_JOOMLA_80
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - '-f'
        - 'http://127.0.0.1'
      interval: 2s
      timeout: 10s
      retries: 10
  mariadb:
    image: mariadb:11
    volumes:
      - joomla_mariadb_data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${SERVICE_PASSWORD_ROOT}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-joomla-db}
      - MYSQL_USER=${SERVICE_USER_JOOMLA}
      - MYSQL_PASSWORD=${SERVICE_PASSWORD_JOOMLA}
    healthcheck:
      test:
        - CMD
        - healthcheck.sh
        - '--connect'
        - '--innodb_initialized'
      interval: 5s
      timeout: 20s
      retries: 10
volumes:
  joomla_data:
  joomla_mariadb_data:
