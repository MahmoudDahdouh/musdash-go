# name: Jellyfin Rewind
# about: A year-in-review page for Jellyfin music listeners; it reads your server from the browser and keeps no data of its own.
# docs: https://github.com/Chaphasilor/jellyfin-rewind#local-network--self-hosting
# website: https://jellyfin-rewind.chaphasilor.xyz
# categories: media
# source: musdash
services:
  jellyfin-rewind:
    image: chaphasilor/jellyfin-rewind:latest
    environment:
      - SERVICE_FQDN_JELLYFIN_REWIND_80
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
