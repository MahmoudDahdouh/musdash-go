# name: Kimai
# about: Open source time-tracking app.
# docs: https://www.kimai.org/documentation/docker.html
# website: https://www.kimai.org/en/
# categories: productivity, finance
# source: coolify
services:
  mysql:
    image: mysql:8
    volumes:
      - kimai-mysql-data:/var/lib/mysql
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE:-kimai}
      - MYSQL_USER=${SERVICE_USER_MYSQL}
      - MYSQL_PASSWORD=${SERVICE_PASSWORD_MYSQL}
      - MYSQL_ROOT_PASSWORD=${SERVICE_PASSWORD_ROOT}
    command: --default-storage-engine innodb
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 20s
      retries: 10
  kimai:
    image: kimai/kimai2:apache
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - kimai-data:/opt/kimai/var/data
    environment:
      - SERVICE_URL_KIMAI_8001
      - APP_SECRET=${SERVICE_PASSWORD_APPSECRET}
      - MAILER_FROM=${MAILER_FROM:-kimai@example.com}
      - MAILER_URL=${MAILER_URL:-null://null}
      - ADMINMAIL=${ADMINMAIL:-admin@kimai.local}
      - ADMINPASS=${SERVICE_PASSWORD_ADMINPASS}
      - DATABASE_URL=mysql://${SERVICE_USER_MYSQL}:${SERVICE_PASSWORD_MYSQL}@mysql/${MYSQL_DATABASE:-kimai}?charset=utf8mb4&serverVersion=8.3.0
      - 'TRUSTED_HOSTS=${TRUSTED_HOSTS:-}|localhost|127.0.0.1'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8001"]
      interval: 2s
      timeout: 10s
      retries: 15
volumes:
  kimai-data:
  kimai-mysql-data:
