# name: Karakeep
# about: A self-hostable bookmark-everything app (links, notes and images) with AI-based automatic tagging and full text search.
# docs: https://docs.karakeep.app/installation/docker/
# website: https://karakeep.app/
# categories: productivity, media
# source: coolify
services:
  web:
    image: ghcr.io/karakeep-app/karakeep:0.33.2
    volumes:
      - karakeep-data:/data
    environment:
      - SERVICE_URL_WEB
      - NEXTAUTH_URL=${SERVICE_URL_WEB}
      - NEXTAUTH_SECRET=${SERVICE_PASSWORD_KARAKEEPNEXTAUTH}
      - MEILI_MASTER_KEY=${SERVICE_PASSWORD_MEILI}
      - MEILI_ADDR=http://meilisearch:7700
      - BROWSER_WEB_URL=http://chrome:9222
      - OPENAI_API_KEY=${SERVICE_OPENAI_API_KEY:-}
      - DISABLE_SIGNUPS=${SERVICE_DISABLE_SIGNUPS:-false}
      - DATA_DIR=/data
      - SERVICE_FQDN_WEB_3000
  chrome:
    image: ghcr.io/karakeep-app/karakeep-chrome:release
    command:
      - '--no-sandbox'
      - '--disable-gpu'
      - '--disable-dev-shm-usage'
      - '--hide-scrollbars'
      - '--disable-blink-features=AutomationControlled'
      - '--window-size=1440,900'
  meilisearch:
    image: getmeili/meilisearch:v1.41.0
    environment:
      - MEILI_NO_ANALYTICS=${MEILI_NO_ANALYTICS:-true}
      - NEXTAUTH_SECRET=${SERVICE_PASSWORD_KARAKEEPNEXTAUTH}
      - MEILI_MASTER_KEY=${SERVICE_PASSWORD_MEILI}
      - NEXTAUTH_URL=${SERVICE_URL_WEB}
    volumes:
      - karakeep-meilisearch:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:7700/health"]
      interval: 2s
      timeout: 10s
      retries: 15
volumes:
  karakeep-data:
  karakeep-meilisearch:
