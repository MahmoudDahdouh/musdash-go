# name: Plex
# about: Plex organizes video, music and photos from personal media libraries and streams them to smart TVs, streaming boxes and mobile devices.
# docs: https://docs.linuxserver.io/images/docker-plex/
# categories: media
# source: coolify
services:
  plex:
    image: lscr.io/linuxserver/plex:latest
    environment:
      - SERVICE_URL_PLEX_32400
      - _APP_URL=$SERVICE_URL_PLEX
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-America/Toronto}
      - PLEX_CLAIM=${PLEX_CLAIM:-}
    volumes:
      - plex-config:/config
      - plex-tv:/tv
      - plex-movies:/movies
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:32400/identity"]
      interval: 2s
      timeout: 10s
      retries: 15
volumes:
  plex-config:
  plex-movies:
  plex-tv:
