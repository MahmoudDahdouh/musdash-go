# name: EmbyStat
# about: EmbyStat is a web analytics tool, designed to provide insight into website traffic and user behavior.
# docs: https://github.com/mregni/EmbyStat
# categories: analytics
# source: coolify
services:
  embystat:
    image: lscr.io/linuxserver/embystat:latest
    environment:
      - SERVICE_URL_EMBYSTAT_6555
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    volumes:
      - embystat-config:/config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:6555"]
      interval: 2s
      timeout: 10s
      retries: 15
volumes:
  embystat-config:
