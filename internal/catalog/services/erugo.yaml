# name: Erugo
# about: A file sharing app that turns uploads into memorable links with passwords, expiry and download limits.
# docs: https://erugo.app/docs/getting-started/quickstart
# website: https://erugo.app/
# categories: storage
# source: musdash
services:
  erugo:
    image: wardy784/erugo:latest
    environment:
      - SERVICE_FQDN_ERUGO_80
    volumes:
      - erugo-storage:/var/www/html/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null --max-time 5 http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
volumes:
  erugo-storage:
