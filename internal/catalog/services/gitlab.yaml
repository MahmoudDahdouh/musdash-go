# name: GitLab
# about: The all-in-one DevOps platform for seamless collaboration and continuous delivery.
# docs: https://docs.gitlab.com/ee/install/docker.html
# categories: git, devtools, productivity
# source: coolify
services:
  gitlab:
    image: "gitlab/gitlab-ce:latest"
    environment:
      - SERVICE_URL_GITLAB_80
      - TZ=${TZ:-UTC}
      - GITLAB_TIMEZONE=${GITLAB_TIMEZONE:-UTC}
      - GITLAB_ROOT_PASSWORD=$SERVICE_PASSWORD_GITLAB
      - EXTERNAL_URL=$SERVICE_URL_GITLAB
      - GITLAB_HOST=$SERVICE_URL_GITLAB
      - GITLAB_SMTP_ENABLE=${GITLAB_SMTP_ENABLE:-false}
      - GITLAB_SMTP_ADDRESS=${GITLAB_SMTP_ADDRESS:-}
      - GITLAB_SMTP_PORT=${GITLAB_SMTP_PORT:-587}
      - GITLAB_SMTP_USER_NAME=${GITLAB_SMTP_USER_NAME:-}
      - GITLAB_SMTP_PASSWORD=${GITLAB_SMTP_PASSWORD:-}
      - GITLAB_SMTP_DOMAIN=${GITLAB_SMTP_DOMAIN:-}
      - GITLAB_STARTTLS_AUTO=${GITLAB_STARTTLS_AUTO:-true}
      - GITLAB_SMTP_TLS=${GITLAB_SMTP_TLS:-false}
      - GITLAB_EMAIL_FROM=${GITLAB_EMAIL_FROM:-}
      - GITLAB_EMAIL_REPLY_TO=${GITLAB_EMAIL_REPLY_TO:-}
      - 'GITLAB_OMNIBUS_CONFIG=external_url "${SERVICE_URL_GITLAB}"; nginx["listen_https"] = false; nginx["listen_port"] = 80; gitlab_rails["gitlab_shell_ssh_port"] = 2222; gitlab_rails["smtp_enable"] = ${GITLAB_SMTP_ENABLE:-false}; gitlab_rails["smtp_address"] = "${GITLAB_SMTP_ADDRESS:-}"; gitlab_rails["smtp_port"] = ${GITLAB_SMTP_PORT:-587}; gitlab_rails["smtp_user_name"] = "${GITLAB_SMTP_USER_NAME:-}"; gitlab_rails["smtp_password"] = "${GITLAB_SMTP_PASSWORD:-}"; gitlab_rails["smtp_domain"] = "${GITLAB_SMTP_DOMAIN:-}"; gitlab_rails["smtp_authentication"] = "login"; gitlab_rails["smtp_enable_starttls_auto"] = ${GITLAB_STARTTLS_AUTO:-true}; gitlab_rails["smtp_tls"] = ${GITLAB_SMTP_TLS:-false}; gitlab_rails["gitlab_email_from"] = "${GITLAB_EMAIL_FROM:-}"; gitlab_rails["gitlab_email_reply_to"] = "${GITLAB_EMAIL_REPLY_TO:-}";'
    volumes:
      - "gitlab-config:/etc/gitlab"
      - "gitlab-logs:/var/log/gitlab"
      - "gitlab-data:/var/opt/gitlab"
    shm_size: 256m
volumes:
  gitlab-config:
  gitlab-data:
  gitlab-logs:
