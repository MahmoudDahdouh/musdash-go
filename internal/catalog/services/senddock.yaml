# name: SendDock
# about: Open-source, self-hosted email marketing platform with BYO SMTP. Manage subscribers, templates, broadcasts, and scheduled campaigns from one place.
# docs: https://docs.senddock.dev/
# website: https://senddock.dev/
# categories: email, business
# source: dokploy
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=senddock
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES_PASSWORD}
      - POSTGRES_DB=senddock
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U senddock"]
      interval: 10s
      timeout: 5s
      retries: 6
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
  senddock:
    image: ghcr.io/arkhe-systems/senddock:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://senddock:${SERVICE_PASSWORD_POSTGRES_PASSWORD}@postgres:5432/senddock?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${SERVICE_PASSWORD_64_JWT_SECRET}
      - PUBLIC_URL=${SERVICE_URL_SENDDOCK}
      - FRONTEND_URL=${SERVICE_URL_SENDDOCK}
      - PORT=8080
      - SERVICE_FQDN_SENDDOCK_8080
    expose:
      - 8080
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
volumes:
  pgdata:
  redisdata:
