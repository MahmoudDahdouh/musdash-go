# name: WuzAPI
# about: A RESTful API service for WhatsApp with multiple device support and concurrent sessions.
# docs: https://github.com/asternic/wuzapi/blob/main/README.md
# website: https://github.com/asternic/wuzapi
# categories: devtools, communication, automation
# source: dokploy
services:
  wuzapi-server:
    image: asternic/wuzapi:sha-30c1805
    restart: unless-stopped
    expose:
      - 8080
    environment:
      - WUZAPI_ADMIN_TOKEN=${SERVICE_PASSWORD_ADMIN_TOKEN}
      - WUZAPI_GLOBAL_ENCRYPTION_KEY=${SERVICE_PASSWORD_ENCRYPTION_KEY}
      - DB_USER=${DB_USER:-wuzapi}
      - DB_PASSWORD=${SERVICE_PASSWORD_DB_PASSWORD}
      - DB_NAME=${DB_NAME:-wuzapi}
      - DB_HOST=db
      - DB_PORT=5432
      - TZ=${TZ:-UTC}
      - SERVICE_FQDN_WUZAPI_SERVER_8080
    depends_on:
      - db
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-wuzapi}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-wuzapi}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DB_USER:-wuzapi}"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  db_data:
