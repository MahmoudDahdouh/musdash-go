# name: Stirling PDF
# about: Stirling is a powerful web based PDF manipulation tool.
# docs: https://docs.stirlingpdf.com/Installation/Docker%20Install/
# website: https://www.stirling.com/
# categories: productivity, devtools
# source: coolify
services:
  stirling-pdf:
    image: stirlingtools/stirling-pdf:latest
    volumes:
      - stirling-training-data:/usr/share/tesseract-ocr/5/tessdata
      - stirling-configs:/configs
      - stirling-custom-files:/customFiles/
      - stirling-logs:/logs/
    environment:
      - SERVICE_URL_SPDF_8080
      - DOCKER_ENABLE_SECURITY=false
    healthcheck:
      test: 'curl --fail --silent http://127.0.0.1:8080/api/v1/info/status | grep -q "UP" || exit 1'
      interval: 5s
      timeout: 20s
      retries: 10
volumes:
  stirling-configs:
  stirling-custom-files:
  stirling-logs:
  stirling-training-data:
