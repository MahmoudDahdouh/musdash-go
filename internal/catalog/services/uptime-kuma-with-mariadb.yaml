# name: Uptime Kuma with MariaDB
# about: Uptime Kuma is a monitoring tool for tracking the status and performance of your applications in real-time.
# docs: https://github.com/louislam/uptime-kuma/wiki/%F0%9F%94%A7-How-to-Install
# website: https://uptime.kuma.pet/
# categories: monitoring
# source: coolify
services:
  uptime-kuma:
    image: louislam/uptime-kuma:2
    environment:
      - SERVICE_URL_UPTIMEKUMA_3001
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - uptime-kuma-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "extra/healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      mariadb:
        condition: service_healthy
  mariadb:
    image: mariadb:11
    environment:
      - MYSQL_USER=${SERVICE_USER_MARIADB}
      - MYSQL_PASSWORD=${SERVICE_PASSWORD_MARIADB}
      - MYSQL_ROOT_PASSWORD=${SERVICE_PASSWORD_ROOT}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-uptime-kuma-db}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 20s
      retries: 10
    volumes:
      - mariadb-data:/var/lib/mysql
volumes:
  mariadb-data:
  uptime-kuma-data:
