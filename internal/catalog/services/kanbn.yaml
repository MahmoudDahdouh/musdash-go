# name: Kanbn
# about: The open-source project management alternative to Trello.
# docs: https://docs.kan.bn/guides/self-hosting/introduction
# website: https://kan.bn/
# categories: productivity
# source: dokploy
services:
  kanbn:
    image: ghcr.io/kanbn/kan:0.6.0
    restart: unless-stopped
    expose:
      - 3000
    environment:
      NEXT_PUBLIC_BASE_URL: ${SERVICE_URL_KANBN}
      BETTER_AUTH_SECRET: ${SERVICE_PASSWORD_BETTER_AUTH_SECRET}
      POSTGRES_URL: postgresql://kan:${SERVICE_PASSWORD_POSTGRES_PASSWORD}@postgres:5432/kan_db
      NEXT_PUBLIC_ALLOW_CREDENTIALS: "true"
      SERVICE_FQDN_KANBN_3000:
    depends_on:
      migrate:
        condition: service_completed_successfully
  migrate:
    image: ghcr.io/kanbn/kan-migrate:0.6.0
    restart: "no"
    environment:
      POSTGRES_URL: postgresql://kan:${SERVICE_PASSWORD_POSTGRES_PASSWORD}@postgres:5432/kan_db
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: kan_db
      POSTGRES_USER: kan
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES_PASSWORD}
    volumes:
      - kan_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kan -d kan_db"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  kan_postgres_data:
