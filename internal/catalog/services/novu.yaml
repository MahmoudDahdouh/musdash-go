# name: Novu
# about: Open-source notification infrastructure for multi-channel workflows — in-app Inbox, email, SMS, push, and chat — with a unified API and dashboard.
# docs: https://docs.novu.co/community/self-hosting-novu/deploy-with-docker
# website: https://www.novu.co/
# categories: communication, email, devtools
# source: dokploy
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - novu-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  mongodb:
    image: mongo:8.0.17
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${SERVICE_PASSWORD_MONGO_PASSWORD}
    volumes:
      - novu-mongodb:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--username", "${MONGO_INITDB_ROOT_USERNAME:-root}", "--password", "${SERVICE_PASSWORD_MONGO_PASSWORD}", "--eval", "db.adminCommand('ping').ok"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
  api:
    image: ghcr.io/novuhq/novu/api:3.18.0
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      API_ROOT_URL: ${SERVICE_URL_API}
      PORT: ${API_PORT:-3000}
      FRONT_BASE_URL: ${SERVICE_URL_NOVU}
      MONGO_URL: mongodb://root:${SERVICE_PASSWORD_MONGO_PASSWORD}@mongodb:27017/novu-db?authSource=admin
      MONGO_MIN_POOL_SIZE: ${MONGO_MIN_POOL_SIZE:-5}
      MONGO_MAX_POOL_SIZE: ${MONGO_MAX_POOL_SIZE:-10}
      MONGO_AUTO_CREATE_INDEXES: ${MONGO_AUTO_CREATE_INDEXES:-true}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB_INDEX: 2
      REDIS_CACHE_SERVICE_HOST: ${REDIS_CACHE_SERVICE_HOST:-redis}
      REDIS_CACHE_SERVICE_PORT: ${REDIS_CACHE_SERVICE_PORT:-6379}
      S3_LOCAL_STACK: ${S3_LOCAL_STACK:-}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-novu-local}
      S3_REGION: ${S3_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      JWT_SECRET: ${SERVICE_PASSWORD_64_JWT_SECRET}
      STORE_ENCRYPTION_KEY: ${SERVICE_PASSWORD_STORE_ENCRYPTION_KEY}
      NOVU_SECRET_KEY: ${SERVICE_PASSWORD_64_NOVU_SECRET_KEY}
      SUBSCRIBER_WIDGET_JWT_EXPIRATION_TIME: ${SUBSCRIBER_WIDGET_JWT_EXPIRATION_TIME:-15d}
      SENTRY_DSN: ${SENTRY_DSN:-}
      NEW_RELIC_ENABLED: ${NEW_RELIC_ENABLED:-false}
      NEW_RELIC_APP_NAME: ${NEW_RELIC_APP_NAME:-}
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY:-}
      API_CONTEXT_PATH: ${API_CONTEXT_PATH:-}
      IS_API_IDEMPOTENCY_ENABLED: ${IS_API_IDEMPOTENCY_ENABLED:-false}
      IS_API_RATE_LIMITING_ENABLED: ${IS_API_RATE_LIMITING_ENABLED:-false}
      IS_NEW_MESSAGES_API_RESPONSE_ENABLED: ${IS_NEW_MESSAGES_API_RESPONSE_ENABLED:-true}
      IS_V2_ENABLED: ${IS_V2_ENABLED:-true}
      IS_SELF_HOSTED: ${IS_SELF_HOSTED:-true}
      SERVICE_FQDN_API_3000:
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:$${PORT}/v1/health-check || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 40s
  worker:
    image: ghcr.io/novuhq/novu/worker:3.18.0
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${WORKER_PORT:-3004}
      MONGO_URL: mongodb://root:${SERVICE_PASSWORD_MONGO_PASSWORD}@mongodb:27017/novu-db?authSource=admin
      MONGO_MIN_POOL_SIZE: ${MONGO_MIN_POOL_SIZE:-5}
      MONGO_MAX_POOL_SIZE: ${MONGO_MAX_POOL_SIZE:-10}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB_INDEX: 2
      REDIS_CACHE_SERVICE_HOST: ${REDIS_CACHE_SERVICE_HOST:-redis}
      REDIS_CACHE_SERVICE_PORT: ${REDIS_CACHE_SERVICE_PORT:-6379}
      S3_LOCAL_STACK: ${S3_LOCAL_STACK:-}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-novu-local}
      S3_REGION: ${S3_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      STORE_ENCRYPTION_KEY: ${SERVICE_PASSWORD_STORE_ENCRYPTION_KEY}
      SUBSCRIBER_WIDGET_JWT_EXPIRATION_TIME: ${SUBSCRIBER_WIDGET_JWT_EXPIRATION_TIME:-15d}
      SENTRY_DSN: ${SENTRY_DSN:-}
      NEW_RELIC_ENABLED: ${NEW_RELIC_ENABLED:-false}
      NEW_RELIC_APP_NAME: ${NEW_RELIC_APP_NAME:-}
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY:-}
      BROADCAST_QUEUE_CHUNK_SIZE: ${BROADCAST_QUEUE_CHUNK_SIZE:-100}
      MULTICAST_QUEUE_CHUNK_SIZE: ${MULTICAST_QUEUE_CHUNK_SIZE:-100}
      API_ROOT_URL: http://api:${API_PORT:-3000}
      IS_EMAIL_INLINE_CSS_DISABLED: ${IS_EMAIL_INLINE_CSS_DISABLED:-false}
      IS_USE_MERGED_DIGEST_ID_ENABLED: ${IS_USE_MERGED_DIGEST_ID_ENABLED:-false}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:$${PORT:-3004}/v1/health-check || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 20s
  ws:
    image: ghcr.io/novuhq/novu/ws:3.18.0
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: ${WS_PORT:-3002}
      NODE_ENV: ${NODE_ENV:-production}
      MONGO_URL: mongodb://root:${SERVICE_PASSWORD_MONGO_PASSWORD}@mongodb:27017/novu-db?authSource=admin
      MONGO_MIN_POOL_SIZE: ${MONGO_MIN_POOL_SIZE:-5}
      MONGO_MAX_POOL_SIZE: ${MONGO_MAX_POOL_SIZE:-10}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${SERVICE_PASSWORD_64_JWT_SECRET}
      WS_CONTEXT_PATH: ${WS_CONTEXT_PATH:-}
      NEW_RELIC_ENABLED: ${NEW_RELIC_ENABLED:-false}
      NEW_RELIC_APP_NAME: ${NEW_RELIC_APP_NAME:-}
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY:-}
      SERVICE_FQDN_WS_3002:
    expose:
      - "3002"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:$${PORT}/v1/health-check || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 40s
  novu:
    image: ghcr.io/novuhq/novu/dashboard:3.18.0
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_healthy
    environment:
      VITE_API_HOSTNAME: ${SERVICE_URL_API}
      VITE_WEBSOCKET_HOSTNAME: ${SERVICE_URL_WS}
      SERVICE_FQDN_NOVU_4000:
    expose:
      - "4000"
    healthcheck:
      test: ["CMD-SHELL", 'node -e "const http = require(''http''); const req = http.get({hostname: ''localhost'', port: 4000, path: ''/'', timeout: 5000}, (res) => { process.exit(res.statusCode === 200 ? 0 : 1); }); req.on(''error'', () => process.exit(1)); req.on(''timeout'', () => { req.destroy(); process.exit(1); });"']
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 20s
volumes:
  novu-mongodb:
  novu-redis:
