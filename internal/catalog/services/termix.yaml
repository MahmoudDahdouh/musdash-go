# name: Termix
# about: All-in-One SSH & Remote Desktop management app.
# docs: https://docs.termix.site/install/server/docker
# categories: devtools, networking
# source: coolify
services:
  termix:
    image: ghcr.io/lukegus/termix:2.6.1
    environment:
      - SERVICE_URL_TERMIX_8080
      - PORT=8080
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - GUACD_HOST=guacd
      - GUACD_RECORDING_PATH=/termix-data/session_recordings/guacamole
    depends_on:
      - guacd
    volumes:
      - termix-data:/app/data
  guacd:
    image: guacamole/guacd:1.6.0
volumes:
  termix-data:
