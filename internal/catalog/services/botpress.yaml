# name: Botpress
# about: Botpress is a platform for building conversational AI agents.
# docs: https://botpress.com/docs
# website: https://botpress.com
# categories: ai
# source: dokploy
services:
  botpress:
    image: botpress/server:12.31.9
    restart: unless-stopped
    expose:
      - 81
    environment:
      - BP_HOST=0.0.0.0
      - NODE_ENV=production
      - PG_HOST=botpress-db
      - PG_PORT=5432
      - PG_USER=postgres
      - PG_PASSWORD=${SERVICE_PASSWORD_DB_PASSWORD}
      - PG_SSL=false
      - PORT=80
      - SERVICE_FQDN_BOTPRESS_81
    volumes:
      - data:/botpress/data
    depends_on:
      - botpress-db
  botpress-db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_DB_PASSWORD}
      - POSTGRES_DB=botpress
    volumes:
      - db_data:/var/lib/postgresql/data
volumes:
  data:
  db_data:
