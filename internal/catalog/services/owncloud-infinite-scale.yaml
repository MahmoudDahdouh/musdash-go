# name: ownCloud Infinite Scale
# about: ownCloud Infinite Scale is a modern file sync and share platform with WebDAV and ownCloud client support.
# docs: https://doc.owncloud.com/ocis/8.2/admin/depl-examples/ubuntu-compose/ubuntu-compose-prod.html
# website: https://owncloud.com/infinite-scale/
# categories: storage, productivity
# source: dokploy
services:
  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - owncloud-infinite-scale
    expose:
      - "8080"
    environment:
      - SERVICE_FQDN_GATEWAY_8080
    configs:
      - source: gateway-etc-nginx-conf-d-default-conf
        target: /etc/nginx/conf.d/default.conf
  owncloud-infinite-scale:
    image: owncloud/ocis:8.0.3
    restart: unless-stopped
    entrypoint:
      - /bin/sh
    command: ["-c", "ocis init --insecure yes || true; ocis server"]
    expose:
      - "9200"
    environment:
      OCIS_URL: ${SERVICE_URL_GATEWAY}
      OCIS_LOG_LEVEL: ${OCIS_LOG_LEVEL:-info}
      OCIS_INSECURE: "true"
      PROXY_TLS: "false"
      PROXY_HTTP_ADDR: 0.0.0.0:9200
      IDM_ADMIN_PASSWORD: ${SERVICE_PASSWORD_ADMIN_PASSWORD}
      SETTINGS_GRPC_ADDR: 0.0.0.0:9191
      GATEWAY_GRPC_ADDR: 0.0.0.0:9142
      STORAGE_USERS_DATA_GATEWAY_URL: http://owncloud-infinite-scale:9200/data
      THUMBNAILS_FILESYSTEMSTORAGE_ROOT: /var/lib/ocis-thumbnails
    volumes:
      - owncloud-infinite-scale-config:/etc/ocis
      - owncloud-infinite-scale-data:/var/lib/ocis
      - owncloud-infinite-scale-thumbnails:/var/lib/ocis-thumbnails
volumes:
  owncloud-infinite-scale-config:
  owncloud-infinite-scale-data:
  owncloud-infinite-scale-thumbnails:
configs:
  gateway-etc-nginx-conf-d-default-conf:
    content: |
      map $$http_upgrade $$connection_upgrade {
        default upgrade;
        "" close;
      }

      server {
        listen 8080;
        client_max_body_size 0;
        proxy_request_buffering off;

        location / {
          proxy_pass http://owncloud-infinite-scale:9200;
          proxy_http_version 1.1;
          proxy_set_header Host $$host;
          proxy_set_header X-Real-IP $$remote_addr;
          proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Host $$host;
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header Upgrade $$http_upgrade;
          proxy_set_header Connection $$connection_upgrade;
          proxy_read_timeout 3600s;
          proxy_send_timeout 3600s;
        }
      }
