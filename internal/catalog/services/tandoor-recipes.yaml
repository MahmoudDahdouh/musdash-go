# name: Tandoor Recipes
# about: Tandoor Recipes is a self-hosted recipe manager, meal planner, and shopping list application.
# docs: https://docs.tandoor.dev/install/docker/
# website: https://tandoor.dev/
# categories: home
# source: dokploy
services:
  tandoor-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tandoor}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-tandoor}
    volumes:
      - tandoor_db_data:/var/lib/postgresql/data
  tandoor-recipes:
    image: vabene1111/recipes:2.6.11
    restart: unless-stopped
    depends_on:
      - tandoor-db
    environment:
      SECRET_KEY: ${SERVICE_PASSWORD_64_SECRET_KEY}
      TANDOOR_PORT: "8080"
      DB_ENGINE: django.db.backends.postgresql
      POSTGRES_HOST: tandoor-db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-tandoor}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-tandoor}
      ALLOWED_HOSTS: ${SERVICE_FQDN_TANDOOR_RECIPES}
      CSRF_TRUSTED_ORIGINS: ${SERVICE_URL_TANDOOR_RECIPES}
      SERVICE_FQDN_TANDOOR_RECIPES_8080:
    volumes:
      - tandoor_staticfiles:/opt/recipes/staticfiles
      - tandoor_mediafiles:/opt/recipes/mediafiles
    expose:
      - "8080"
volumes:
  tandoor_db_data:
  tandoor_staticfiles:
  tandoor_mediafiles:
