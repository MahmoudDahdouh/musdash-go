# name: Databasus
# about: Databasus is a free, open source and self-hosted tool to backup PostgreSQL, MySQL, and MongoDB.
# docs: https://databasus.com/installation
# categories: devtools, storage
# source: coolify
services:
  databasus:
    image: 'databasus/databasus:v3.16.2'
    environment:
      - SERVICE_URL_DATABASUS_4005
    volumes:
      - 'databasus-data:/databasus-data'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4005/api/v1/system/health']
      interval: 5s
      timeout: 10s
      retries: 5
volumes:
  databasus-data:
