# name: code-server
# about: Code-Server is a web-based code editor that enables remote coding and collaboration from any device, anywhere.
# docs: https://coder.com/docs/code-server/install
# website: https://github.com/coder/code-server
# categories: devtools, docs, productivity
# source: coolify
services:
  code-server:
    image: lscr.io/linuxserver/code-server:latest
    environment:
      - SERVICE_URL_CODESERVER_8443
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
      - PASSWORD=$SERVICE_PASSWORD_64_PASSWORDCODESERVER
      - SUDO_PASSWORD=$SERVICE_PASSWORD_SUDOCODESERVER
      - DEFAULT_WORKSPACE=/config/workspace
    volumes:
      - code-server-config:/config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8443"]
      interval: 2s
      timeout: 10s
      retries: 15
volumes:
  code-server-config:
