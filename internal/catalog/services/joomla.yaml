# name: Joomla
# about: Joomla is a flexible open-source content management system for building websites, portals, and online applications.
# docs: https://manual.joomla.org/
# website: https://www.joomla.org/
# categories: cms
# source: dokploy
services:
  joomla:
    image: joomla:6.1.0-apache
    restart: unless-stopped
    depends_on:
      joomla-db:
        condition: service_healthy
    expose:
      - "80"
    environment:
      JOOMLA_DB_HOST: joomla-db
      JOOMLA_DB_USER: ${JOOMLA_DB_USER:-joomla}
      JOOMLA_DB_PASSWORD: ${SERVICE_PASSWORD_DB_PASSWORD}
      JOOMLA_DB_NAME: ${JOOMLA_DB_NAME:-joomla}
      JOOMLA_SITE_NAME: ${JOOMLA_SITE_NAME:-Joomla}
      JOOMLA_ADMIN_USER: ${JOOMLA_ADMIN_USER:-Joomla Administrator}
      JOOMLA_ADMIN_USERNAME: ${SERVICE_USER_ADMIN_USERNAME}
      JOOMLA_ADMIN_PASSWORD: ${SERVICE_PASSWORD_ADMIN_PASSWORD}
      JOOMLA_ADMIN_EMAIL: ${ADMIN_EMAIL:?Set an email address}
      SERVICE_FQDN_JOOMLA_80:
    volumes:
      - joomla-data:/var/www/html
  joomla-db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${JOOMLA_DB_NAME:-joomla}
      MARIADB_USER: ${JOOMLA_DB_USER:-joomla}
      MARIADB_PASSWORD: ${SERVICE_PASSWORD_DB_PASSWORD}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - joomla-db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
volumes:
  joomla-data:
  joomla-db:
