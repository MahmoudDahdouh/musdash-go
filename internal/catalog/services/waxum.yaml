# name: Waxum
# about: Waxum is a WhatsApp REST API gateway written in Rust, shipped as a single native binary.
# docs: https://waxum.imtaqin.id
# categories: devtools, communication, automation
# source: dokploy
services:
  waxum:
    image: fdciabdul/waxum:0.11.5
    restart: unless-stopped
    expose:
      - 3451
    environment:
      - SUPERADMIN_TOKEN=${SERVICE_PASSWORD_SUPERADMIN_TOKEN}
      - WHATSAPP_STORAGE_PATH=/app/whatsapp_sessions
      - SQLITE_PATH=/app/whatsapp_sessions/waxum.db
      - SERVICE_FQDN_WAXUM_3451
    volumes:
      - waxum_data:/app/whatsapp_sessions
volumes:
  waxum_data:
