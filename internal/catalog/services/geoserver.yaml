# name: GeoServer & PostGIS
# about: An open-source server for sharing geospatial data, paired with a PostGIS database.
# docs: https://docs.geoserver.org/
# website: https://geoserver.org/
# categories: devtools
# source: dokploy
services:
  geoserver:
    image: kartoza/geoserver:2.24.1
    depends_on:
      - db
    environment:
      - GEOSERVER_ADMIN_USER=${GEOSERVER_ADMIN_USER:-admin}
      - GEOSERVER_ADMIN_PASSWORD=${GEOSERVER_ADMIN_PASSWORD:?Set a password to sign in with}
      - INITIAL_MEMORY=${INITIAL_MEMORY:-2G}
      - MAXIMUM_MEMORY=${MAXIMUM_MEMORY:-4G}
      - SERVICE_FQDN_GEOSERVER_8080
    volumes:
      - geoserver-data:/opt/geoserver/data_dir
    restart: unless-stopped
  db:
    image: postgis/postgis:17-3.4
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres_secure}
      - POSTGRES_DB=${POSTGRES_DB:-gis}
    volumes:
      - postgis-data:/var/lib/postgresql/data
    restart: unless-stopped
volumes:
  geoserver-data:
  postgis-data:
