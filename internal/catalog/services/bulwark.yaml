# name: Bulwark
# about: Modern webmail platform.
# docs: https://bulwarkmail.org/docs
# categories: email, communication
# source: coolify
services:
  bulwark:
    image: 'ghcr.io/bulwarkmail/webmail:v1.8.1'
    environment:
      - SERVICE_URL_BULWARK_3000
      - JMAP_SERVER_URL=${JMAP_SERVER_URL:?}
      - SESSION_SECRET=${SERVICE_HEX_64_BULWARK}
    volumes:
      - 'bulwark-config:/app/data/admin'
      - 'bulwark-state:/app/data/admin-state'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
volumes:
  bulwark-config:
  bulwark-state:
