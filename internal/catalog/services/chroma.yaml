# name: Chroma
# about: Chroma is the open-source search and retrieval database for AI applications.
# docs: https://cookbook.chromadb.dev/
# categories: ai
# source: coolify
services:
  chromadb:
    image: chromadb/chroma:1.0.15
    volumes:
      - chroma-data:/data
    environment:
      - SERVICE_URL_CHROMA_8000
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/data
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "cat < /dev/null > /dev/tcp/localhost/8000"]
      interval: 30s
      timeout: 10s
      retries: 3
volumes:
  chroma-data:
