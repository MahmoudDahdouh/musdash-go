# name: Budge
# about: A budgeting personal finance app.
# docs: https://github.com/linuxserver/budge
# categories: finance
# source: coolify
services:
  budge:
    image: lscr.io/linuxserver/budge:latest
    environment:
      - SERVICE_URL_BUDGE
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
      - SERVICE_FQDN_BUDGE_80
    volumes:
      - budge-config:/config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:80"]
      interval: 2s
      timeout: 10s
      retries: 15
volumes:
  budge-config:
