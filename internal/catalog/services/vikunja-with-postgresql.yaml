# name: Vikunja with PostgreSQL
# about: The open-source, self-hostable to-do app. Organize everything, on all platforms.
# docs: https://vikunja.io
# categories: productivity
# source: coolify
services:
  vikunja:
    image: vikunja/vikunja:latest
    environment:
      - SERVICE_URL_VIKUNJA
      - VIKUNJA_SERVICE_PUBLICURL=$SERVICE_URL_VIKUNJA
      - VIKUNJA_SERVICE_SECRET=$SERVICE_PASSWORD_JWTSECRET
      - VIKUNJA_SERVICE_ENABLEREGISTRATION=true
      - VIKUNJA_DATABASE_TYPE=postgres
      - VIKUNJA_DATABASE_HOST=postgresql
      - VIKUNJA_DATABASE_PASSWORD=${SERVICE_PASSWORD_POSTGRESQL}
      - VIKUNJA_DATABASE_USER=${SERVICE_USER_POSTGRESQL}
      - VIKUNJA_DATABASE_DATABASE=${POSTGRESQL_DATABASE:-}
      - SERVICE_FQDN_VIKUNJA_3456
    volumes:
      - vikunja-data:/app/vikunja/
    healthcheck:
      test: ["CMD", "/app/vikunja/vikunja", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      postgresql:
        condition: service_healthy
  postgresql:
    image: postgres:16-alpine
    volumes:
      - vikunja-postgresql-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${SERVICE_USER_POSTGRESQL}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRESQL}
      - POSTGRES_DB=${POSTGRESQL_DATABASE:-}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 20s
      retries: 10
volumes:
  vikunja-data:
  vikunja-postgresql-data:
