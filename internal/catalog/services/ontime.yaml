# name: Ontime
# about: Ontime is browser-based application that manages event rundowns, scheduliing and cuing.
# docs: https://docs.getontime.no
# website: https://getontime.no
# categories: productivity
# source: dokploy
services:
  ontime:
    image: getontime/ontime:v3.8.0
    expose:
      - 4001
      - 8888
      - 9999
    volumes:
      - ontime-data:/data/
    environment:
      - TZ=${TZ:-UTC}
      - SERVICE_FQDN_ONTIME_4001
    restart: unless-stopped
volumes:
  ontime-data:
