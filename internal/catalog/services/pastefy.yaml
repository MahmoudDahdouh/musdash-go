# name: Pastefy
# about: Pastefy is an open-source pastebin with support for syntax highlighting and OAuth2 authentication.
# docs: https://github.com/interaapps/pastefy/wiki
# website: https://pastefy.app/
# categories: devtools
# source: dokploy
services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    volumes:
      - db-db:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${SERVICE_PASSWORD_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-pastefy}
      MYSQL_USER: ${DB_USER:-pastefy}
      MYSQL_PASSWORD: ${SERVICE_PASSWORD_DB_PASSWORD}
  pastefy:
    image: interaapps/pastefy:latest
    restart: unless-stopped
    depends_on:
      - db
    expose:
      - "80"
    environment:
      HTTP_SERVER_PORT: 80
      HTTP_SERVER_CORS: ${HTTP_SERVER_CORS:-*}
      DATABASE_DRIVER: mysql
      DATABASE_NAME: ${DB_NAME:-pastefy}
      DATABASE_USER: ${DB_USER:-pastefy}
      DATABASE_PASSWORD: ${SERVICE_PASSWORD_DB_PASSWORD}
      DATABASE_HOST: db
      DATABASE_PORT: 3306
      SERVER_NAME: ${SERVICE_URL_PASTEFY}
      OAUTH2_INTERAAPPS_CLIENT_ID: '${OAUTH2_INTERAAPPS_CLIENT_ID:-NONE # Interaapps API Key (optional)}'
      OAUTH2_INTERAAPPS_CLIENT_SECRET: '${OAUTH2_INTERAAPPS_CLIENT_SECRET:- # Interaapps API Secret (optional)}'
      OAUTH2_GITHUB_CLIENT_ID: '${OAUTH2_GITHUB_CLIENT_ID:-NONE # GitHub API Key (optional)}'
      OAUTH2_GITHUB_CLIENT_SECRET: '${OAUTH2_GITHUB_CLIENT_SECRET:- # GitHub API Secret (optional)}'
      OAUTH2_GOOGLE_CLIENT_ID: '${OAUTH2_GOOGLE_CLIENT_ID:-NONE # Google API Key (optional)}'
      OAUTH2_GOOGLE_CLIENT_SECRET: '${OAUTH2_GOOGLE_CLIENT_SECRET:- # Google API Secret (optional)}'
      OAUTH2_DISCORD_CLIENT_ID: '${OAUTH2_DISCORD_CLIENT_ID:-NONE # Discord API Key (optional)}'
      OAUTH2_DISCORD_CLIENT_SECRET: '${OAUTH2_DISCORD_CLIENT_SECRET:- # Discord API Secret (optional)}'
      OAUTH2_TWITCH_CLIENT_ID: '${OAUTH2_TWITCH_CLIENT_ID:-NONE # Twitch API Key (optional)}'
      OAUTH2_TWITCH_CLIENT_SECRET: '${OAUTH2_TWITCH_CLIENT_SECRET:- # Twitch API Secret (optional)}'
      SERVICE_FQDN_PASTEFY_80:
volumes:
  db-db:
