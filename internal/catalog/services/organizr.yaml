# name: Organizr
# about: Homelab Services Organizer.
# docs: https://docs.organizr.app/
# categories: productivity
# source: coolify
services:
  organizr:
    image: organizr/organizr:latest
    environment:
      - SERVICE_URL_ORGANIZR_80
      - branch=${branch:-v2-master}
    volumes:
      - organizr-data:/config
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80 || exit 1"]
      interval: 10s
      timeout: 1s
      retries: 3
volumes:
  organizr-data:
