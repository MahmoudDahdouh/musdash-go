# name: Misaka Danmu Server
# about: A self-hosted danmaku (bullet comments) server for live streaming and video platforms.
# docs: https://github.com/l429609201/misaka_danmu_server#readme
# website: https://github.com/l429609201/misaka_danmu_server
# categories: media
# source: dokploy
services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_DB_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER:-danmuapi}
      - POSTGRES_DB=${POSTGRES_DB:-danmuapi}
      - TZ=Asia/Shanghai
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U danmuapi -d danmuapi"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
  danmu-app:
    image: l429609201/misaka_danmu_server:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=0022
      - TZ=Asia/Shanghai
      - DANMUAPI_DATABASE__TYPE=${DANMUAPI_DATABASE__TYPE:-postgresql}
      - DANMUAPI_DATABASE__HOST=${DANMUAPI_DATABASE__HOST:-postgres}
      - DANMUAPI_DATABASE__PORT=${DANMUAPI_DATABASE__PORT:-5432}
      - DANMUAPI_DATABASE__NAME=${DANMUAPI_DATABASE__NAME:-danmuapi}
      - DANMUAPI_DATABASE__USER=${DANMUAPI_DATABASE__USER:-danmuapi}
      - DANMUAPI_DATABASE__PASSWORD=${SERVICE_PASSWORD_DB_PASSWORD}
      - DANMUAPI_ADMIN__INITIAL_USER=${DANMUAPI_ADMIN__INITIAL_USER:-admin}
      - SERVICE_FQDN_DANMU_APP_7768
    volumes:
      - danmu-config:/app/config
volumes:
  postgres-data:
  danmu-config:
