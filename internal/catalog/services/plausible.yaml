# name: Plausible
# about: Plausible is a open source, self-hosted web analytics platform that lets you track website traffic and user behavior.
# docs: https://github.com/plausible/community-edition#readme
# website: https://plausible.io/
# categories: analytics
# source: dokploy
services:
  plausible_db:
    image: postgres:16-alpine
    restart: always
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=postgres
  plausible_events_db:
    image: clickhouse/clickhouse-server:24.12-alpine
    restart: always
    volumes:
      - event-data:/var/lib/clickhouse
      - event-logs:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      - CLICKHOUSE_SKIP_USER_SETUP=1
    configs:
      - source: plausible-events-db-clickhouse-clickhouse-config-xml
        target: /etc/clickhouse-server/config.d/logging.xml
      - source: plausible-events-db-clickhouse-clickhouse-user-config-xml
        target: /etc/clickhouse-server/users.d/logging.xml
  plausible:
    image: ghcr.io/plausible/community-edition:v3.2.1
    restart: always
    command: sh -c "sleep 10 && /entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run"
    depends_on:
      - plausible_db
      - plausible_events_db
    volumes:
      - plausible-data:/var/lib/plausible
    environment:
      - TMPDIR=/var/lib/plausible/tmp
      - BASE_URL=${SERVICE_URL_PLAUSIBLE}
      - SECRET_KEY_BASE=${SERVICE_BASE64_64_SECRET_BASE}
      - TOTP_VAULT_KEY=${SERVICE_BASE64_TOTP_KEY}
      - SERVICE_FQDN_PLAUSIBLE_8000
volumes:
  db-data:
  plausible-data:
  event-data:
  event-logs:
configs:
  plausible-events-db-clickhouse-clickhouse-config-xml:
    content: |
      <clickhouse>
        <logger>
          <level>warning</level>
          <console>true</console>
        </logger>

        <!-- Stop all the unnecessary logging -->
        <query_thread_log remove="remove"/>
        <query_log remove="remove"/>
        <text_log remove="remove"/>
        <trace_log remove="remove"/>
        <metric_log remove="remove"/>
        <asynchronous_metric_log remove="remove"/>
        <session_log remove="remove"/>
        <part_log remove="remove"/>
      </clickhouse>
  plausible-events-db-clickhouse-clickhouse-user-config-xml:
    content: |
      <clickhouse>
        <profiles>
          <default>
            <log_queries>0</log_queries>
            <log_query_threads>0</log_query_threads>
          </default>
        </profiles>
      </clickhouse>
