# name: Yamtrack with PostgreSQL
# about: Yamtrack is a self hosted media tracker for movies, tv shows, anime, manga, video games and books.
# docs: https://github.com/FuzzyGrim/Yamtrack/wiki
# website: https://github.com/FuzzyGrim/Yamtrack
# categories: productivity, automation, home
# source: coolify
services:
  yamtrack:
    image: ghcr.io/fuzzygrim/yamtrack:latest
    environment:
      - SERVICE_URL_YAMTRACK_8000
      - URLS=${SERVICE_URL_YAMTRACK}
      - TZ=${TZ:-Europe/Berlin}
      - SECRET=${SERVICE_PASSWORD_SECRET}
      - REGISTRATION=${REGISTRATION_ENABLED:-true}
      - REDIS_URL=redis://redis:6379
      - DB_HOST=postgres
      - DB_NAME=${POSTGRESQL_DATABASE:-yamtrack-db}
      - DB_USER=${SERVICE_USER_POSTGRESQL}
      - DB_PASSWORD=${SERVICE_PASSWORD_POSTGRESQL}
      - DB_PORT=5432
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8000/health/"]
      interval: 5s
      timeout: 20s
      retries: 10
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${SERVICE_USER_POSTGRESQL}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRESQL}
      - POSTGRES_DB=${POSTGRESQL_DATABASE:-yamtrack-db}
    volumes:
      - yamtrack_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 20s
      retries: 10
  redis:
    image: redis:7-alpine
    volumes:
      - yamtrack_redis_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 20s
      retries: 10
volumes:
  yamtrack_postgres_data:
  yamtrack_redis_data:
