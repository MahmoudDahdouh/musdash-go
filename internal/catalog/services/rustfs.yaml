# name: RustFS
# about: RustFS is a high-performance, S3-compatible distributed object storage system built in Rust.
# docs: https://docs.rustfs.com/
# website: https://rustfs.com/
# categories: storage
# source: dokploy
services:
  rustfs:
    image: rustfs/rustfs:latest
    volumes:
      - rustfs-data:/data
    environment:
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY:-rustfsadmin}
      - RUSTFS_SECRET_KEY=${SERVICE_PASSWORD_SECRET_KEY}
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_CORS_ALLOWED_ORIGINS=*
      - RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS=*
      - SERVICE_FQDN_RUSTFS_9001
      - SERVICE_FQDN_RUSTFS_P9000_9000
    command: /data
    restart: unless-stopped
volumes:
  rustfs-data:
