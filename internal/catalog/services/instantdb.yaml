# name: InstantDB
# about: InstantDB is a real-time database server that provides instant data synchronization and real-time updates for applications.
# docs: https://github.com/instantdb/instant#readme
# website: https://www.instantdb.com/
# categories: database
# source: dokploy
services:
  postgres:
    image: ghcr.io/instantdb/postgresql:postgresql-16-pg-hint-plan
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:-instant}
      POSTGRES_DB: ${POSTGRES_DB:-instant}
    volumes:
      - backend-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-instant}"]
      interval: 10s
      timeout: 5s
      retries: 5
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=4"
      - "-c"
      - "max_wal_senders=4"
      - "-c"
      - "shared_preload_libraries=pg_hint_plan"
      - "-c"
      - "random_page_cost=1.1"
  server:
    depends_on:
      postgres:
        condition: service_healthy
    image: hari1367709/instantdb-server:latest
    restart: unless-stopped
    working_dir: /app
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-instant}:${SERVICE_PASSWORD_POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-instant}"
      NREPL_BIND_ADDRESS: "0.0.0.0"
      PORT: "8888"
      HOST: "0.0.0.0"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-FILL-YOUR-CREDENTIALS}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-FILL-YOUR-CREDENTIALS}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      PYTHONUNBUFFERED: "1"
      NODE_ENV: "production"
      SERVICE_FQDN_SERVER_8888:
    command: ["java", "-Djava.awt.headless=true", "-server", "-jar", "target/instant-standalone.jar"]
    expose:
      - "8888"
      - "6005"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8888/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
volumes:
  backend-db:
