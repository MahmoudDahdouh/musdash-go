# name: Open Journal Systems
# about: Open Journal Systems (OJS) is a journal management and publishing system that has been developed by the Public Knowledge Project through its…
# docs: https://pkp.sfu.ca/ojs/docs/
# website: https://pkp.sfu.ca/ojs/
# categories: cms, docs
# source: dokploy
services:
  db:
    image: mariadb:11.4
    environment:
      MYSQL_ROOT_PASSWORD: "${SERVICE_PASSWORD_MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${OJS_DB_NAME:-ojs}"
      MYSQL_USER: "${OJS_DB_USER:-ojs}"
      MYSQL_PASSWORD: "${SERVICE_PASSWORD_OJS_DB_PASSWORD}"
    volumes:
      - ojs-db-data:/var/lib/mysql
    restart: unless-stopped
  ojs:
    image: "pkpofficial/ojs:3_3_0-21"
    hostname: "${COMPOSE_PROJECT_NAME:-ojs}"
    expose:
      - 80
      - 443
    volumes:
      - ojs-private-files:/var/www/files
      - ojs-public-files:/var/www/html/public
    depends_on:
      - db
    restart: unless-stopped
    environment:
      - SERVICE_FQDN_OJS_80
volumes:
  ojs-db-data:
  ojs-private-files:
  ojs-public-files:
