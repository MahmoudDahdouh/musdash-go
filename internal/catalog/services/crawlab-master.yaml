# name: Crawlab (Master)
# about: Crawlab is a distributed web crawler admin platform supporting multiple programming languages and frameworks.
# docs: https://docs.crawlab.io/
# website: https://www.crawlab.io/en
# categories: automation
# source: dokploy
services:
  crawlab-master:
    image: crawlabteam/crawlab:latest
    restart: unless-stopped
    environment:
      - CRAWLAB_NODE_MASTER=Y
      - CRAWLAB_MONGO_HOST=mongo
      - CRAWLAB_MONGO_PORT=27017
      - CRAWLAB_MONGO_DB=crawlab
      - CRAWLAB_MONGO_USERNAME=${MONGO_USERNAME:-crawlab}
      - CRAWLAB_MONGO_PASSWORD=${SERVICE_PASSWORD_MONGO_PASSWORD}
      - CRAWLAB_MONGO_AUTHSOURCE=admin
      - SERVICE_FQDN_CRAWLAB_MASTER_8080
    volumes:
      - crawlab-master-data:/root/.crawlab
      - crawlab-app-data:/data
      - crawlab-logs:/var/log/crawlab
    expose:
      - "8080"
      - "9666"
    depends_on:
      - mongo
    deploy:
      resources:
        limits:
          cpus: "${CPU_LIMIT:-0.8}"
  mongo:
    image: mongo:4.2
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USERNAME:-crawlab}
      - MONGO_INITDB_ROOT_PASSWORD=${SERVICE_PASSWORD_MONGO_PASSWORD}
    volumes:
      - mongo-data:/data/db
volumes:
  crawlab-master-data:
  crawlab-app-data:
  crawlab-logs:
  mongo-data:
