# name: HortusFox
# about: HortusFox is an open source task and photo management app, designed for photographers and creatives to manage projects, tasks, and images effectively.
# docs: https://github.com/danielbrendel/hortusfox-web#readme
# website: https://www.hortusfox.com/
# categories: home
# source: dokploy
services:
  app:
    image: ghcr.io/danielbrendel/hortusfox-web:latest
    restart: unless-stopped
    volumes:
      - app_images:/var/www/html/public/img
      - app_logs:/var/www/html/app/logs
      - app_backup:/var/www/html/public/backup
      - app_themes:/var/www/html/public/themes
      - app_migrate:/var/www/html/app/migrations
    environment:
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:?Set an email address}
      APP_ADMIN_PASSWORD: ${SERVICE_PASSWORD_APP_ADMIN_PASSWORD}
      APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-hortusfox}
      DB_USERNAME: ${DB_USERNAME:-hortususer}
      DB_PASSWORD: ${SERVICE_PASSWORD_DB_PASSWORD}
      DB_CHARSET: utf8mb4
      SERVICE_FQDN_APP_80:
    depends_on:
      - db
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${SERVICE_PASSWORD_MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_DATABASE:-hortusfox}
      MARIADB_USER: ${DB_USERNAME:-hortususer}
      MARIADB_PASSWORD: ${SERVICE_PASSWORD_DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
volumes:
  db_data:
  app_images:
  app_logs:
  app_backup:
  app_themes:
  app_migrate:
