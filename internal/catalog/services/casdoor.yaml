# name: Casdoor
# about: An open-source UI-first Identity and Access Management (IAM) / Single-Sign-On (SSO) platform with web UI supporting OAuth 2.0, OIDC, SAML, CAS, LDAP…
# docs: https://casdoor.ai/docs/basic/server-installation/
# website: https://casdoor.ai/
# categories: auth, security
# source: dokploy
services:
  casdoor:
    image: casbin/casdoor:latest
    environment:
      - RUNNING_IN_DOCKER=true
      - SERVICE_FQDN_CASDOOR_8000
    volumes:
      - casdoor-data:/data
    depends_on:
      casdoor-db:
        condition: service_healthy
    restart: unless-stopped
    configs:
      - source: casdoor-app-conf
        target: /conf/app.conf
      - source: casdoor-init-data-json
        target: /init_data.json
  casdoor-db:
    image: postgres:16
    environment:
      - POSTGRES_USER=casdoor
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES_PASSWORD}
      - POSTGRES_DB=casdoor
    volumes:
      - casdoor-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casdoor -d casdoor"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
volumes:
  casdoor-postgres-data:
  casdoor-data:
configs:
  casdoor-app-conf:
    content: |
      appname = casdoor
      httpport = 8000
      runmode = prod
      SessionOn = true
      copyrequestbody = true
      driverName = postgres
      dataSourceName = user=casdoor password=${SERVICE_PASSWORD_POSTGRES_PASSWORD} host=casdoor-db port=5432 sslmode=disable dbname=casdoor
      dbName = casdoor
      showSql = false
      redisEndpoint =
      defaultStorageProvider =
      isCloudIntranet = false
      authState = "casdoor"
      socks5Proxy = "127.0.0.1:10808"
      verificationCodeTimeout = 10
      initData = "./init_data.json"
      logPostOnly = true
      isUsernameLowered = false
      origin = "${SERVICE_URL_CASDOOR}"
      staticBaseUrl = "https://cdn.casbin.org"
      isDemoMode = false
      batchSize = 100
      enableGzip = true
      ldapServerPort = 389
      radiusServerPort = 1812
      radiusSecret = "secret"
      quota = {"organization": -1, "user": -1, "application": -1, "provider": -1}
      logConfig = {"filename": "logs/casdoor.log", "maxdays":99999, "perm":"0770"}
      initDataFile = "./init_data.json"
      frontendBaseDir = "../web/build"
