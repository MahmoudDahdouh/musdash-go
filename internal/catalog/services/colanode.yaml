# name: Colanode Server
# about: Open-source and local-first Slack and Notion alternative that puts you in control of your data.
# docs: https://colanode.com/docs/
# website: https://colanode.com
# categories: docs, productivity
# source: dokploy
services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-colanode_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-your_postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-colanode_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
  valkey:
    image: valkey/valkey:8.1
    restart: always
    command: ["valkey-server", "--requirepass", "${VALKEY_PASSWORD:-your_valkey_password}"]
    volumes:
      - valkey_data:/data
  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-your_minio_password}
      MINIO_BROWSER: "on"
      MINIO_DOMAIN: minio
      MINIO_ADDRESS: ":9000"
      MINIO_CONSOLE_ADDRESS: ":9001"
    volumes:
      - minio_data:/data
    entrypoint: sh
    command: -c 'mkdir -p /data/colanode-avatars /data/colanode-files && minio server /data --address ":9000" --console-address ":9001"'
  server:
    image: ghcr.io/colanode/server:latest
    restart: always
    depends_on:
      - postgres
      - valkey
      - minio
    environment:
      NODE_ENV: production
      PORT: 3000
      SERVER_NAME: ${SERVER_NAME:-My Colanode}
      SERVER_AVATAR: ${SERVER_AVATAR:-https://colanode.com/assets/logo-black.png}
      SERVER_MODE: "standalone"
      ACCOUNT_VERIFICATION_TYPE: "automatic"
      ACCOUNT_OTP_TIMEOUT: "600"
      ACCOUNT_ALLOW_GOOGLE_LOGIN: "false"
      USER_STORAGE_LIMIT: "10737418240"
      USER_MAX_FILE_SIZE: "104857600"
      POSTGRES_URL: "postgres://${POSTGRES_USER:-colanode_user}:${POSTGRES_PASSWORD:-your_postgres_password}@postgres:5432/${POSTGRES_DB:-colanode_db}"
      REDIS_URL: "redis://:${VALKEY_PASSWORD:-your_valkey_password}@valkey:6379/0"
      REDIS_DB: "0"
      REDIS_JOBS_QUEUE_NAME: "jobs"
      REDIS_JOBS_QUEUE_PREFIX: "colanode"
      REDIS_EVENTS_CHANNEL: "events"
      S3_AVATARS_ENDPOINT: "http://minio:9000"
      S3_AVATARS_ACCESS_KEY: ${MINIO_ROOT_USER:-admin}
      S3_AVATARS_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-your_minio_password}
      S3_AVATARS_BUCKET_NAME: "colanode-avatars"
      S3_AVATARS_REGION: "us-east-1"
      S3_AVATARS_FORCE_PATH_STYLE: "true"
      STORAGE_S3_ENDPOINT: "http://minio:9000"
      STORAGE_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-admin}
      STORAGE_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-your_minio_password}
      STORAGE_S3_BUCKET: "colanode-files"
      STORAGE_S3_REGION: "us-east-1"
      STORAGE_S3_FORCE_PATH_STYLE: "true"
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-your_smtp_username}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-your_smtp_password}
      SMTP_EMAIL_FROM: ${SMTP_EMAIL_FROM:-your_email@example.com}
      SMTP_EMAIL_FROM_NAME: ${SMTP_EMAIL_FROM_NAME:-Colanode}
      AI_ENABLED: "false"
      SERVICE_FQDN_SERVER_3000:
volumes:
  postgres_data:
  valkey_data:
  minio_data:
