# name: Flatnotes (TOTP)
# about: Flatnotes with TOTP authentication enabled (username + password + one-time passcode).
# docs: https://github.com/dullage/flatnotes
# website: https://flatnotes.io
# categories: docs, productivity, auth
# source: dokploy
services:
  flatnotes:
    image: dullage/flatnotes:latest
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      FLATNOTES_AUTH_TYPE: "totp"
      FLATNOTES_USERNAME: ${SERVICE_USER_USERNAME}
      FLATNOTES_PASSWORD: ${SERVICE_PASSWORD_PASSWORD}
      FLATNOTES_SECRET_KEY: ${SERVICE_PASSWORD_SECRET_KEY}
      FLATNOTES_TOTP_KEY: ${SERVICE_PASSWORD_TOTP_KEY}
      FLATNOTES_SESSION_EXPIRY_DAYS: ${FLATNOTES_SESSION_EXPIRY_DAYS:-30}
      FLATNOTES_PATH_PREFIX: ${FLATNOTES_PATH_PREFIX:-}
      SERVICE_FQDN_FLATNOTES_8080:
    expose:
      - 8080
    volumes:
      - flatnotes-data:/data
volumes:
  flatnotes-data:
