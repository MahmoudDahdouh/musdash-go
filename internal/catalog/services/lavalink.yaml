# name: Lavalink
# about: Lavalink is an open source standalone audio sending node based on Lavaplayer.
# docs: https://lavalink.dev/getting-started/index.html
# website: https://lavalink.dev/
# categories: media
# source: dokploy
services:
  fix-perms:
    image: busybox:1.36
    command: >
      sh -c "mkdir -p /opt/Lavalink/plugins &&

             chmod -R 0777 /opt/Lavalink/plugins || true &&
             chown -R 1000:1000 /opt/Lavalink/plugins || true &&
             echo perms-fixed && sleep 1"
    volumes:
      - fix-perms-plugins:/opt/Lavalink/plugins/
    restart: "no"
    configs:
      - source: fix-perms-application-yml
        target: /opt/Lavalink/application.yml
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    depends_on:
      fix-perms:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      _JAVA_OPTIONS: "${_JAVA_OPTIONS:--Xmx6G}"
      LAVALINK_SERVER_PASSWORD: "${SERVICE_PASSWORD_LAVALINK_SERVER_PASSWORD}"
      SERVER_PORT: "${SERVER_PORT:-2333}"
      SERVICE_FQDN_LAVALINK_2333:
    volumes:
      - lavalink-plugins:/opt/Lavalink/plugins/:rw
    expose:
      - ${SERVER_PORT:-2333}
    healthcheck:
      test: >
        sh -c 'wget --header="Authorization: ${SERVICE_PASSWORD_LAVALINK_SERVER_PASSWORD}" -qO- http://127.0.0.1:${SERVER_PORT:-2333}/v4/info >/dev/null 2>&1 || exit 1'

      interval: 100s
      timeout: 5s
      retries: 5
      start_period: 30s
    entrypoint: >
      sh -c 'until [ -w /opt/Lavalink/plugins ] ; do

                echo "waiting for /opt/Lavalink/plugins to be writable";
                sleep 1;
             done;
             exec java -jar /opt/Lavalink/Lavalink.jar'
    configs:
      - source: lavalink-application-yml
        target: /opt/Lavalink/application.yml
volumes:
  fix-perms-plugins:
  lavalink-plugins:
configs:
  fix-perms-application-yml:
    content: |
      server: # REST and WS server
        port: 2333
        address: 0.0.0.0
        http2:
          enabled: false
      plugins:
      #  name: # Name of the plugin
      #    some_key: some_value # Some key-value pair for the plugin
      #    another_key: another_value
      lavalink:
        plugins:
          # - dependency: "com.github.username.pluginName:pluginName-plugin:x.y.z"
          #   snapshot: false
        # pluginsDir: "/opt/Lavalink/plugins"
        # defaultPluginRepository: "https://maven.lavalink.dev/releases"
        # defaultPluginSnapshotRepository: "https://maven.lavalink.dev/snapshots"
        server:
          password: "youshallnotpass"
          sources:
            # The default Youtube source is now deprecated and won't receive further updates. Please use https://github.com/lavalink-devs/youtube-source#plugin instead.
            youtube: true
            bandcamp: true
            soundcloud: true
            twitch: true
            vimeo: true
            nico: true
            http: true
            local: false
          filters:
            volume: true
            equalizer: true
            karaoke: true
            timescale: true
            tremolo: true
            vibrato: true
            distortion: true
            rotation: true
            channelMix: true
            lowPass: true
          nonAllocatingFrameBuffer: false
          bufferDurationMs: 400
          frameBufferDurationMs: 5000
          opusEncodingQuality: 10
          resamplingQuality: LOW
          trackStuckThresholdMs: 10000
          useSeekGhosting: true
          youtubePlaylistLoadLimit: 6
          playerUpdateInterval: 5
          youtubeSearchEnabled: true
          soundcloudSearchEnabled: true
          gc-warnings: true
          #ratelimit:
            #ipBlocks: ["1.0.0.0/8", "..."] # list of ip blocks
            #excludedIps: ["...", "..."] # ips which should be explicit excluded from usage by lavalink
            #strategy: "RotateOnBan" # RotateOnBan | LoadBalance | NanoSwitch | RotatingNanoSwitch
            #searchTriggersFail: true # Whether a search 429 should trigger marking the ip as failing
            #retryLimit: -1 # -1 = use default lavaplayer value | 0 = infinity | >0 = retry will happen this numbers times
          #youtubeConfig: # Required for avoiding all age restrictions by YouTube, some restricted videos still can be played without.
            #email: "" # Email of Google account
            #password: "" # Password of Google account
          #httpConfig: # Useful for blocking bad-actors from ip-grabbing your music node and attacking it, this way only the http proxy will be attacked
            #proxyHost: "localhost" # Hostname of the proxy, (ip or domain)
            #proxyPort: 3128 # Proxy port, 3128 is the default for squidProxy
            #proxyUser: "" # Optional user for basic authentication fields, leave blank if you don't use basic auth
            #proxyPassword: "" # Password for basic authentication
          timeouts:
            connectTimeoutMs: 3000
            connectionRequestTimeoutMs: 3000
            socketTimeoutMs: 3000

      metrics:
        prometheus:
          enabled: false
          endpoint: /metrics

      sentry:
        dsn: ""
        environment: ""
      #  tags:
      #    some_key: some_value
      #    another_key: another_value

      logging:
        file:
          path: ./logs/

        level:
          root: INFO
          lavalink: INFO

        request:
          enabled: true
          includeClientInfo: true
          includeHeaders: false
          includeQueryString: true
          includePayload: true
          maxPayloadLength: 10000


        logback:
          rollingpolicy:
            max-file-size: 1GB
            max-history: 30
