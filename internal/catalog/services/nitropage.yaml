# name: Nitropage
# about: Nitropage is an extensible, visual website builder, offering a growing library of versatile building blocks, focal-point image cropping and sovereign…
# docs: https://nitropage.org
# categories: cms, docs
# source: coolify
services:
  nitropage:
    image: nitropage/nitropage:sqlite
    environment:
      - SERVICE_URL_NITROPAGE_3000
      - NP_AUTH_SALT=${SERVICE_PASSWORD_SALT}
      - NP_AUTH_PASSWORD=${SERVICE_PASSWORD_64_SESSION}
      - DATABASE_URL=file:../.data/dev.db
    volumes:
      - nitropage-data:/app/.data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/admin"]
      interval: 2s
      timeout: 10s
      retries: 15
volumes:
  nitropage-data:
