# name: FalkorDB
# about: A high-performance graph database for knowledge graphs, GraphRAG, agent memory, fraud detection and other relationship-heavy workloads.
# docs: https://docs.falkordb.com/operations/docker
# website: https://www.falkordb.com/
# categories: database, ai
# source: dokploy
services:
  falkordb:
    image: falkordb/falkordb:v4.20.4-alpine
    restart: unless-stopped
    environment:
      - REDIS_ARGS=--requirepass ${SERVICE_HEX_FALKORDB_PASSWORD} --appendonly yes
      - FALKORDB_ARGS=MAX_QUEUED_QUERIES 25 TIMEOUT 1000 RESULTSET_SIZE 10000 IMPORT_FOLDER /app/.data/import
      - FALKORDB_PASSWORD=${SERVICE_HEX_FALKORDB_PASSWORD}
      - AUTH_URL=${SERVICE_URL_FALKORDB}
      - AUTH_SECRET=${SERVICE_BASE64_64_AUTH_SECRET}
      - NEXTAUTH_URL=${SERVICE_URL_FALKORDB}
      - NEXTAUTH_SECRET=${SERVICE_BASE64_64_AUTH_SECRET}
      - ENCRYPTION_KEY=${SERVICE_HEX_ENCRYPTION_KEY}
      - ALLOWED_ORIGINS=${SERVICE_URL_FALKORDB}
      - TRUST_PROXY_HEADERS=true
      - CSV_STORAGE=local
      - CSV_LOCAL_TEMP_DIR=/app/.data/import
      - CSV_LOCAL_LOAD_URI_MODE=file
      - API_TOKEN_STORAGE_PATH=/app/.data/api_tokens.json
      - SERVICE_FQDN_FALKORDB_3000
    volumes:
      - falkordb_data:/var/lib/falkordb/data
      - falkordb_browser_data:/app/.data
    expose:
      - 3000
      - 6379
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$FALKORDB_PASSWORD redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
volumes:
  falkordb_data:
  falkordb_browser_data:
