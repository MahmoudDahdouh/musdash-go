# name: Garage
# about: Garage is an S3-compatible distributed object storage service designed for self-hosting.
# docs: https://garagehq.deuxfleurs.fr/documentation/
# categories: storage, devtools
# source: coolify
services:
  garage:
    image: dxflrs/garage:v2.3.0
    command:
      - /garage
      - server
      - '--single-node'
      - '--default-bucket'
    environment:
      - GARAGE_S3_API_URL=${GARAGE_S3_API_URL:-}
      - GARAGE_WEB_URL=${GARAGE_WEB_URL:-}
      - GARAGE_ADMIN_URL=${GARAGE_ADMIN_URL:-}
      - GARAGE_RPC_SECRET=${SERVICE_HEX_64_RPCSECRET}
      - GARAGE_ADMIN_TOKEN=$SERVICE_PASSWORD_GARAGE
      - GARAGE_METRICS_TOKEN=$SERVICE_PASSWORD_GARAGEMETRICS
      - GARAGE_ALLOW_WORLD_READABLE_SECRETS=true
      - GARAGE_DEFAULT_ACCESS_KEY=${SERVICE_USER_GARAGE}
      - GARAGE_DEFAULT_SECRET_KEY=${SERVICE_PASSWORD_64_GARAGE}
      - GARAGE_DEFAULT_BUCKET=${GARAGE_DEFAULT_BUCKET:-default}
      - RUST_LOG=${RUST_LOG:-garage=info}
      - SERVICE_FQDN_GARAGE_3900
    volumes:
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "stats", "-a"]
      interval: 10s
      timeout: 5s
      retries: 5
    configs:
      - source: garage-garage-toml
        target: /etc/garage.toml
volumes:
  garage-data:
  garage-meta:
configs:
  garage-garage-toml:
    content: |
      metadata_dir = "/var/lib/garage/meta"
      data_dir = "/var/lib/garage/data"
      db_engine = "lmdb"

      replication_factor = 1
      consistency_mode = "consistent"

      compression_level = 1
      block_size = "1M"

      rpc_bind_addr = "[::]:3901"
      rpc_secret_file = "env:GARAGE_RPC_SECRET"
      bootstrap_peers = []

      [s3_api]
      s3_region = "garage"
      api_bind_addr = "[::]:3900"
      root_domain = ".s3.garage.localhost"

      [s3_web]
      bind_addr = "[::]:3902"
      root_domain = ".web.garage.localhost"

      [admin]
      api_bind_addr = "[::]:3903"
      admin_token_file = "env:GARAGE_ADMIN_TOKEN"
      metrics_token_file = "env:GARAGE_METRICS_TOKEN"
