# name: NocoDB
# about: NocoDB is an open source Airtable alternative. Turns any MySQL, PostgreSQL, SQL Server, SQLite & MariaDB into a smart-spreadsheet.
# docs: https://nocodb.com/
# categories: productivity, backend
# source: coolify
services:
  nocodb:
    image: nocodb/nocodb:latest
    environment:
      - SERVICE_URL_NOCODB_8080
    volumes:
      - nocodb-data:/usr/app/data/
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/api/v1/health"]
      interval: 5s
      timeout: 20s
      retries: 10
volumes:
  nocodb-data:
