# name: VERT
# about: The next-generation file converter. Open source, fully local and free forever.
# docs: https://github.com/VERT-sh/VERT
# categories: devtools, storage, docs
# source: coolify
services:
  vert:
    image: ghcr.io/vert-sh/vert:latest
    environment:
      - SERVICE_URL_VERT_80
      - PUB_VERT_URL=${SERVICE_URL_VERT_80}
      - PUB_HOSTNAME=${SERVICE_URL_VERT_80}
      - PUB_PORT=80
      - PUB_ENV=production
