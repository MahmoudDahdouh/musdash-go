# name: Relaticle
# about: A self-hosted CRM with custom fields, workspaces, a REST API and an AI assistant that works on your records.
# docs: https://relaticle.com/docs/self-hosting
# website: https://relaticle.com/
# categories: business, ai
# source: musdash
services:
  app:
    image: ghcr.io/relaticle/relaticle:latest
    environment:
      - SERVICE_FQDN_APP_8080
      - APP_NAME=${APP_NAME:-Relaticle}
      - APP_ENV=production
      - APP_KEY=base64:${SERVICE_BASE64_APPKEY}
      - APP_DEBUG=false
      - APP_TIMEZONE=${TZ:-UTC}
      - APP_URL=${SERVICE_URL_APP}
      - REQUIRE_EMAIL_VERIFICATION=${REQUIRE_EMAIL_VERIFICATION:-true}
      - LOG_CHANNEL=stderr
      - LOG_LEVEL=warning
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=relaticle
      - DB_USERNAME=${SERVICE_USER_POSTGRES}
      - DB_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=null
      - REDIS_PORT=6379
      - CACHE_STORE=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - MAIL_MAILER=${MAIL_MAILER:-log}
      - MAIL_HOST=${MAIL_HOST:-}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_ENCRYPTION=${MAIL_ENCRYPTION:-tls}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-hello@example.com}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-Relaticle}
      - AUTORUN_ENABLED=true
      - AUTORUN_LARAVEL_MIGRATION=true
      - AUTORUN_LARAVEL_MIGRATION_ISOLATION=true
    volumes:
      - storage:/var/www/html/storage/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/up"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 60s
  horizon:
    image: ghcr.io/relaticle/relaticle:latest
    command: ["php", "/var/www/html/artisan", "horizon"]
    stop_signal: SIGTERM
    environment:
      - APP_NAME=${APP_NAME:-Relaticle}
      - APP_ENV=production
      - APP_KEY=base64:${SERVICE_BASE64_APPKEY}
      - APP_DEBUG=false
      - APP_URL=${SERVICE_URL_APP}
      - LOG_CHANNEL=stderr
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=relaticle
      - DB_USERNAME=${SERVICE_USER_POSTGRES}
      - DB_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=null
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
      - MAIL_MAILER=${MAIL_MAILER:-log}
      - MAIL_HOST=${MAIL_HOST:-}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_ENCRYPTION=${MAIL_ENCRYPTION:-tls}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-hello@example.com}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-Relaticle}
      - AUTORUN_ENABLED=false
    volumes:
      - storage:/var/www/html/storage/app
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "healthcheck-horizon"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 10s
  scheduler:
    image: ghcr.io/relaticle/relaticle:latest
    command: ["php", "/var/www/html/artisan", "schedule:work"]
    stop_signal: SIGTERM
    environment:
      - APP_NAME=${APP_NAME:-Relaticle}
      - APP_ENV=production
      - APP_KEY=base64:${SERVICE_BASE64_APPKEY}
      - APP_DEBUG=false
      - APP_URL=${SERVICE_URL_APP}
      - LOG_CHANNEL=stderr
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=relaticle
      - DB_USERNAME=${SERVICE_USER_POSTGRES}
      - DB_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=null
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
      - AUTORUN_ENABLED=false
    volumes:
      - storage:/var/www/html/storage/app
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "healthcheck-schedule"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 10s
  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_DB=relaticle
      - POSTGRES_USER=${SERVICE_USER_POSTGRES}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  postgres-data:
  redis-data:
  storage:
