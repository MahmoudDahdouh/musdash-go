# name: ClassicPress without a database
# about: A lightweight, stable, instantly familiar free open-source content management system, based on WordPress without the block editor (Gutenberg).
# docs: https://docs.classicpress.net/
# website: https://www.classicpress.net/
# categories: cms
# source: coolify
services:
  classicpress:
    image: classicpress/classicpress:latest
    volumes:
      - classicpress-files:/var/www/html
    environment:
      - SERVICE_URL_CLASSICPRESS
      - SERVICE_FQDN_CLASSICPRESS_80
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1"]
      interval: 2s
      timeout: 10s
      retries: 10
volumes:
  classicpress-files:
