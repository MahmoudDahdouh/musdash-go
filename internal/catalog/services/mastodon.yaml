# name: Mastodon
# about: A social network server whose people follow and talk to accounts on other servers of the fediverse.
# docs: https://docs.joinmastodon.org/admin/install/
# website: https://joinmastodon.org/
# categories: communication
# source: musdash
services:
  web:
    image: ghcr.io/mastodon/mastodon:v4.7.3
    command: bundle exec puma -C config/puma.rb
    environment:
      - SERVICE_FQDN_WEB_3000
      - LOCAL_DOMAIN=${SERVICE_FQDN_WEB}
      - STREAMING_API_BASE_URL=wss://${SERVICE_FQDN_STREAMING}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=mastodon_production
      - DB_USER=mastodon
      - DB_PASS=${SERVICE_PASSWORD_POSTGRES}
      - SECRET_KEY_BASE=${SERVICE_HEX_64_SECRETKEYBASE}
      - ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY=${SERVICE_PASSWORD_DETERMINISTIC}
      - ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT=${SERVICE_PASSWORD_DERIVATIONSALT}
      - ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY=${SERVICE_PASSWORD_PRIMARYKEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - SMTP_SERVER=${SMTP_SERVER:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_LOGIN=${SMTP_LOGIN:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_ADDRESS=${SMTP_FROM_ADDRESS:-notifications@example.com}
    volumes:
      - mastodon-system:/mastodon/public/system
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -s --noproxy 127.0.0.1 http://127.0.0.1:3000/health | grep -q 'OK' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
  streaming:
    image: ghcr.io/mastodon/mastodon-streaming:v4.7.3
    command: node ./streaming/index.js
    environment:
      - SERVICE_FQDN_STREAMING_4000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=mastodon_production
      - DB_USER=mastodon
      - DB_PASS=${SERVICE_PASSWORD_POSTGRES}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -s --noproxy 127.0.0.1 http://127.0.0.1:4000/api/v1/streaming/health | grep -q 'OK' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
  sidekiq:
    image: ghcr.io/mastodon/mastodon:v4.7.3
    command: bundle exec sidekiq
    environment:
      - LOCAL_DOMAIN=${SERVICE_FQDN_WEB}
      - STREAMING_API_BASE_URL=wss://${SERVICE_FQDN_STREAMING}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=mastodon_production
      - DB_USER=mastodon
      - DB_PASS=${SERVICE_PASSWORD_POSTGRES}
      - SECRET_KEY_BASE=${SERVICE_HEX_64_SECRETKEYBASE}
      - ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY=${SERVICE_PASSWORD_DETERMINISTIC}
      - ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT=${SERVICE_PASSWORD_DERIVATIONSALT}
      - ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY=${SERVICE_PASSWORD_PRIMARYKEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - SMTP_SERVER=${SMTP_SERVER:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_LOGIN=${SMTP_LOGIN:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_ADDRESS=${SMTP_FROM_ADDRESS:-notifications@example.com}
    volumes:
      - mastodon-system:/mastodon/public/system
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep '[s]idekiq 8' || false"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
  migrate:
    image: ghcr.io/mastodon/mastodon:v4.7.3
    command: bundle exec rails db:prepare
    restart: "no"
    environment:
      - LOCAL_DOMAIN=${SERVICE_FQDN_WEB}
      - STREAMING_API_BASE_URL=wss://${SERVICE_FQDN_STREAMING}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=mastodon_production
      - DB_USER=mastodon
      - DB_PASS=${SERVICE_PASSWORD_POSTGRES}
      - SECRET_KEY_BASE=${SERVICE_HEX_64_SECRETKEYBASE}
      - ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY=${SERVICE_PASSWORD_DETERMINISTIC}
      - ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT=${SERVICE_PASSWORD_DERIVATIONSALT}
      - ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY=${SERVICE_PASSWORD_PRIMARYKEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - SMTP_SERVER=${SMTP_SERVER:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_LOGIN=${SMTP_LOGIN:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_ADDRESS=${SMTP_FROM_ADDRESS:-notifications@example.com}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  db:
    image: postgres:17-alpine
    shm_size: 256mb
    environment:
      - POSTGRES_USER=mastodon
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DB=mastodon_production
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 30
volumes:
  mastodon-system:
  postgres-data:
  redis-data:
