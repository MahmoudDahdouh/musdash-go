# name: Chibisafe
# about: A beautiful and performant vault to save all your files in the cloud.
# docs: https://chibisafe.app/docs/intro
# categories: storage
# source: coolify
services:
  chibisafe:
    image: chibisafe/chibisafe:v6.5.5
    environment:
      - BASE_API_URL=http://chibisafe-server:8000
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8001"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
  chibisafe-server:
    image: chibisafe/chibisafe-server:v6.5.5
    volumes:
      - chibisafe-database:/app/database:rw
      - chibisafe-uploads:/app/uploads:rw
      - chibisafe-logs:/app/logs:rw
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
  caddy:
    image: caddy:2-alpine
    environment:
      - SERVICE_URL_CHIBISAFE_80
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    volumes:
      - chibisafe-uploads:/app/uploads:ro
    configs:
      - source: caddy-caddyfile
        target: /etc/caddy/Caddyfile
volumes:
  chibisafe-database:
  chibisafe-logs:
  chibisafe-uploads:
configs:
  caddy-caddyfile:
    content: |
      # chibisafe/Caddyfile
      # https://chibisafe.moe/guides/running-with-docker
      :80 {
        route {
          file_server * {
              root /app/uploads
              pass_thru
          }
          @api path /api/*
          reverse_proxy @api http://chibisafe-server:8000 {
              header_up Host {http.reverse_proxy.upstream.hostport}
              header_up X-Real-IP {http.request.header.X-Real-IP}
          }
          @docs path /docs*
          reverse_proxy @docs http://chibisafe-server:8000 {
              header_up Host {http.reverse_proxy.upstream.hostport}
              header_up X-Real-IP {http.request.header.X-Real-IP}
          }
          reverse_proxy http://chibisafe:8001 {
              header_up Host {http.reverse_proxy.upstream.hostport}
              header_up X-Real-IP {http.request.header.X-Real-IP}
          }
        }
      }
