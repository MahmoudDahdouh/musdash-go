# name: Rundeck
# about: Runs jobs and runbooks on your servers from a web page, on a schedule or by hand, with a log of every run.
# docs: https://docs.rundeck.com/docs/administration/install/docker.html
# website: https://www.rundeck.com/
# categories: automation, devtools
# source: musdash
services:
  rundeck:
    image: rundeck/rundeck:6.2.1
    environment:
      - SERVICE_FQDN_RUNDECK_4440
      - RUNDECK_GRAILS_URL=${SERVICE_URL_RUNDECK}
      - RUNDECK_SERVER_FORWARDED=true
      - RUNDECK_DATABASE_DRIVER=org.postgresql.Driver
      - RUNDECK_DATABASE_USERNAME=${SERVICE_USER_RUNDECK}
      - RUNDECK_DATABASE_PASSWORD=${SERVICE_PASSWORD_RUNDECK}
      - RUNDECK_DATABASE_URL=jdbc:postgresql://postgres/rundeck
    volumes:
      - rundeck-data:/home/rundeck/server/data
    configs:
      - source: rundeck-realm
        target: /home/rundeck/server/config/realm.properties
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:4440/user/login || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 90
      start_period: 60s
  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_DB=rundeck
      - POSTGRES_USER=${SERVICE_USER_RUNDECK}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_RUNDECK}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 30
volumes:
  postgres-data:
  rundeck-data:
configs:
  rundeck-realm:
    content: |
      ${SERVICE_USER_ADMIN}: ${SERVICE_PASSWORD_ADMIN},user,admin
