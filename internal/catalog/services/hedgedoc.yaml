# name: HedgeDoc
# about: HedgeDoc is a collaborative Markdown editor for teams that need real-time notes, documentation, and knowledge sharing.
# docs: https://docs.hedgedoc.org/setup/docker/
# website: https://hedgedoc.org/
# categories: docs, productivity
# source: dokploy
services:
  hedgedoc:
    image: quay.io/hedgedoc/hedgedoc:1.10.8
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      - CMD_DB_URL=postgres://hedgedoc:${SERVICE_PASSWORD_DATABASE_PASSWORD}@database:5432/hedgedoc
      - CMD_DOMAIN=${SERVICE_FQDN_HEDGEDOC}
      - CMD_PROTOCOL_USESSL=${CMD_PROTOCOL_USESSL:-true}
      - CMD_URL_ADDPORT=${CMD_URL_ADDPORT:-false}
      - SERVICE_FQDN_HEDGEDOC_3000
    volumes:
      - hedgedoc_uploads:/hedgedoc/public/uploads
    expose:
      - "3000"
  database:
    image: postgres:17.7-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=hedgedoc
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_DATABASE_PASSWORD}
      - POSTGRES_DB=hedgedoc
    volumes:
      - hedgedoc_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hedgedoc -d hedgedoc"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  hedgedoc_uploads:
  hedgedoc_database:
