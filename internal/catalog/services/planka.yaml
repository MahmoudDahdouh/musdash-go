# name: PLANKA
# about: A kanban board for teams, with projects, boards, cards and updates that appear as they happen.
# docs: https://docs.planka.cloud/docs/installation/docker/production-version/
# website: https://planka.app
# categories: productivity
# source: musdash
services:
  planka:
    image: ghcr.io/plankanban/planka:latest
    environment:
      - SERVICE_FQDN_PLANKA_1337
      - BASE_URL=${SERVICE_URL_PLANKA}
      - DATABASE_URL=postgresql://postgres:${SERVICE_PASSWORD_POSTGRES}@postgres/planka
      - SECRET_KEY=${SERVICE_HEX_64_PLANKA}
      - TRUST_PROXY=true
      - DEFAULT_ADMIN_EMAIL=${DEFAULT_ADMIN_EMAIL:-admin@example.com}
      - DEFAULT_ADMIN_PASSWORD=${SERVICE_PASSWORD_ADMIN}
      - DEFAULT_ADMIN_NAME=${DEFAULT_ADMIN_NAME:-Admin}
      - DEFAULT_ADMIN_USERNAME=${SERVICE_USER_ADMIN}
      - DEFAULT_LANGUAGE=${DEFAULT_LANGUAGE:-en-US}
    volumes:
      - data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_DB=planka
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 30
volumes:
  data:
  db-data:
