# name: Storyden
# about: With a fresh new take on traditional bulletin board forum software, Storyden is a modern, secure and extensible platform for building communities.
# docs: https://www.storyden.org/docs/introduction
# website: https://www.storyden.org/
# categories: communication
# source: dokploy
services:
  storyden:
    image: ghcr.io/southclaws/storyden:latest
    expose:
      - 8000
    volumes:
      - storyden_data:/storyden/data
    environment:
      PUBLIC_WEB_ADDRESS: ${SERVICE_URL_STORYDEN}
      PUBLIC_API_ADDRESS: ${SERVICE_URL_STORYDEN}
      SERVICE_FQDN_STORYDEN_8000:
volumes:
  storyden_data:
