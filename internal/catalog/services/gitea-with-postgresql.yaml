# name: Gitea with PostgreSQL
# about: Gitea is a self-hosted, lightweight Git service, offering version control, collaboration, and code hosting.
# docs: https://docs.gitea.com/installation/install-with-docker/
# website: https://about.gitea.com/
# categories: git, productivity, devtools
# source: coolify
services:
  gitea:
    image: gitea/gitea:latest
    environment:
      - SERVICE_URL_GITEA_3000
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=postgresql
      - GITEA__database__NAME=${POSTGRESQL_DATABASE-gitea}
      - GITEA__database__USER=$SERVICE_USER_POSTGRESQL
      - GITEA__database__PASSWD=$SERVICE_PASSWORD_POSTGRESQL
    volumes:
      - gitea-data:/data
    depends_on:
      postgresql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000"]
      interval: 2s
      timeout: 10s
      retries: 15
    ports:
      - "32222:22"
  postgresql:
    image: postgres:16-alpine
    volumes:
      - gitea-postgresql-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${SERVICE_USER_POSTGRESQL}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRESQL}
      - POSTGRES_DB=${POSTGRESQL_DATABASE:-gitea}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 20s
      retries: 10
volumes:
  gitea-data:
  gitea-postgresql-data:
