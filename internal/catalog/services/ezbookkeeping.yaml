# name: EZBookkeeping
# about: EZBookkeeping is a self-hosted bookkeeping application that helps you manage your personal and business finances.
# docs: https://ezbookkeeping.mayswind.net/installation/
# website: https://ezbookkeeping.mayswind.net/
# categories: finance
# source: dokploy
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${SERVICE_PASSWORD_ROOT_PASS}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-ezbookkeeping}
      - MYSQL_USER=${MYSQL_USER:-ezbookkeeping}
      - MYSQL_PASSWORD=${SERVICE_PASSWORD_DB_PASS}
    volumes:
      - mysql-data:/var/lib/mysql
  ezbookkeeping:
    image: mayswind/ezbookkeeping:latest
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      - EBK_SERVER_DOMAIN=${SERVICE_FQDN_EZBOOKKEEPING}
      - EBK_SERVER_ENABLE_GZIP=${EBK_SERVER_ENABLE_GZIP:-true}
      - EBK_DATABASE_TYPE=${EBK_DATABASE_TYPE:-mysql}
      - EBK_DATABASE_HOST=${EBK_DATABASE_HOST:-mysql:3306}
      - EBK_DATABASE_NAME=${EBK_DATABASE_NAME:-ezbookkeeping}
      - EBK_DATABASE_USER=${EBK_DATABASE_USER:-ezbookkeeping}
      - EBK_DATABASE_PASSWD=${SERVICE_PASSWORD_DB_PASS}
      - EBK_LOG_MODE=${EBK_LOG_MODE:-file}
      - EBK_SECURITY_SECRET_KEY=${SERVICE_PASSWORD_64_SECRET_KEY}
      - SERVICE_FQDN_EZBOOKKEEPING_8080
    volumes:
      - storage:/ezbookkeeping/storage
      - logs:/ezbookkeeping/log
volumes:
  mysql-data:
  storage:
  logs:
