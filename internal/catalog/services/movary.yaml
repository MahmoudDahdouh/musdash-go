# name: Movary
# about: Movary is a self-hosted platform for tracking and managing your watched movies using TMDB.
# docs: https://docs.movary.org/install/docker/
# website: https://github.com/leepeuker/movary
# categories: media, analytics
# source: dokploy
services:
  movary:
    image: leepeuker/movary:${MOVARY_VERSION:-latest}
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      DATABASE_MODE: "mysql"
      DATABASE_MYSQL_HOST: "mysql"
      DATABASE_MYSQL_NAME: "movary"
      DATABASE_MYSQL_USER: "movary_user"
      DATABASE_MYSQL_PASSWORD: ${SERVICE_PASSWORD_MYSQL_PASSWORD}
      APP_URL: ${SERVICE_URL_MOVARY}
      APP_ENV: ${APP_ENV:-production}
      SERVICE_FQDN_MOVARY_8080:
    volumes:
      - movary_storage:/app/storage
    depends_on:
      - mysql
  mysql:
    image: mysql:${MYSQL_VERSION:-8.0}
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "movary"
      MYSQL_USER: "movary_user"
      MYSQL_PASSWORD: ${SERVICE_PASSWORD_MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${SERVICE_PASSWORD_MYSQL_ROOT_PASSWORD}
      MYSQL_INNODB_BUFFER_POOL_SIZE: "128M"
      MYSQL_INNODB_LOG_FILE_SIZE: "64M"
    volumes:
      - movary_db:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
volumes:
  movary_db:
  movary_storage:
