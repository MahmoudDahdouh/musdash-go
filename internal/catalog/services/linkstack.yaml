# name: LinkStack
# about: LinkStack is an open-source link-in-bio platform for sharing multiple links using a customizable landing page.
# docs: https://docs.linkstack.org/
# website: https://linkstack.org/
# categories: home, cms
# source: dokploy
services:
  linkstack:
    image: linkstackorg/linkstack:latest
    environment:
      TZ: "Europe/Berlin"
      SERVER_ADMIN: "${ADMIN_EMAIL:?Set an email address}"
      HTTP_SERVER_NAME: "${SERVICE_FQDN_LINKSTACK}"
      HTTPS_SERVER_NAME: "${SERVICE_FQDN_LINKSTACK}"
      LOG_LEVEL: "info"
      PHP_MEMORY_LIMIT: "256M"
      UPLOAD_MAX_FILESIZE: "8M"
      SERVICE_FQDN_LINKSTACK_80:
    volumes:
      - linkstack-data:/htdocs
    restart: unless-stopped
    depends_on:
      - mysql
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${SERVICE_PASSWORD_MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped
volumes:
  linkstack-data:
  mysql-data:
