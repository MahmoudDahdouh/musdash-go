# name: Louez
# about: Open-source equipment rental platform: a branded booking storefront with live availability, plus a back office for reservations, customers, PDF…
# docs: https://github.com/Synapsr/Louez#readme
# website: https://louez.io
# categories: business, ecommerce
# source: dokploy
services:
  louez:
    image: synapsr/louez:2.1.0
    restart: unless-stopped
    environment:
      LOUEZ_MODE: standalone
      DATABASE_URL: mysql://louez:${SERVICE_PASSWORD_DB_PASSWORD}@mysql:3306/louez
      AUTH_URL: ${SERVICE_URL_LOUEZ}
      AUTH_TRUST_HOST: "true"
      NEXT_PUBLIC_APP_URL: ${SERVICE_URL_LOUEZ}
      NEXT_PUBLIC_APP_DOMAIN: ${SERVICE_FQDN_LOUEZ}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: louez
      S3_ACCESS_KEY_ID: louez
      S3_SECRET_ACCESS_KEY: ${SERVICE_PASSWORD_MINIO_PASSWORD}
      S3_PUBLIC_URL: /files
      SERVICE_FQDN_LOUEZ_3000:
    volumes:
      - louez-data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: louez
      MYSQL_USER: louez
      MYSQL_PASSWORD: ${SERVICE_PASSWORD_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${SERVICE_PASSWORD_DB_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command: ["mkdir -p /data/louez && exec minio server /data"]
    environment:
      MINIO_ROOT_USER: louez
      MINIO_ROOT_PASSWORD: ${SERVICE_PASSWORD_MINIO_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  louez-data:
  mysql-data:
  minio-data:
