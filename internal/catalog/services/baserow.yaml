# name: Baserow
# about: Baserow is an open source database management tool that allows you to create and manage databases.
# docs: https://baserow.io/docs/index
# website: https://baserow.io/
# categories: database
# source: dokploy
services:
  baserow:
    image: baserow/baserow:1.25.2
    environment:
      BASEROW_PUBLIC_URL: "${SERVICE_URL_BASEROW}"
      SERVICE_FQDN_BASEROW_80:
    volumes:
      - baserow_data:/baserow/data
volumes:
  baserow_data:
