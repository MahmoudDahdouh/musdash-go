# name: Docker Registry
# about: The Docker Registry lets you distribute Docker images.
# docs: https://distribution.github.io/distribution/
# categories: devtools, media
# source: coolify
services:
  registry:
    image: registry:3
    environment:
      - SERVICE_URL_REGISTRY_5000
      - USERNAME=${SERVICE_USER_REGISTRY}
      - PASSWORD=${SERVICE_PASSWORD_REGISTRY}
      - REGISTRY_AUTH=htpasswd
      - REGISTRY_AUTH_HTPASSWD_REALM=Registry Realm
      - REGISTRY_AUTH_HTPASSWD_PATH=/auth/registry.password
    command: ["/entrypoint.sh"]
    volumes:
      - registry-data:/var/lib/registry
    healthcheck:
      test:
        - CMD
        - wget
        - "-q"
        - "--spider"
        - "http://localhost:5000/"
      interval: 5s
      timeout: 20s
      retries: 10
    configs:
      - source: registry-etc-entrypoint-sh
        target: /entrypoint.sh
        mode: 0555
      - source: registry-config-config-yml
        target: /etc/docker/registry/config.yml
volumes:
  registry-data:
configs:
  registry-etc-entrypoint-sh:
    content: "#!/usr/bin/env sh\nset -e \n\nif [ -z \"$$USERNAME\" ] || [ -z \"$$PASSWORD\" ]; then\n    echo \"Error: USERNAME and PASSWORD environment variables must be set\"\n    exit 1\nfi\n\napk add --no-cache apache2-utils\nmkdir -p \"$$(dirname \"$$REGISTRY_AUTH_HTPASSWD_PATH\")\"\nchmod 755 \"$$(dirname \"$$REGISTRY_AUTH_HTPASSWD_PATH\")\"\nhtpasswd -Bbc \"$$REGISTRY_AUTH_HTPASSWD_PATH\" \"$$USERNAME\" \"$$PASSWORD\"\nregistry serve /etc/docker/registry/config.yml\n"
  registry-config-config-yml:
    content: |-
      version: 0.1
      log:
        fields:
          service: registry
      storage:
        cache:
          blobdescriptor: inmemory
        filesystem:
          rootdirectory: /var/lib/registry
      http:
        addr: :5000
        headers:
          X-Content-Type-Options: [nosniff]
      health:
        storagedriver:
          enabled: true
          interval: 10s
          threshold: 3
