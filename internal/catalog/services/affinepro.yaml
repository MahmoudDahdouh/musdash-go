# name: Affine Pro
# about: Affine Pro is a modern, self-hosted platform designed for collaborative content creation and project management.
# docs: https://docs.affine.pro/self-host-affine/
# website: https://affine.pro/
# categories: productivity
# source: dokploy
services:
  affinepro:
    image: ghcr.io/toeverything/affine:stable
    restart: unless-stopped
    expose:
      - 3010
    volumes:
      - affine-storage:/root/.affine/storage
      - affine-config:/root/.affine/config
    environment:
      - REDIS_SERVER_HOST=redis
      - REDIS_SERVER_PASSWORD=${SERVICE_PASSWORD_REDIS_PASSWORD}
      - DATABASE_URL=postgresql://postgres:${SERVICE_PASSWORD_POSTGRES_PASSWORD}@db:5432/affinepro
      - AFFINE_INDEXER_ENABLED=false
      - AFFINE_SERVER_HOST=${SERVICE_FQDN_AFFINEPRO}
      - MAILER_HOST=${MAILER_HOST:-}
      - MAILER_PORT=${MAILER_PORT:-587}
      - MAILER_USER=${MAILER_USER:-}
      - MAILER_PASSWORD=${MAILER_PASSWORD:-}
      - MAILER_SENDER=${MAILER_SENDER:-}
      - SERVICE_FQDN_AFFINEPRO_3010
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
  migration:
    image: ghcr.io/toeverything/affine:stable
    command: ["sh", "-c", "node ./scripts/self-host-predeploy.js"]
    environment:
      - REDIS_SERVER_HOST=redis
      - REDIS_SERVER_PASSWORD=${SERVICE_PASSWORD_REDIS_PASSWORD}
      - DATABASE_URL=postgresql://postgres:${SERVICE_PASSWORD_POSTGRES_PASSWORD}@db:5432/affinepro
      - AFFINE_INDEXER_ENABLED=false
      - AFFINE_SERVER_HOST=${SERVICE_FQDN_AFFINEPRO}
      - MAILER_HOST=${MAILER_HOST:-}
      - MAILER_PORT=${MAILER_PORT:-587}
      - MAILER_USER=${MAILER_USER:-}
      - MAILER_PASSWORD=${MAILER_PASSWORD:-}
      - MAILER_SENDER=${MAILER_SENDER:-}
    volumes:
      - affine-storage:/root/.affine/storage
      - affine-config:/root/.affine/config
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES_PASSWORD}
      - POSTGRES_DB=affinepro
      - POSTGRES_INITDB_ARGS=--data-checksums
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "affinepro"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${SERVICE_PASSWORD_REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${SERVICE_PASSWORD_REDIS_PASSWORD}' ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  affine-storage:
  affine-config:
  postgres-data:
  redis-data:
