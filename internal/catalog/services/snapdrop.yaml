# name: Snapdrop
# about: A self-hosted file-sharing service for secure and convenient file transfers, whether on a local network or the internet.
# docs: https://github.com/RobinLinus/snapdrop
# categories: productivity, storage, networking
# source: coolify
services:
  snapdrop:
    image: 'linuxserver/snapdrop:version-b8b78cc2'
    environment:
      - SERVICE_URL_SNAPDROP
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
      - SERVICE_FQDN_SNAPDROP_80
    volumes:
      - snapdrop-config:/config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:80"]
      interval: 2s
      timeout: 10s
      retries: 15
volumes:
  snapdrop-config:
