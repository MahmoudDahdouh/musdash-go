# name: Evershop
# about: Your All-in-One open source ecommerce solution.
# docs: https://evershop.io/docs/development/getting-started/installation-guide
# website: https://evershop.io/
# categories: ecommerce
# source: dokploy
services:
  evershop-app:
    image: evershop/evershop:latest
    restart: always
    environment:
      DB_HOST: database
      DB_PORT: ${DB_PORT:-5432}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_USER: ${DB_USER:-postgres}
      DB_NAME: ${DB_NAME:-evershop}
      SERVICE_FQDN_EVERSHOP_APP_3000:
    depends_on:
      - database
    expose:
      - 3000
  database:
    image: postgres:16
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_DB: ${DB_NAME:-evershop}
    expose:
      - ${DB_PORT:-5432}
volumes:
  postgres-data:
