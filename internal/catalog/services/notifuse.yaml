# name: Notifuse
# about: Open-source newsletter and notification platform that empowers teams to create, send, and track communications at scale.
# docs: https://docs.notifuse.com/
# website: https://notifuse.com/
# categories: business, email, communication
# source: dokploy
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
  notifuse:
    image: notifuse/notifuse:latest
    restart: unless-stopped
    depends_on:
      - db
    environment:
      ROOT_EMAIL: ${ROOT_EMAIL:?Set an email address}
      API_ENDPOINT: ${SERVICE_URL_NOTIFUSE}
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_PREFIX: notifuse
      DB_NAME: postgres
      DB_SSLMODE: disable
      SECRET_KEY: ${SERVICE_BASE64_64_SECRET_KEY}
      SERVER_PORT: 8080
      SERVER_HOST: 0.0.0.0
      ENVIRONMENT: production
      SERVICE_FQDN_NOTIFUSE_8080:
    volumes:
      - notifuse_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
volumes:
  db_data:
  notifuse_data:
