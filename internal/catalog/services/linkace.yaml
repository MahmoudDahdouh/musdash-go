# name: LinkAce
# about: A self-hosted bookmark archive with tags, lists, link checking and full-text search through Meilisearch.
# docs: https://www.linkace.org/docs/v2/setup/setup-with-docker/
# website: https://www.linkace.org
# categories: productivity, rss
# source: musdash
services:
  app:
    image: docker.io/linkace/linkace:latest
    environment:
      - SERVICE_FQDN_APP_80
      - APP_URL=${SERVICE_URL_APP}
      - APP_KEY=base64:${SERVICE_BASE64_APPKEY}
      - TRUSTED_PROXIES=*
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=linkace
      - DB_USERNAME=linkace
      - DB_PASSWORD=${SERVICE_PASSWORD_DB}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${SERVICE_PASSWORD_REDIS}
      - APP_SEARCH_DRIVER=meilisearch
      - MEILISEARCH_HOST=http://meilisearch:7700
      - MEILISEARCH_KEY=${SERVICE_PASSWORD_MEILI}
    volumes:
      - linkace-backups:/app/storage/app/backups
    depends_on:
      db:
        condition: service_healthy
      meilisearch:
        condition: service_started
      redis:
        condition: service_healthy
  db:
    image: mariadb:11
    environment:
      - MYSQL_ROOT_PASSWORD=${SERVICE_PASSWORD_ROOT}
      - MYSQL_USER=linkace
      - MYSQL_PASSWORD=${SERVICE_PASSWORD_DB}
      - MYSQL_DATABASE=linkace
    volumes:
      - linkace-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 30
  meilisearch:
    image: getmeili/meilisearch:v1.16
    environment:
      - MEILI_ENV=production
      - MEILI_NO_ANALYTICS=true
      - MEILI_MASTER_KEY=${SERVICE_PASSWORD_MEILI}
    volumes:
      - linkace-meilisearch:/meili_data
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${SERVICE_PASSWORD_REDIS}
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${SERVICE_PASSWORD_REDIS}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  linkace-backups:
  linkace-db:
  linkace-meilisearch:
