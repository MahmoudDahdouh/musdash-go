# name: systemprompt
# about: Self-owned AI control plane: governance gateway for Claude, OpenAI, and Gemini with policy checks, audit trails, rate limits, and MCP orchestration.
# docs: https://systemprompt.io/documentation/
# website: https://systemprompt.io
# categories: ai
# source: dokploy
services:
  systemprompt:
    image: ghcr.io/systempromptio/systemprompt-template:0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://systemprompt:${SERVICE_PASSWORD_POSTGRES_PASSWORD}@postgres:5432/systemprompt
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      EXTERNAL_URL: ${SERVICE_URL_SYSTEMPROMPT}
      HOST: 0.0.0.0
      PORT: 8080
      SERVICE_FQDN_SYSTEMPROMPT_8080:
    expose:
      - 8080
    volumes:
      - systemprompt_web:/app/web
      - systemprompt_storage:/app/storage/data
      - systemprompt_profiles:/app/services/profiles/docker
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      start_period: 300s
      retries: 3
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: systemprompt
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES_PASSWORD}
      POSTGRES_DB: systemprompt
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U systemprompt -d systemprompt"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  systemprompt_web:
  systemprompt_storage:
  systemprompt_profiles:
  postgres_data:
