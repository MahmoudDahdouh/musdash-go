# name: Firefly III
# about: Firefly III is a self-hosted personal finance manager for tracking expenses, budgets, accounts, and financial reports.
# docs: https://docs.firefly-iii.org/
# website: https://www.firefly-iii.org/
# categories: finance
# source: dokploy
services:
  firefly-iii:
    image: fireflyiii/core:version-6.6.3
    restart: unless-stopped
    depends_on:
      firefly-iii-db:
        condition: service_healthy
    environment:
      APP_KEY: base64:${SERVICE_BASE64_APP_KEY}
      APP_URL: ${SERVICE_URL_FIREFLY_III}
      TRUSTED_PROXIES: "**"
      TZ: ${TZ:-UTC}
      SITE_OWNER: ${SITE_OWNER_EMAIL:?Set an email address}
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-en_US}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-equal}
      DB_CONNECTION: mysql
      DB_HOST: firefly-iii-db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-firefly}
      DB_USERNAME: ${DB_USERNAME:-firefly}
      DB_PASSWORD: ${SERVICE_PASSWORD_DB_PASSWORD}
      STATIC_CRON_TOKEN: ${SERVICE_HEX_CRON_TOKEN}
      SERVICE_FQDN_FIREFLY_III_8080:
    expose:
      - "8080"
    volumes:
      - firefly-iii-upload:/var/www/html/storage/upload
  firefly-iii-db:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-firefly}
      MYSQL_USER: ${DB_USERNAME:-firefly}
      MYSQL_PASSWORD: ${SERVICE_PASSWORD_DB_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - firefly-iii-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
  firefly-iii-cron:
    image: alpine:3.22
    restart: unless-stopped
    depends_on:
      - firefly-iii
    environment:
      TZ: ${TZ:-UTC}
      STATIC_CRON_TOKEN: ${SERVICE_HEX_CRON_TOKEN}
    command:
      - sh
      - -c
      - |
        apk add --no-cache tzdata wget && \
        (ln -snf /usr/share/zoneinfo/$$TZ /etc/localtime || true) && \
        echo "0 3 * * * wget -qO- http://firefly-iii:8080/api/v1/cron/$$STATIC_CRON_TOKEN; echo" | crontab - && \
        crond -f -L /dev/stdout
volumes:
  firefly-iii-upload:
  firefly-iii-db:
