# name: GoatCounter
# about: Lightweight web analytics platform.
# docs: https://www.goatcounter.com/help/start
# website: https://www.goatcounter.com/
# categories: analytics
# source: coolify
services:
  goatcounter:
    image: arp242/goatcounter:2.7
    environment:
      - SERVICE_URL_GOATCOUNTER_8080
    volumes:
      - goatcounter-data:/home/goatcounter/goatcounter-data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/status >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  goatcounter-data:
