# name: Evolution GO
# about: Evolution Go is a high-performance implementation of the WhatsApp API, written in Go.
# docs: https://docs.evolutionfoundation.com.br/evolution-go/installation
# website: https://evolutionfoundation.com.br/
# categories: devtools, communication
# source: dokploy
services:
  evolution-go:
    image: evoapicloud/evolution-go:latest
    restart: always
    environment:
      - SERVER_PORT=${SERVER_PORT:-8080}
      - CLIENT_NAME=${CLIENT_NAME:-Evolution}
      - GLOBAL_API_KEY=${SERVICE_BASE64_64_API_KEY}
      - POSTGRES_AUTH_DB=postgres://postgresql:${SERVICE_PASSWORD_POSTGRES_PASSWORD}@evolution-postgres:5432/evogo_auth?sslmode=disable
      - POSTGRES_USERS_DB=postgres://postgresql:${SERVICE_PASSWORD_POSTGRES_PASSWORD}@evolution-postgres:5432/evogo_users?sslmode=disable
      - DATABASE_SAVE_MESSAGES=${DATABASE_SAVE_MESSAGES:-false}
      - WADEBUG=${WADEBUG:-INFO}
      - LOGTYPE=${LOGTYPE:-console}
    volumes:
      - evolution-go-data:/app/dbdata
      - evolution-go-logs:/app/logs
    depends_on:
      - evolution-postgres
  evolution-gateway:
    image: nginx:alpine
    restart: always
    depends_on:
      - evolution-go
    environment:
      - SERVICE_FQDN_EVOLUTION_GATEWAY_80
    configs:
      - source: evolution-gateway-gateway-conf
        target: /etc/nginx/conf.d/default.conf
  evolution-postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DATABASE:-evolution}
      - POSTGRES_USER=${POSTGRES_USERNAME:-postgresql}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES_PASSWORD}
    volumes:
      - evolution-postgres-data:/var/lib/postgresql/data
volumes:
  evolution-postgres-data:
  evolution-go-data:
  evolution-go-logs:
configs:
  evolution-gateway-gateway-conf:
    content: |
      map $$http_upgrade $$connection_upgrade {
          default upgrade;
          ''      close;
      }

      server {
          listen 80;
          server_name _;
          absolute_redirect off;
          client_max_body_size 100m;

          # Evolution GO has no route on "/" (and the API answers 503 until the
          # license is activated), so send visitors to the bundled manager UI.
          location = / {
              return 302 /manager/login;
          }

          location / {
              proxy_pass http://evolution-go:8080;
              proxy_http_version 1.1;
              proxy_set_header Host $$host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$scheme;
              proxy_set_header Upgrade $$http_upgrade;
              proxy_set_header Connection $$connection_upgrade;
              proxy_read_timeout 3600s;
              proxy_send_timeout 3600s;
          }
      }
