# name: Budibase
# about: Low code platform for building business apps and workflows in minutes. Supports PostgreSQL, MySQL, MSSQL, MongoDB, Rest API, Docker, K8s, and more.
# docs: https://docs.budibase.com/docs/docker-compose
# website: https://budibase.com/
# categories: automation, backend, devtools
# source: coolify
services:
  app-service:
    image: budibase.docker.scarf.sh/budibase/apps:latest
    environment:
      - SELF_HOSTED=1
      - COUCH_DB_URL=http://$SERVICE_USER_COUCHDB:$SERVICE_PASSWORD_COUCHDB@couchdb-service:5984
      - WORKER_URL=http://worker-service:4003
      - MINIO_URL=http://minio-service:9000
      - MINIO_ACCESS_KEY=$SERVICE_USER_MINIO
      - MINIO_SECRET_KEY=$SERVICE_PASSWORD_MINIO
      - INTERNAL_API_KEY=$SERVICE_PASSWORD_64_BUDIBASE
      - BUDIBASE_ENVIRONMENT=${BUDIBASE_ENVIRONMENT:-PRODUCTION}
      - PORT=4002
      - API_ENCRYPTION_KEY=$SERVICE_PASSWORD_64_BUDIBASEAPI
      - ENCRYPTION_KEY=$SERVICE_PASSWORD_64_BUDIBASE
      - JWT_SECRET=$SERVICE_PASSWORD_64_BUDIBASEJWT
      - LOG_LEVEL=info
      - ENABLE_ANALYTICS=${ENABLE_ANALYTICS:-true}
      - REDIS_URL=redis-service:6379
      - REDIS_PASSWORD=$SERVICE_PASSWORD_REDIS
      - BB_ADMIN_USER_EMAIL=
      - BB_ADMIN_USER_PASSWORD=
    depends_on:
      - worker-service
      - redis-service
    healthcheck:
      test: ["CMD", "wget", "--spider", "-qO-", "http://localhost:4002/health"]
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 10s
  worker-service:
    image: budibase.docker.scarf.sh/budibase/worker:latest
    environment:
      - SELF_HOSTED=1
      - PORT=4003
      - CLUSTER_PORT=10000
      - API_ENCRYPTION_KEY=$SERVICE_PASSWORD_64_BUDIBASEAPI
      - JWT_SECRET=$SERVICE_PASSWORD_64_BUDIBASEJWT
      - MINIO_ACCESS_KEY=$SERVICE_USER_MINIO
      - MINIO_SECRET_KEY=$SERVICE_PASSWORD_MINIO
      - MINIO_URL=http://minio-service:9000
      - APPS_URL=http://app-service:4002
      - COUCH_DB_USERNAME=$SERVICE_USER_COUCHDB
      - COUCH_DB_PASSWORD=$SERVICE_PASSWORD_COUCHDB
      - COUCH_DB_URL=http://$SERVICE_USER_COUCHDB:$SERVICE_PASSWORD_COUCHDB@couchdb-service:5984
      - INTERNAL_API_KEY=$SERVICE_PASSWORD_64_BUDIBASE
      - REDIS_URL=redis-service:6379
      - REDIS_PASSWORD=$SERVICE_PASSWORD_REDIS
    depends_on:
      - redis-service
      - minio-service
    healthcheck:
      test: ["CMD", "wget", "--spider", "-qO-", "http://localhost:4003/health"]
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 10s
  minio-service:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    volumes:
      - minio_data:/data
    environment:
      - MINIO_ROOT_USER=$SERVICE_USER_MINIO
      - MINIO_ROOT_PASSWORD=$SERVICE_PASSWORD_MINIO
      - MINIO_BROWSER=off
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 20s
      retries: 10
  proxy-service:
    image: budibase/proxy:latest
    environment:
      - SERVICE_URL_BUDIBASE_10000
      - PROXY_RATE_LIMIT_WEBHOOKS_PER_SECOND=10
      - PROXY_RATE_LIMIT_API_PER_SECOND=20
      - APPS_UPSTREAM_URL=http://app-service:4002
      - WORKER_UPSTREAM_URL=http://worker-service:4003
      - MINIO_UPSTREAM_URL=http://minio-service:9000
      - COUCHDB_UPSTREAM_URL=http://couchdb-service:5984
      - RESOLVER=127.0.0.11
    depends_on:
      - minio-service
      - worker-service
      - app-service
      - couchdb-service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10000/"]
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 10s
  couchdb-service:
    image: budibase/database:latest
    environment:
      - COUCHDB_PASSWORD=$SERVICE_PASSWORD_COUCHDB
      - COUCHDB_USER=$SERVICE_USER_COUCHDB
      - TARGETBUILD=docker-compose
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5984/"]
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 10s
    volumes:
      - couchdb3_data:/data
  redis-service:
    image: redis:latest
    command: redis-server --requirepass "$SERVICE_PASSWORD_REDIS"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$SERVICE_PASSWORD_REDIS", "ping"]
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 10s
volumes:
  couchdb3_data:
  minio_data:
  redis_data:
