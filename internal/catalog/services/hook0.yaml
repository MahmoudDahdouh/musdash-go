# name: Hook0
# about: An open-source webhook server that delivers events to your customers' endpoints, with a dashboard and API.
# docs: https://documentation.hook0.com/docs/self-hosting/docker-compose
# website: https://www.hook0.com
# categories: devtools, backend
# source: musdash
services:
  api:
    image: hook0/hook0-api:1.0.2
    environment:
      - SERVICE_FQDN_API_8081
      - IP=0.0.0.0
      - PORT=8081
      - DATABASE_URL=postgres://hook0:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/hook0
      - BISCUIT_PRIVATE_KEY=${SERVICE_HEX_64_BISCUIT}
      - CORS_ALLOWED_ORIGINS=${SERVICE_URL_FRONTEND}
      - APP_URL=${SERVICE_URL_FRONTEND}
      - SMTP_CONNECTION_URL=${SMTP_CONNECTION_URL:-smtp://localhost:1025}
      - EMAIL_SENDER_ADDRESS=${EMAIL_SENDER_ADDRESS:-hook0@example.com}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --user-agent 'docker-compose-healthcheck' http://127.0.0.1:8081/api/v1/swagger.json || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
  frontend:
    image: hook0/hook0-frontend:1.2.1
    environment:
      - SERVICE_FQDN_FRONTEND_80
      - API_ENDPOINT=${SERVICE_URL_API}/api/v1
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --user-agent 'docker-compose-healthcheck' http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
  output-worker:
    image: hook0/hook0-output-worker:1.0.7
    environment:
      - DATABASE_URL=postgres://hook0:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/hook0
      - WORKER_NAME=default
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
  postgres:
    image: postgres:18-alpine
    environment:
      - POSTGRES_USER=hook0
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DB=hook0
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  postgres-data:
