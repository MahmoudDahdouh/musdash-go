# name: Hoarder
# about: Hoarder is an open source "Bookmark Everything" app that uses AI for automatically tagging the content you throw at it.
# docs: https://docs.hoarder.app/
# website: https://hoarder.app/
# categories: productivity
# source: dokploy
services:
  web:
    image: ghcr.io/hoarder-app/hoarder:0.22.0
    restart: unless-stopped
    volumes:
      - hoarder-data:/data
    expose:
      - 3000
    environment:
      - DISABLE_SIGNUPS
      - NEXTAUTH_URL=${SERVICE_URL_WEB}
      - NEXTAUTH_SECRET=${SERVICE_BASE64_NEXT_SECRET}
      - MEILI_ADDR=http://meilisearch:7700
      - BROWSER_WEB_URL=http://chrome:9222
      - DATA_DIR=/data
      - MEILI_MASTER_KEY=${SERVICE_BASE64_MEILI_MASTER_KEY}
      - SERVICE_FQDN_WEB_3000
  chrome:
    image: gcr.io/zenika-hub/alpine-chrome:124
    restart: unless-stopped
    command:
      - --no-sandbox
      - --disable-gpu
      - --disable-dev-shm-usage
      - --remote-debugging-address=0.0.0.0
      - --remote-debugging-port=9222
      - --hide-scrollbars
  meilisearch:
    image: getmeili/meilisearch:v1.6
    restart: unless-stopped
    environment:
      - MEILI_MASTER_KEY=${SERVICE_BASE64_MEILI_MASTER_KEY}
      - MEILI_NO_ANALYTICS=true
    volumes:
      - meilisearch-data:/meili_data
    healthcheck:
      test:
        - CMD
        - curl
        - '-f'
        - 'http://127.0.0.1:7700/health'
      interval: 2s
      timeout: 10s
      retries: 15
volumes:
  meilisearch-data:
  hoarder-data:
