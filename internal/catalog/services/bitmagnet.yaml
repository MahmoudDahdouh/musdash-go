# name: Bitmagnet
# about: A BitTorrent indexer that crawls the DHT network and offers a searchable web interface.
# docs: https://bitmagnet.io/setup/installation.html
# website: https://bitmagnet.io/
# categories: media, search
# source: musdash
services:
  bitmagnet:
    image: ghcr.io/bitmagnet-io/bitmagnet:latest
    environment:
      - SERVICE_FQDN_BITMAGNET_3333
      - POSTGRES_HOST=postgres
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - bitmagnet-config:/root/.config/bitmagnet
    command:
      - worker
      - run
      - --keys=http_server
      - --keys=queue_server
      - --keys=dht_crawler
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3334:3334"
      - "3334:3334/udp"
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DB=bitmagnet
      - PGUSER=postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    shm_size: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      start_period: 20s
      interval: 10s
      timeout: 5s
      retries: 30
volumes:
  bitmagnet-config:
  postgres-data:
