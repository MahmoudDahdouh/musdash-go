# name: EMQX Enterprise
# about: Open-source MQTT broker for IoT, IIoT, and connected vehicles.
# docs: https://docs.emqx.com/en/emqx/latest/get-started/deploy/install-docker.html
# website: https://www.emqx.com/en/products/emqx
# categories: networking, backend, home
# source: coolify
services:
  emqx:
    image: emqx/emqx-enterprise:6.2.2
    environment:
      - SERVICE_URL_EMQX_18083
      - EMQX_DASHBOARD__DEFAULT_PASSWORD=${SERVICE_PASSWORD_EMQX}
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 10s
      timeout: 30s
      retries: 5
      start_period: 30s
    ports:
      - "1883:1883"
      - "8083:8083"
      - "8084:8084"
      - "8883:8883"
volumes:
  emqx_data:
  emqx_log:
