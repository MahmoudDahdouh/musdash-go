# name: Audiobookshelf
# about: Self-hosted audiobook, ebook, and podcast server.
# docs: https://audiobookshelf.org/docs/documentation/install/docker/
# website: https://audiobookshelf.org/
# categories: media
# source: coolify
services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:2.34.0
    environment:
      - SERVICE_URL_AUDIOBOOKSHELF_80
      - TZ=${TIMEZONE:-America/Toronto}
    volumes:
      - audiobookshelf-audiobooks:/audiobooks
      - audiobookshelf-podcasts:/podcasts
      - audiobookshelf-config:/config
      - audiobookshelf-metadata:/metadata
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --timeout=5 http://localhost:80/ping -O /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
volumes:
  audiobookshelf-audiobooks:
  audiobookshelf-config:
  audiobookshelf-metadata:
  audiobookshelf-podcasts:
