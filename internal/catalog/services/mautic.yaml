# name: Mautic
# about: Mautic is the world's largest open-source marketing automation project.
# docs: https://docs.mautic.org/en/7.2/getting_started/how_to_install_mautic.html
# website: https://mautic.org/
# categories: business, automation, email
# source: dokploy
services:
  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${SERVICE_PASSWORD_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MAUTIC_DB_DATABASE:-mautic}
      MYSQL_USER: ${MAUTIC_DB_USER:-mautic}
      MYSQL_PASSWORD: ${SERVICE_PASSWORD_DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
  mautic:
    image: mautic/mautic:5.1.1-apache
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - 80
    environment:
      - DOCKER_MAUTIC_ROLE=mautic_web
      - DOCKER_MAUTIC_RUN_MIGRATIONS=true
      - MAUTIC_DB_HOST=${MAUTIC_DB_HOST:-mysql}
      - MAUTIC_DB_PORT=${MAUTIC_DB_PORT:-3306}
      - MAUTIC_DB_DATABASE=${MAUTIC_DB_DATABASE:-mautic}
      - MAUTIC_DB_USER=${MAUTIC_DB_USER:-mautic}
      - MAUTIC_DB_PASSWORD=${SERVICE_PASSWORD_DB_PASSWORD}
      - MAUTIC_URL=${SERVICE_URL_MAUTIC}
      - MAUTIC_TRUSTED_PROXIES=${MAUTIC_TRUSTED_PROXIES:-["0.0.0.0/0"]}
      - MAUTIC_MESSENGER_DSN_EMAIL=${MAUTIC_MESSENGER_DSN_EMAIL:-doctrine://default}
      - MAUTIC_MESSENGER_DSN_HIT=${MAUTIC_MESSENGER_DSN_HIT:-doctrine://default}
      - PHP_INI_DATE_TIMEZONE=${PHP_INI_DATE_TIMEZONE:-UTC}
      - PHP_MEMORY_LIMIT=${PHP_MEMORY_LIMIT:-512M}
      - SERVICE_FQDN_MAUTIC_80
    volumes:
      - mautic_data:/var/www/html
    entrypoint: ["/bin/sh", "-c", "chown -R www-data:www-data /var/www/html && /entrypoint.sh apache2-foreground"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/www/html/config/local.php || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 300s
  mautic-cron:
    image: mautic/mautic:5.1.1-apache
    restart: unless-stopped
    depends_on:
      mautic:
        condition: service_healthy
    environment:
      - DOCKER_MAUTIC_ROLE=mautic_cron
      - MAUTIC_DB_HOST=${MAUTIC_DB_HOST:-mysql}
      - MAUTIC_DB_PORT=${MAUTIC_DB_PORT:-3306}
      - MAUTIC_DB_DATABASE=${MAUTIC_DB_DATABASE:-mautic}
      - MAUTIC_DB_USER=${MAUTIC_DB_USER:-mautic}
      - MAUTIC_DB_PASSWORD=${SERVICE_PASSWORD_DB_PASSWORD}
      - MAUTIC_URL=${SERVICE_URL_MAUTIC}
      - PHP_INI_DATE_TIMEZONE=${PHP_INI_DATE_TIMEZONE:-UTC}
    volumes:
      - mautic_data:/var/www/html
  mautic-worker:
    image: mautic/mautic:5.1.1-apache
    restart: unless-stopped
    depends_on:
      mautic:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      - DOCKER_MAUTIC_ROLE=mautic_worker
      - DOCKER_MAUTIC_WORKERS_CONSUME_EMAIL=2
      - DOCKER_MAUTIC_WORKERS_CONSUME_HIT=2
      - DOCKER_MAUTIC_WORKERS_CONSUME_FAILED=2
      - MAUTIC_DB_HOST=${MAUTIC_DB_HOST:-mysql}
      - MAUTIC_DB_PORT=${MAUTIC_DB_PORT:-3306}
      - MAUTIC_DB_DATABASE=${MAUTIC_DB_DATABASE:-mautic}
      - MAUTIC_DB_USER=${MAUTIC_DB_USER:-mautic}
      - MAUTIC_DB_PASSWORD=${SERVICE_PASSWORD_DB_PASSWORD}
      - MAUTIC_URL=${SERVICE_URL_MAUTIC}
      - MAUTIC_MESSENGER_DSN_EMAIL=${MAUTIC_MESSENGER_DSN_EMAIL:-doctrine://default}
      - MAUTIC_MESSENGER_DSN_HIT=${MAUTIC_MESSENGER_DSN_HIT:-doctrine://default}
      - PHP_INI_DATE_TIMEZONE=${PHP_INI_DATE_TIMEZONE:-UTC}
    volumes:
      - mautic_data:/var/www/html
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
      SERVICE_FQDN_PHPMYADMIN_80:
    expose:
      - 80
volumes:
  mysql_data:
  mautic_data:
