# name: Moltbot
# about: WhatsApp gateway CLI with Pi RPC agent - self-hosted AI-powered messaging platform.
# docs: https://docs.molt.bot
# website: https://molt.bot
# categories: communication, ai, networking
# source: dokploy
services:
  moltbot-gateway:
    image: ghcr.io/moltbot/clawdbot:2026.1.24-1
    environment:
      HOME: /home/node
      TERM: xterm-256color
      CLAWDBOT_GATEWAY_TOKEN: ${SERVICE_PASSWORD_GATEWAY_TOKEN}
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY:-}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY:-}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE:-}
      CLAWDBOT_GATEWAY_URL: ws://0.0.0.0:18789
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-YOUR-API-KEY}
      SERVICE_FQDN_MOLTBOT_GATEWAY_18789:
    volumes:
      - moltbot-config:/home/node/.clawdbot
      - moltbot-workspace:/home/node/clawd
    expose:
      - "18789"
      - "18790"
    init: true
    restart: unless-stopped
    command: ["node", "dist/index.js", "gateway", "--bind", "auto", "--port", "18789", "--allow-unconfigured"]
volumes:
  moltbot-config:
  moltbot-workspace:
