# name: Postgresus
# about: Deprecated: the project was renamed to Databasus, use the Databasus template instead.
# docs: https://databasus.com
# categories: database, storage
# source: dokploy
services:
  postgresus:
    image: rostislavdugin/postgresus:v2.15.3
    expose:
      - "4005"
    volumes:
      - postgresus-data:/postgresus-data
    restart: unless-stopped
    environment:
      - TZ=UTC
      - SERVICE_FQDN_POSTGRESUS_4005
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4005"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
volumes:
  postgresus-data:
