# name: Gathio
# about: A privacy-first event host where people make an event page without an account and share its link.
# docs: https://github.com/lowercasename/gathio/blob/main/docs/running-gathio/installation.md
# website: https://github.com/lowercasename/gathio
# categories: productivity, communication
# source: musdash
services:
  gathio:
    image: ghcr.io/lowercasename/gathio:latest
    environment:
      - SERVICE_FQDN_GATHIO_3000
      - NODE_ENV=production
    configs:
      - source: gathio-config
        target: /app/config/config.toml
    volumes:
      - gathio-static:/app/static
      - gathio-events:/app/public/events
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 30
volumes:
  gathio-events:
  gathio-static:
  mongo-data:
configs:
  gathio-config:
    content: |
      [general]
      domain = "${SERVICE_FQDN_GATHIO}"
      port = "3000"
      email = "${GATHIO_CONTACT_EMAIL:-contact@example.com}"
      site_name = "${GATHIO_SITE_NAME:-Gathio}"
      is_federated = true
      delete_after_days = ${GATHIO_DELETE_AFTER_DAYS:-7}
      email_logo_url = ""
      show_kofi = false
      show_public_event_list = false
      max_comment_length = 5000
      mail_service = "${GATHIO_MAIL_SERVICE:-none}"
      creator_email_addresses = []

      [database]
      mongodb_url = "mongodb://mongo:27017/gathio"

      [nodemailer]
      smtp_server = "${GATHIO_SMTP_SERVER:-}"
      smtp_port = "${GATHIO_SMTP_PORT:-}"
      smtp_username = "${GATHIO_SMTP_USERNAME:-}"
      smtp_password = "${GATHIO_SMTP_PASSWORD:-}"
