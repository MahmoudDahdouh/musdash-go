# name: LibreSpeed
# about: Self-hosted lightweight Speed Test.
# docs: https://github.com/librespeed/speedtest
# categories: devtools, monitoring
# source: coolify
services:
  librespeed:
    image: 'ghcr.io/librespeed/speedtest:latest'
    environment:
      - SERVICE_URL_LIBRESPEED_82
      - MODE=standalone
      - TELEMETRY=false
      - DISTANCE=km
      - WEBPORT=82
    healthcheck:
      test: 'curl 127.0.0.1:82 || exit 1'
      timeout: 1s
      interval: 1m0s
      retries: 1
