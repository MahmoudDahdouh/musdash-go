# name: Flowise
# about: Flowise is an open source low-code tool for developers to build customized LLM orchestration flows & AI agents.
# docs: https://docs.flowiseai.com/
# categories: ai, backend, devtools
# source: coolify
services:
  flowise:
    image: flowiseai/flowise:latest
    environment:
      - SERVICE_URL_FLOWISE_3001
      - DEBUG=${DEBUG:-false}
      - DISABLE_FLOWISE_TELEMETRY=${DISABLE_FLOWISE_TELEMETRY:-true}
      - PORT=${PORT:-3001}
      - DATABASE_PATH=/root/.flowise
      - APIKEY_PATH=/root/.flowise
      - SECRETKEY_PATH=/root/.flowise
      - LOG_PATH=/root/.flowise/logs
      - BLOB_STORAGE_PATH=/root/.flowise/storage
      - FLOWISE_USERNAME=${SERVICE_USER_FLOWISE}
      - FLOWISE_PASSWORD=${SERVICE_PASSWORD_FLOWISE}
    volumes:
      - flowise-data:/root/.flowise
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 3
volumes:
  flowise-data:
