# name: Browserless
# about: A headless Chrome browser as a service.
# docs: https://docs.browserless.io/
# categories: devtools, backend
# source: coolify
services:
  browserless:
    image: ghcr.io/browserless/chromium:latest
    environment:
      - SERVICE_URL_BROWSERLESS_3000
      - TOKEN=$SERVICE_PASSWORD_BROWSERLESS
    expose:
      - 3000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/docs"]
      interval: 2s
      timeout: 10s
      retries: 15
