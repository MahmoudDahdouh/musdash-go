# name: CertMate
# about: CertMate is an SSL certificate management system with a web UI and REST API.
# docs: https://www.certmate.org/docs/
# website: https://www.certmate.org/
# categories: networking, security
# source: dokploy
services:
  certmate:
    image: fabriziosalmi/certmate:2.21.3
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SERVICE_PASSWORD_SECRET_KEY}
      - API_BEARER_TOKEN=${SERVICE_PASSWORD_API_BEARER_TOKEN}
      - BEHIND_PROXY=${BEHIND_PROXY:-true}
      - CLOUDFLARE_TOKEN=${CLOUDFLARE_TOKEN:-}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SERVICE_FQDN_CERTMATE_8000
    expose:
      - 8000
    volumes:
      - certmate_certificates:/app/certificates
      - certmate_data:/app/data
      - certmate_logs:/app/logs
      - certmate_backups:/app/backups
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
volumes:
  certmate_certificates:
  certmate_data:
  certmate_logs:
  certmate_backups:
