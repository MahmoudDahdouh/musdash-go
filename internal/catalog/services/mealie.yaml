# name: Mealie
# about: A recipe manager and meal planner.
# docs: https://docs.mealie.io/
# categories: productivity, home
# source: coolify
services:
  mealie:
    image: 'ghcr.io/mealie-recipes/mealie:3.17.0'
    environment:
      - SERVICE_URL_MEALIE_9000
      - ALLOW_SIGNUP=${ALLOW_SIGNUP:-true}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Berlin}
      - MAX_WORKERS=${MAX_WORKERS:-1}
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-1}
    volumes:
      - mealie_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/9000' || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 5
volumes:
  mealie_data:
