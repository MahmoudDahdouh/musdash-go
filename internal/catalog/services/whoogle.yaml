# name: Whoogle
# about: Whoogle is a self-hosted, privacy-focused search engine front-end for accessing Google search results without tracking and data collection.
# docs: https://github.com/benbusby/whoogle-search?tab=readme-ov-file
# categories: search
# source: coolify
services:
  whoogle:
    image: benbusby/whoogle-search:latest
    environment:
      - SERVICE_URL_WHOOGLE_5000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5000"]
      interval: 2s
      timeout: 10s
      retries: 15
