# name: FreeScout
# about: FreeScout is the super lightweight and powerful free open source help desk and shared inbox written in PHP (Laravel framework).
# docs: https://github.com/freescout-help-desk/freescout/wiki/
# categories: support
# source: coolify
services:
  freescout:
    image: tiredofit/freescout:latest
    volumes:
      - freescout-data:/data
      - freescout-logs:/www/logs
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      - SERVICE_URL_FREESCOUT_80
      - DB_HOST=mariadb
      - DB_NAME=${MARIADB_DATABASE:-freescout}
      - DB_USER=${SERVICE_USER_MARIADB:-freescout}
      - DB_PASS=${SERVICE_PASSWORD_MARIADB}
      - SITE_URL=${SERVICE_URL_FREESCOUT}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      - ADMIN_PASS=${SERVICE_PASSWORD_ADMIN}
      - DISPLAY_ERRORS=${DISPLAY_ERRORS:-FALSE}
      - TIMEZONE=${TIMEZONE:-UTC}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1"]
      start_period: 10s
      interval: 5s
      timeout: 10s
      retries: 15
  mariadb:
    image: mariadb:latest
    volumes:
      - mariadb-data:/var/lib/mysql
    environment:
      - MARIADB_ROOT_PASSWORD=${SERVICE_PASSWORD_ROOT}
      - MARIADB_DATABASE=${MARIADB_DATABASE:-freescout}
      - MARIADB_USER=${SERVICE_USER_MARIADB}
      - MARIADB_PASSWORD=${SERVICE_PASSWORD_MARIADB}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 5s
      timeout: 10s
      retries: 15
volumes:
  freescout-data:
  freescout-logs:
  mariadb-data:
