# name: OxiCloud
# about: A file storage server written in Rust, with WebDAV, CalDAV and CardDAV, backed by PostgreSQL.
# docs: https://github.com/AtalayaLabs/OxiCloud#quick-start
# website: https://atalayalabs.github.io/OxiCloud/
# categories: storage
services:
  oxicloud:
    image: diocrafts/oxicloud:latest
    environment:
      - SERVICE_FQDN_OXICLOUD_8086
      - OXICLOUD_SERVER_HOST=0.0.0.0
      - OXICLOUD_SERVER_PORT=8086
      - OXICLOUD_BASE_URL=${SERVICE_URL_OXICLOUD}
      - OXICLOUD_COOKIE_SECURE=true
      - OXICLOUD_JWT_SECRET=${SERVICE_PASSWORD_64_JWT}
      - OXICLOUD_DB_CONNECTION_STRING=postgres://oxicloud:${SERVICE_PASSWORD_POSTGRES}@postgres/oxicloud
      - OXICLOUD_STORAGE_PATH=/app/storage
      - OXICLOUD_OIDC_ENABLED=false
      - OXICLOUD_WOPI_ENABLED=false
      - MIMALLOC_PURGE_DELAY=0
    volumes:
      - oxicloud-storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:8086/ready || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 30
  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=oxicloud
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DB=oxicloud
    volumes:
      - oxicloud-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
