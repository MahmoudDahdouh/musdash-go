# name: Betula
# about: A single-user bookmark manager that publishes links to the Fediverse, with tags, archive copies and RSS.
# docs: https://joinbetula.org/installation.html
# website: https://joinbetula.org/
# categories: rss
services:
  betula:
    image: bouncepaw/betula:latest
    environment:
      - SERVICE_FQDN_BETULA_1738
    volumes:
      - betula-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:1738/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
