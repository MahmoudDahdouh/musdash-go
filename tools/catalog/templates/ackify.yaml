# name: Ackify
# about: A proof-of-read service where people confirm they have read a document, with signed receipts and reminders.
# docs: https://github.com/kOlapsis/ackify/blob/main/docs/en/getting-started.md
# website: https://ackify.eu
# categories: business, docs
services:
  ackify:
    image: kolapsis/ackify:latest
    environment:
      - SERVICE_FQDN_ACKIFY_8080
      - ACKIFY_BASE_URL=${SERVICE_URL_ACKIFY}
      - ACKIFY_ORGANISATION=${ACKIFY_ORGANISATION:-My Organisation}
      - ACKIFY_DB_DSN=postgres://ackify_app:${SERVICE_PASSWORD_APP}@ackify-db:5432/ackify?sslmode=disable
      - ACKIFY_OAUTH_PROVIDER=${ACKIFY_OAUTH_PROVIDER:-github}
      - ACKIFY_OAUTH_CLIENT_ID=${ACKIFY_OAUTH_CLIENT_ID:?}
      - ACKIFY_OAUTH_CLIENT_SECRET=${ACKIFY_OAUTH_CLIENT_SECRET:?}
      - ACKIFY_OAUTH_ALLOWED_DOMAIN=${ACKIFY_OAUTH_ALLOWED_DOMAIN:-}
      - ACKIFY_OAUTH_COOKIE_SECRET=${SERVICE_BASE64_COOKIE}
      - ACKIFY_ED25519_PRIVATE_KEY=${SERVICE_BASE64_64_ED25519}
      - ACKIFY_LISTEN_ADDR=:8080
      - ACKIFY_ADMIN_EMAILS=${ACKIFY_ADMIN_EMAILS:?}
      - ACKIFY_MAIL_HOST=${SMTP_HOST:-}
      - ACKIFY_MAIL_PORT=${SMTP_PORT:-587}
      - ACKIFY_MAIL_USERNAME=${SMTP_USERNAME:-}
      - ACKIFY_MAIL_PASSWORD=${SMTP_PASSWORD:-}
      - ACKIFY_MAIL_FROM=${SMTP_FROM:-noreply@localhost}
      - ACKIFY_TELEMETRY=false
      - ACKIFY_STORAGE_TYPE=local
      - ACKIFY_STORAGE_LOCAL_PATH=/data/documents
    volumes:
      - ackify-storage:/data/documents
    depends_on:
      ackify-migrate:
        condition: service_completed_successfully
      ackify-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/ackify", "health"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 30
  ackify-migrate:
    image: kolapsis/ackify:latest
    entrypoint: []
    command: ["/app/migrate", "up"]
    environment:
      - ACKIFY_DB_DSN=postgres://postgres:${SERVICE_PASSWORD_POSTGRES}@ackify-db:5432/ackify?sslmode=disable
      - ACKIFY_APP_PASSWORD=${SERVICE_PASSWORD_APP}
    depends_on:
      ackify-db:
        condition: service_healthy
    restart: "no"
  ackify-db:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DB=ackify
    volumes:
      - ackify-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
