# name: autobrr
# about: Automates torrent and Usenet downloads by watching IRC announce channels and RSS feeds and sending matches to your download clients.
# docs: https://autobrr.com/installation/docker
# website: https://autobrr.com
# categories: media, automation
services:
  autobrr:
    image: ghcr.io/autobrr/autobrr:latest
    environment:
      - SERVICE_FQDN_AUTOBRR_7474
      - AUTOBRR__HOST=0.0.0.0
      - TZ=${TZ:-UTC}
    volumes:
      - autobrr-config:/config
    healthcheck:
      test: ["CMD-SHELL", "curl -fs -o /dev/null http://127.0.0.1:7474/api/healthz/liveness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
