# name: Velld
# about: A web app that schedules and runs backups of PostgreSQL, MySQL, MongoDB and Redis databases and stores them on the server.
# docs: https://velld.vercel.app/docs/installation
# website: https://github.com/dendianugerah/velld
# categories: database, storage
services:
  web:
    image: ghcr.io/dendianugerah/velld/web:latest
    environment:
      - SERVICE_FQDN_WEB_3000
      - NEXT_PUBLIC_API_URL=${SERVICE_URL_API}
      - ALLOW_REGISTER=${ALLOW_REGISTER:-false}
    depends_on:
      api:
        condition: service_started
  api:
    image: ghcr.io/dendianugerah/velld/api:latest
    environment:
      - SERVICE_FQDN_API_8080
      - JWT_SECRET=${SERVICE_HEX_64_JWT}
      - ENCRYPTION_KEY=${SERVICE_HEX_64_ENCRYPTION}
      - ADMIN_USERNAME_CREDENTIAL=${SERVICE_USER_ADMIN}
      - ADMIN_PASSWORD_CREDENTIAL=${SERVICE_PASSWORD_ADMIN}
      - ALLOW_REGISTER=${ALLOW_REGISTER:-false}
    volumes:
      - velld-data:/app/data
      - velld-backups:/app/backups
