# name: Frigate
# about: A video recorder for IP cameras that detects people, cars and other objects in the streams as they arrive.
# docs: https://docs.frigate.video/frigate/installation
# website: https://frigate.video
# categories: home, media, ai
services:
  frigate:
    image: ghcr.io/blakeblackshear/frigate:stable
    entrypoint: ["sh", "-c", "[ -e /config/config.yml ] || [ -e /config/config.yaml ] || cp /usr/local/share/frigate-first-config.yml /config/config.yml; exec /init"]
    stop_grace_period: 30s
    shm_size: "512mb"
    environment:
      - SERVICE_FQDN_FRIGATE_8971
      - TZ=${TZ:-UTC}
      - FRIGATE_RTSP_PASSWORD=${FRIGATE_RTSP_PASSWORD:-}
    volumes:
      - frigate-config:/config
      - frigate-media:/media/frigate
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    configs:
      - source: frigate-first-config
        target: /usr/local/share/frigate-first-config.yml
    ports:
      - "8555:8555/tcp"
      - "8555:8555/udp"
configs:
  frigate-first-config:
    content: |
      mqtt:
        enabled: False

      tls:
        enabled: False

      detectors:
        ov:
          type: openvino
          device: CPU
      model:
        width: 300
        height: 300
        input_tensor: nhwc
        input_pixel_format: bgr
        path: /openvino-model/ssdlite_mobilenet_v2.xml
        labelmap_path: /openvino-model/coco_91cl_bkgr.txt

      cameras: {}
      version: 0.18-0
