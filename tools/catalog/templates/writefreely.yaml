# name: WriteFreely
# about: A minimalist blogging platform for writers, with Markdown posts, multiple blogs per account and ActivityPub federation.
# docs: https://writefreely.org/docs/latest/admin/config
# website: https://writefreely.org/
# categories: cms, communication
services:
  writefreely:
    image: ghcr.io/writefreely/writefreely:latest
    entrypoint:
      - sh
      - -c
      - |
        if [ ! -f keys/csrf.aes256 ]; then
          cmd/writefreely/writefreely db init &&
          cmd/writefreely/writefreely keys generate &&
          { cmd/writefreely/writefreely user create --admin "${SERVICE_USER_ADMIN}:${SERVICE_PASSWORD_ADMIN}" || true; }
        fi &&
        cmd/writefreely/writefreely db migrate &&
        exec cmd/writefreely/writefreely
    environment:
      - SERVICE_FQDN_WRITEFREELY_8080
    configs:
      - source: writefreely-config
        target: /go/config.ini
    volumes:
      - writefreely-keys:/go/keys
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
  db:
    image: mariadb:11
    environment:
      - MARIADB_ROOT_PASSWORD=${SERVICE_PASSWORD_ROOT}
      - MARIADB_DATABASE=writefreely
      - MARIADB_USER=${SERVICE_USER_WRITEFREELY}
      - MARIADB_PASSWORD=${SERVICE_PASSWORD_WRITEFREELY}
    volumes:
      - writefreely-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 40
configs:
  writefreely-config:
    content: |
      [server]
      port = 8080
      bind = 0.0.0.0

      [database]
      type = mysql
      username = ${SERVICE_USER_WRITEFREELY}
      password = ${SERVICE_PASSWORD_WRITEFREELY}
      database = writefreely
      host = db
      port = 3306

      [app]
      site_name = ${WRITEFREELY_SITE_NAME:-WriteFreely}
      site_description =
      host = ${SERVICE_URL_WRITEFREELY}
      theme = write
      editor =
      disable_js = false
      webfonts = true
      landing =
      single_user = false
      open_registration = ${WRITEFREELY_OPEN_REGISTRATION:-false}
      min_username_len = 3
      max_blogs = 1
      federation = true
      public_stats = true
      private = false
      local_timeline = false
      update_checks = false
