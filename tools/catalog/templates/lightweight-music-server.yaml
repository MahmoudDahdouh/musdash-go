# name: Lightweight Music Server
# about: A self-hosted music streaming server with a web player that scans libraries of audio files and also speaks the Subsonic API.
# docs: https://hub.docker.com/r/epoupon/lms
# website: https://github.com/epoupon/lms
# categories: media
services:
  lms:
    image: epoupon/lms:latest
    environment:
      - SERVICE_FQDN_LMS_5082
    volumes:
      - lms-data:/var/lms
      - lms-music:/music
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:5082/ || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 20
