# name: ExcaliDash
# about: A self-hosted workspace for Excalidraw with saved drawings, collections, real-time collaboration and version history.
# docs: https://excalidash.xyz/deploy/docker
# website: https://excalidash.xyz/
# categories: productivity, docs
services:
  frontend:
    image: zimengxiong/excalidash-frontend:latest
    environment:
      - SERVICE_FQDN_FRONTEND_8080
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080"]
      interval: 10s
      timeout: 10s
      retries: 30
  backend:
    image: zimengxiong/excalidash-backend:latest
    init: true
    environment:
      - DATABASE_PROVIDER=sqlite
      - DATABASE_URL=file:/app/prisma/dev.db
      - PORT=8000
      - NODE_ENV=production
      - AUTH_MODE=local
      - FILE_UPLOAD_MAX_MB=100
      - FRONTEND_URL=${SERVICE_URL_FRONTEND}
      - TRUST_PROXY=1
      - JWT_SECRET=${SERVICE_PASSWORD_64_JWT}
      - CSRF_SECRET=${SERVICE_PASSWORD_64_CSRF}
    volumes:
      - backend-data:/app/prisma
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s
