# name: BunkerM
# about: A Mosquitto MQTT broker packaged with a web interface for managing clients, ACLs, topics and message history.
# docs: https://github.com/bunkeriot/BunkerM#-quick-start
# website: https://github.com/bunkeriot/BunkerM
# categories: home, networking
services:
  bunkerm:
    image: bunkeriot/bunkerm:latest
    environment:
      - SERVICE_FQDN_BUNKERM_2000
      - MQTT_BROKER=localhost
      - MQTT_PORT=1900
      - MQTT_USERNAME=${SERVICE_USER_MQTT}
      - MQTT_PASSWORD=${SERVICE_PASSWORD_MQTT}
      - JWT_SECRET=${SERVICE_PASSWORD_64_JWT}
      - API_KEY=${SERVICE_PASSWORD_64_APIKEY}
      - AUTH_SECRET=${SERVICE_PASSWORD_64_AUTH}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - FRONTEND_URL=${SERVICE_URL_BUNKERM}
      - ALLOWED_ORIGINS=*
      - ALLOWED_HOSTS=*
      - RATE_LIMIT_PER_MINUTE=100
      - LOG_LEVEL=INFO
      - API_LOG_FILE=/var/log/api/api_activity.log
      - BROKER_LOG_PATH=/var/log/mosquitto/mosquitto.log
      - CLIENT_LOG_PATH=/var/log/api/api_activity.log
      - DYNSEC_PATH=/var/lib/mosquitto/dynamic-security.json
      - MAX_UPLOAD_SIZE=10485760
      - SSL_CERT_PATH=/app/certs/cert.pem
      - SSL_KEY_PATH=/app/certs/key.pem
      - BUNKERAI_API_KEY=${BUNKERAI_API_KEY:-}
    ports:
      - "1900:1900"
    volumes:
      - bunkerm-next-data:/nextjs/data
      - bunkerm-mosquitto-data:/var/lib/mosquitto
      - bunkerm-history-data:/var/lib/history
    healthcheck:
      test: ["CMD", "curl", "-fs", "-o", "/dev/null", "http://127.0.0.1:2000/"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s
