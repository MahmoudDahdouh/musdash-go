# name: Password Pusher
# about: Shares passwords, text, URLs and files through links that expire after a set number of views or days.
# docs: https://docs.pwpush.com/docs/installation/
# website: https://docs.pwpush.com
# categories: security, productivity
services:
  pwpush:
    image: docker.io/pglombardo/pwpush:latest
    environment:
      - SERVICE_FQDN_PWPUSH_5100
      - PWPUSH_MASTER_KEY=${SERVICE_HEX_64_MASTER}
      - SECRET_KEY_BASE=${SERVICE_HEX_64_SECRET}
      - PWP__OVERRIDE_BASE_URL=${SERVICE_URL_PWPUSH}
      - PWP__FILES__STORAGE=local
    volumes:
      - pwpush-storage:/opt/PasswordPusher/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5100/up"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s
