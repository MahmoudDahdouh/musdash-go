# name: PinePods
# about: A podcast manager and player for the browser, with multiple users, downloads, and sync with podcast apps through gpodder.
# docs: https://www.pinepods.online/docs/intro
# website: https://pinepods.online/
# categories: media, rss
services:
  pinepods:
    image: madeofpendletonwool/pinepods:latest
    environment:
      - SERVICE_FQDN_PINEPODS_8040
      - SEARCH_API_URL=https://search.pinepods.online/api/search
      - PEOPLE_API_URL=https://people.pinepods.online
      - HOSTNAME=${SERVICE_URL_PINEPODS}
      - USERNAME=${SERVICE_USER_ADMIN}
      - PASSWORD=${SERVICE_PASSWORD_ADMIN}
      - FULLNAME=Admin
      - EMAIL=${ADMIN_EMAIL:-admin@example.com}
      - DB_TYPE=postgresql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${SERVICE_USER_POSTGRES}
      - DB_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - DB_NAME=pinepods_database
      - VALKEY_HOST=valkey
      - VALKEY_PORT=6379
      - DEBUG_MODE=false
      - TZ=${TZ:-UTC}
    volumes:
      - pinepods-downloads:/opt/pinepods/downloads
      - pinepods-backups:/opt/pinepods/backups
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8040/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 30s
  db:
    image: postgres:17-alpine
    environment:
      - POSTGRES_DB=pinepods_database
      - POSTGRES_USER=${SERVICE_USER_POSTGRES}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - pinepods-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20
  valkey:
    image: valkey/valkey:8-alpine
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
