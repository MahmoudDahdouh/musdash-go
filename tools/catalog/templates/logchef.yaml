# name: Logchef
# about: A log analytics interface for ClickHouse and VictoriaLogs, with search, saved queries, teams and alerts.
# docs: https://logchef.app/getting-started/quickstart/
# website: https://logchef.app/
# categories: monitoring, devtools
services:
  logchef:
    image: ghcr.io/mr-karan/logchef:latest
    environment:
      - SERVICE_FQDN_LOGCHEF_8125
      - LOGCHEF_AUTH__LOCAL__ADMIN_PASSWORD=${SERVICE_PASSWORD_ADMIN}
    configs:
      - source: logchef-config
        target: /etc/logchef/config.toml
    volumes:
      - logchef-data:/data
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:8125/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
  clickhouse:
    image: clickhouse/clickhouse-server:24.8.4
    environment:
      - CLICKHOUSE_DB=default
      - CLICKHOUSE_USER=${SERVICE_USER_CLICKHOUSE}
      - CLICKHOUSE_PASSWORD=${SERVICE_PASSWORD_CLICKHOUSE}
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
configs:
  logchef-config:
    content: |
      [server]
      port = 8125
      host = "0.0.0.0"
      frontend_url = "${SERVICE_URL_LOGCHEF}"
      secure_cookie = ${LOGCHEF_SECURE_COOKIE:-false}

      [sqlite]
      path = "/data/local.db"

      [auth]
      admin_emails = ["${LOGCHEF_ADMIN_EMAIL:-admin@logchef.internal}"]
      api_token_secret = "${SERVICE_HEX_64_TOKEN}"

      [auth.local]
      enabled = true
      admin_email = "${LOGCHEF_ADMIN_EMAIL:-admin@logchef.internal}"

      [logging]
      level = "info"
