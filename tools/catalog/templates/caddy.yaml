# name: Caddy
# about: A web server that serves a site's files or passes requests on to another service, set up in one Caddyfile.
# docs: https://caddyserver.com/docs/running#docker-compose
# website: https://caddyserver.com/
# categories: networking
services:
  caddy:
    image: caddy:2
    environment:
      - SERVICE_FQDN_CADDY_80
    volumes:
      - caddy-site:/usr/share/caddy
      - caddy-data:/data
      - caddy-config:/config
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
configs:
  caddyfile:
    content: |
      :80 {
      	root * /usr/share/caddy
      	file_server
      }
